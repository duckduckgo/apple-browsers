name: iOS - Sync-End-to-End tests

defaults:
  run:
    working-directory: iOS

on:
  schedule:
    - cron: '0 1 * * *' # run at 1 AM UTC
  workflow_dispatch:
  workflow_call:
    inputs:
      branch:
        description: "Branch name"
        required: false
        type: string
      use-prebuilt-app:
        description: "Use the app built earlier in the calling workflow run instead of building one"
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-ios-sync-end-to-end
  cancel-in-progress: true

jobs:
  build-for-sync-end-to-end-tests:
    name: Build for Sync End To End Tests
    if: ${{ !inputs.use-prebuilt-app }}
    uses: ./.github/workflows/ios_build_end_to_end_app.yml
    with:
      branch: ${{ inputs.branch }}
      compilation-cache-key: xcode-compilation-cache-ios-sync-e2e
      duration-pixel-name: m_ci_apple_duration_ios_sync_tests_build
    secrets: inherit

  sync-end-to-end-tests:
    name: Sync End To End Tests
    needs: build-for-sync-end-to-end-tests
    if: ${{ !cancelled() && contains(fromJSON('["success", "skipped"]'), needs.build-for-sync-end-to-end-tests.result) }}
    runs-on: macos-26

    env:
      RUNS_ON: macos-26 # keep this in sync with runs-on above

    timeout-minutes: 240

    steps:
    - name: Check out the code
      uses: actions/checkout@v6 # Don't need submodules here as this is only for the tests folder
      with:
        ref: ${{ inputs.branch || github.sha }}

    - name: Print macOS version
      run: sw_vers

    - name: Start measuring duration
      id: start-duration
      uses: ./.github/actions/measure-duration
      with:
        mode: start

    - name: Create test account for Sync and return the recovery code
      uses: duckduckgo/sync_crypto/action@chore/github-action-node24-runtime
      id: sync-recovery-code
      with:
        debug: true

    - name: Retrieve Binary
      uses: actions/download-artifact@v7
      with:
        name: duckduckgo-ios-app
        path: iOS/DerivedData/Build/Products/Debug-iphonesimulator/DuckDuckGo.app

    - name: Overwrite default config with sync one
      run: |
        cp ../.maestro/config-sync ../.maestro/config.yaml

    - name: Sync e2e tests
      id: upload
      uses: mobile-dev-inc/action-maestro-cloud@v3.0.1
      with:
        api-key: ${{ secrets.ROBIN_API_KEY }}
        project-id: ${{ vars.ROBIN_PROJECT_KEY }}
        name: sync_${{ inputs.branch || github.sha }}
        timeout: 240
        app-file: iOS/DerivedData/Build/Products/Debug-iphonesimulator/DuckDuckGo.app
        workspace: .maestro
        include-tags: sync
        env: |
          ONBOARDING_COMPLETED=true
          CODE=${{ steps.sync-recovery-code.outputs.recovery-code }}
        device-os: iOS-18-2
        device-model: iPhone-16

    - name: Reset config
      run: |
        git checkout ../.maestro/config.yaml

    - name: Report job duration
      if: success() || (always() && steps.upload.outcome == 'failure')
      continue-on-error: true
      uses: ./.github/actions/measure-duration
      with:
        mode: stop
        start-timestamp: ${{ steps.start-duration.outputs.start-timestamp }}
        pixel-name: m_ci_apple_duration_ios_18_sync_tests
        pixel-params: |
          runner: ${{ env.RUNS_ON }}

    - name: Send Status Pixel
      if: always() && github.ref_name == 'main' && !inputs.branch
      uses: ./.github/actions/send-pixel
      with:
        pixel-name: m_ci_apple_status_ios_e2e_sync_${{ steps.upload.outcome }}

  notify-failure:
    name: Notify on failure
    if: ${{ always() && contains(join(needs.*.result, ','), 'failure') && github.ref_name == 'main' && !inputs.branch }}
    needs: [build-for-sync-end-to-end-tests, sync-end-to-end-tests]
    runs-on: ubuntu-latest

    steps:
    - name: Check out the code
      uses: actions/checkout@v6
    - name: Create Asana task when workflow failed
      run: |
        curl -s "https://app.asana.com/api/1.0/tasks" \
          --header "Accept: application/json" \
          --header "Authorization: Bearer ${{ secrets.ASANA_ACCESS_TOKEN }}" \
          --header "Content-Type: application/json" \
          --data ' { "data": { "name": "GH Workflow Failure - Sync End to end tests", "workspace": "${{ vars.ASANA_WORKSPACE_ID }}", "projects": [ "${{ vars.GH_ASANA_IOS_APP_PROJECT_ID }}" ], "notes" : "The end to end workflow has failed. See https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" } }'
