name: Smartling - Release Submission

# Submits a release branch to Smartling once, at code freeze. Called from the code freeze workflows,
# where nothing depends on it, so it never blocks the release.
# To test without authorizing anything, run it manually against a test branch with a fake 0.x.y version
# and auto_authorize_max_usd set to 0.
on:
  workflow_call:
    inputs:
      platform:
        description: "Platform (iOS or macOS)"
        required: true
        type: string
      branch:
        description: "Release branch, e.g. release/ios/7.200.0"
        required: true
        type: string
      version:
        description: "Release version (taken from a release/<platform>/<version> branch if empty)"
        required: false
        type: string
      asana_task_url:
        description: "Release Asana task, commented on if the submission fails"
        required: false
        type: string
      auto_authorize_max_usd:
        description: "Authorize the job if its maximum USD estimate is at most this (0 never authorizes)"
        required: false
        type: string
        default: "500.00"
      dry_run:
        description: "Export and resolve the job name without writing to Smartling or Asana"
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform"
        required: true
        type: choice
        options:
          - iOS
          - macOS
      branch:
        description: "Release branch, e.g. release/ios/7.200.0"
        required: true
        type: string
      version:
        description: "Release version (taken from a release/<platform>/<version> branch if empty)"
        required: false
        type: string
      asana_task_url:
        description: "Release Asana task, commented on if the submission fails"
        required: false
        type: string
      auto_authorize_max_usd:
        description: "Authorize the job if its maximum USD estimate is at most this (0 never authorizes)"
        type: string
        default: "500.00"
      dry_run:
        description: "Export and resolve the job name without writing to Smartling or Asana"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  smartling:
    name: ${{ inputs.platform }} release translation job
    runs-on: macos-26
    timeout-minutes: 45
    # A failed submission is reported on the release task instead of failing the code freeze run.
    continue-on-error: true

    env:
      PLATFORM: ${{ inputs.platform }}
      RELEASE_BRANCH: ${{ inputs.branch }}
      AUTO_AUTHORIZE_MAX_USD: ${{ inputs.auto_authorize_max_usd || '500.00' }}

    steps:
      - name: Register SSH keys for private repos
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY_DUCKSANS_FONT }}

      - name: Check out the release branch
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}
          submodules: recursive

      # The release import finds this job by its exact name and downloads the files under the release branch,
      # so the job name and file URI prefix are its contract. Don't change them without updating the import.
      - name: Resolve Smartling job name
        id: job
        env:
          VERSION: ${{ inputs.version }}
        run: |
          platform_lowercase="$(echo "$PLATFORM" | tr '[:upper:]' '[:lower:]')"
          release_branch_prefix="release/${platform_lowercase}/"
          if [[ -z "$VERSION" && "$RELEASE_BRANCH" == "$release_branch_prefix"* ]]; then
            VERSION="${RELEASE_BRANCH#"$release_branch_prefix"}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Can't resolve a release version from version '$VERSION' and branch '$RELEASE_BRANCH'." >&2
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "job_name=Release $PLATFORM $VERSION"
            echo "file_uri_prefix=$RELEASE_BRANCH"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve platform configuration
        run: |
          case "$PLATFORM" in
            iOS)
              {
                echo "SMARTLING_USER_ID=${{ secrets.IOS_SMARTLING_USER_ID }}"
                echo "SMARTLING_USER_SECRET=${{ secrets.IOS_SMARTLING_USER_SECRET }}"
                echo "SMARTLING_PROJECT_ID=${{ vars.IOS_SMARTLING_PROJECT_ID }}"
                echo "ASANA_PROJECT_ID=${{ vars.GH_ASANA_IOS_APP_PROJECT_ID }}"
                echo "ASANA_INCOMING_SECTION_NAME=Incoming"
                echo "ASANA_TRIAGE_ROTATION_SECTION_ID=1210869535563575"
                echo "REVIEW_TASK_GITHUB_ASSIGNEE=pballart"
              } >> "$GITHUB_ENV"
              ;;
            macOS)
              {
                echo "SMARTLING_USER_ID=${{ secrets.MACOS_SMARTLING_USER_ID }}"
                echo "SMARTLING_USER_SECRET=${{ secrets.MACOS_SMARTLING_USER_SECRET }}"
                echo "SMARTLING_PROJECT_ID=${{ vars.MACOS_SMARTLING_PROJECT_ID }}"
                echo "ASANA_PROJECT_ID=${{ vars.MACOS_APP_DEVELOPMENT_ASANA_PROJECT_ID }}"
                echo "ASANA_INCOMING_SECTION_NAME=Incoming: Dev Related Issues"
                echo "ASANA_TRIAGE_ROTATION_SECTION_ID=1210871971126998"
                echo "REVIEW_TASK_GITHUB_ASSIGNEE=andremartingo"
              } >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unknown platform: $PLATFORM" >&2
              exit 1
              ;;
          esac

      - name: Select Xcode
        uses: ./.github/actions/select-xcode-version

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install aiohttp

      - name: Install xmlstarlet
        if: inputs.platform == 'macOS'
        run: brew install xmlstarlet

      - name: Export localizations
        run: |
          set -e -o pipefail
          "./$PLATFORM/scripts/loc_export.sh" | xcbeautify

      # Using the job name as the pending prefix means a rerun of code freeze finds this release's own job
      # (awaiting authorization or not) and doesn't create a second one, while other releases' jobs are ignored.
      - name: Submit ${{ inputs.platform }} release strings to Smartling
        id: submit
        if: ${{ !inputs.dry_run }}
        env:
          JOB_NAME: ${{ steps.job.outputs.job_name }}
          FILE_URI_PREFIX: ${{ steps.job.outputs.file_uri_prefix }}
        run: |
          ./scripts/smartling/smartling_submit.sh "$PLATFORM" \
            --job-name "$JOB_NAME" \
            --pending-job-prefix "$JOB_NAME" \
            --file-uri-prefix "$FILE_URI_PREFIX" \
            --auto-authorize-max-usd "$AUTO_AUTHORIZE_MAX_USD"

      - name: Print dry run result
        if: inputs.dry_run
        env:
          JOB_NAME: ${{ steps.job.outputs.job_name }}
          FILE_URI_PREFIX: ${{ steps.job.outputs.file_uri_prefix }}
        run: |
          echo "Dry run: would submit '$JOB_NAME' with files under $FILE_URI_PREFIX/, authorized up to \$$AUTO_AUTHORIZE_MAX_USD." \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # For now the review task goes to a fixed person per platform while the automation beds in, as in the nightly job.
      - name: Resolve ${{ inputs.platform }} review task assignee
        id: review-assignee
        if: steps.submit.outputs.outcome == 'review_required' && steps.submit.outputs.failed != 'true'
        continue-on-error: true  # Fall back to the triage DRI if the lookup fails.
        uses: duckduckgo/native-github-asana-sync@v2.5.1
        with:
          action: get-asana-user-id
          github-username: ${{ env.REVIEW_TASK_GITHUB_ASSIGNEE }}
          github-pat: ${{ secrets.APPLE_GH_RO_PAT }}

      - name: Open ${{ inputs.platform }} Smartling review task
        id: review-task
        if: steps.submit.outputs.outcome == 'review_required' && steps.submit.outputs.failed != 'true'
        env:
          ASANA_ACCESS_TOKEN: ${{ secrets.ASANA_ACCESS_TOKEN }}
          ASSIGNEE: ${{ steps.review-assignee.outputs.asanaUserId }}
          TASK_NAME: "Smartling job needs review: ${{ steps.submit.outputs.job_name }}"
          TASK_NOTES: |
            🌍 The ${{ inputs.platform }} release Smartling job could not be automatically authorized. The release's translations are imported once it's authorized and completed.

            🔗 Job: ${{ format('https://dashboard.smartling.com/app/projects/{0}/account-jobs/{0}:{1}', env.SMARTLING_PROJECT_ID, steps.submit.outputs.job_id) }}
            💵 Maximum USD estimate / limit: ${{ steps.submit.outputs.max_usd && format('${0}', steps.submit.outputs.max_usd) || 'unavailable' }} / $${{ env.AUTO_AUTHORIZE_MAX_USD }}
            📝 String translations: ${{ steps.submit.outputs.total_strings && format('{0} across {1} locales', steps.submit.outputs.total_strings, steps.submit.outputs.locales) || 'unavailable' }}
            ✋ Reason: ${{ steps.submit.outputs.reason }}
            🌿 Branch: ${{ inputs.branch }}
            📋 Release task: ${{ inputs.asana_task_url || 'none' }}
            ⚙️ Workflow: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          assignee_args=()
          [ -z "$ASSIGNEE" ] || assignee_args=(--assignee "$ASSIGNEE")
          python3 ./scripts/smartling/asana_review_task.py \
            --project "$ASANA_PROJECT_ID" \
            --section-name "$ASANA_INCOMING_SECTION_NAME" \
            --rotation-section "$ASANA_TRIAGE_ROTATION_SECTION_ID" \
            --name "$TASK_NAME" \
            --notes "$TASK_NOTES" \
            "${assignee_args[@]}"

      - name: Resolve release task ID
        id: release-task
        if: >-
          always() && !cancelled() && !inputs.dry_run && inputs.asana_task_url != '' &&
          (failure() || steps.submit.outputs.failed == 'true')
        env:
          ASANA_TASK_URL: ${{ inputs.asana_task_url }}
        run: |
          task_id="$(echo "$ASANA_TASK_URL" | grep -oE '[0-9]+' | tail -1)"
          echo "task_id=$task_id" >> "$GITHUB_OUTPUT"

      - name: Comment on the release task
        if: steps.release-task.outputs.task_id != ''
        uses: duckduckgo/native-github-asana-sync@v2.5.1
        with:
          action: post-comment-asana-task
          asana-pat: ${{ secrets.ASANA_ACCESS_TOKEN }}
          asana-task-id: ${{ steps.release-task.outputs.task_id }}
          asana-task-comment-pinned: false
          asana-task-comment-is-html: false
          asana-task-comment: |
            ⚠️ Submitting ${{ inputs.branch }} to Smartling failed, so this release's translations won't be imported automatically.

            ✋ Reason: ${{ steps.submit.outputs.failed == 'true' && steps.submit.outputs.reason || 'The localization export, Smartling submission or review task failed. See the workflow logs.' }}
            ⚙️ Workflow: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            🔁 To retry, run the "Smartling - Release Submission" workflow for ${{ inputs.platform }} with branch ${{ inputs.branch }}. A rerun skips any existing job named "${{ steps.job.outputs.job_name }}", so if the failed run left one in Smartling, cancel and delete it there first.
