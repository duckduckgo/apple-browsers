name: iOS - Run UI Test

# Reusable helper that runs a single UITestCase class, on one simulator, in one user mode.
# Called by ios_ui_tests.yml once per (device × test) matrix combination, per user-mode leg.

permissions:
  contents: read

defaults:
  run:
    working-directory: iOS

on:
  workflow_call:
    inputs:
      test:
        description: "The UITestCase class to run"
        required: true
        type: string
      device:
        description: "Stable device key: iphone or ipad"
        required: true
        type: string
      device-name:
        description: "Simulator name"
        required: true
        type: string
      ios-version:
        description: "Selected iOS simulator version"
        required: true
        type: string
      user-mode:
        description: "'production' = production behaviour (release-gating). 'internal' = isInternalUser=true (advance warning, non-gating)."
        required: true
        type: string
      build-artifact-name:
        description: "Immutable build artifact name"
        required: true
        type: string
      diagnostics-mode:
        description: "Xcode's additional test diagnostics collection mode"
        required: false
        default: never
        type: string
      job-cap:
        type: string
        default: default
      execution-mode:
        type: string
        default: retry
      iterations:
        type: string
        default: '2'
      app-lock-relaunch-gap:
        type: string
        default: '0'
      app-lock-disable-animations:
        type: string
        default: 'false'
      simulator-log-level:
        type: string
        default: debug

jobs:
  run-ui-test:
    name: ${{ inputs.test }} (${{ inputs.device }}${{ inputs.user-mode == 'internal' && ', internal' || '' }})
    runs-on: ['image:osx-27-edge', ui-tests]

    # Internal-mode failures are advance warning for features still gated to internal users; they
    # must not fail the overall workflow. Setting continue-on-error here (a normal job inside the
    # reusable workflow) is what makes the calling leg pass on internal failures — a job that
    # `uses:` a reusable workflow cannot set continue-on-error itself.
    continue-on-error: ${{ inputs.user-mode == 'internal' }}

    timeout-minutes: 45

    env:
      UI_TEST_JOB_CAP: ${{ inputs.job-cap }}
      UI_TEST_EXECUTION_MODE: ${{ inputs.execution-mode }}
      UI_TEST_ITERATIONS: ${{ inputs.iterations }}
      APP_LOCK_RELAUNCH_GAP: ${{ inputs.app-lock-relaunch-gap }}
      APP_LOCK_DISABLE_ANIMATIONS: ${{ inputs.app-lock-disable-animations }}
      SIMULATOR_LOG_LEVEL: ${{ inputs.simulator-log-level }}
      IOS_VERSION: ${{ inputs.ios-version }}
      TEST_CLASS: ${{ inputs.test }}
      DEVICE: ${{ inputs.device }}
      DEVICE_NAME: ${{ inputs.device-name }}
      USER_MODE: ${{ inputs.user-mode }}
      INTERNAL_USER_MODE: ${{ inputs.user-mode == 'internal' && 'true' || 'false' }}

    steps:
    - name: Check out the code
      id: checkout
      uses: actions/checkout@v6

    - name: Validate experiment options
      run: source scripts/ui_test_experiment_options.sh

    - name: Print macOS version
      run: sw_vers

    - name: Select Xcode
      uses: ./.github/actions/select-xcode-version

    - name: Select iOS Simulator
      id: select-simulator
      uses: ./.github/actions/select-ios-simulator
      with:
        preferred-versions: ${{ env.IOS_VERSION }}
        device-name: ${{ inputs.device-name }}

    - name: Validate simulator selection
      env:
        DESTINATION: ${{ steps.select-simulator.outputs.destination }}
      run: |
        expected_prefix="platform=iOS Simulator,name=$DEVICE_NAME,OS="
        actual_os="${DESTINATION#"$expected_prefix"}"
        if [[ "$DESTINATION" != "$expected_prefix"* || -z "$actual_os" || "$actual_os" == *,* ]]; then
          echo "::error::Requested an iOS Simulator named '$DEVICE_NAME', but simulator selection returned '$DESTINATION'."
          exit 1
        fi

    - name: Resolve and configure selected simulator logging
      id: simulator-logging
      env:
        DESTINATION: ${{ steps.select-simulator.outputs.destination }}
      run: |
        set -euo pipefail
        selected_os="${DESTINATION##*,OS=}"
        runtime_key="com.apple.CoreSimulator.SimRuntime.iOS-${selected_os//./-}"
        devices_json=$(xcrun simctl list devices available --json)
        simulator_udid=$(jq -r --arg runtime "$runtime_key" --arg name "$DEVICE_NAME" \
          '[.devices[$runtime][]? | select(.name == $name) | .udid] | if length == 1 then .[0] else empty end' \
          <<< "$devices_json")
        if [[ -z "$simulator_udid" ]]; then
          echo "::error::Could not resolve exactly one available '$DEVICE_NAME' simulator for iOS $selected_os."
          exit 1
        fi
        state=$(jq -r --arg udid "$simulator_udid" '[.devices[][] | select(.udid == $udid) | .state][0] // ""' <<< "$devices_json")
        if [[ "$state" != "Booted" ]]; then
          xcrun simctl boot "$simulator_udid"
        fi
        xcrun simctl bootstatus "$simulator_udid" -b
        echo "simulator-udid=$simulator_udid" >> "$GITHUB_OUTPUT"
        source scripts/ui_test_experiment_options.sh
        xcrun simctl spawn "$simulator_udid" log config --subsystem General --mode "$simulator_log_mode"
        xcrun simctl spawn "$simulator_udid" log config --status --subsystem General

    - name: Record simulator runtime diagnostics
      continue-on-error: true
      run: |
        xcode-select -p
        for xcode_app in /Applications/Xcode*.app; do
          [ -d "$xcode_app" ] || continue
          echo "Installed Xcode: $xcode_app"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$xcode_app/Contents/version.plist" || true
          /usr/libexec/PlistBuddy -c 'Print :ProductBuildVersion' "$xcode_app/Contents/version.plist" || true
        done
        xcodebuild -version
        xcrun --sdk iphonesimulator --show-sdk-build-version
        xcrun simctl runtime list
        xcrun simctl runtime match list

    - name: Download build products
      uses: actions/download-artifact@v7
      with:
        name: ${{ inputs.build-artifact-name }}
        path: iOS/build-artifact

    - name: Extract build products
      run: |
        mkdir -p DerivedData
        tar -xzf build-artifact/build-products.tar.gz -C DerivedData
        case "$DEVICE" in
          iphone) test_plan='UI Tests' ;;
          ipad) test_plan='iPad UI Tests' ;;
          *)
            echo "::error::Unsupported device key '$DEVICE'."
            exit 1
            ;;
        esac
        pattern="iOS UI Tests_${test_plan}_*.xctestrun"
        count=$(find DerivedData/Build/Products -type f -name "$pattern" | wc -l | tr -d ' ')
        if [[ "$count" != 1 ]]; then
          echo "::error::Expected one '$pattern' file, found $count."
          find DerivedData/Build/Products -type f -name '*.xctestrun' -print
          exit 1
        fi
        find DerivedData/Build/Products -type f -name "$pattern" -print -quit > xctestrun-path

    - name: Run UI Tests
      id: run-ui-tests
      env:
        SIMULATOR_UDID: ${{ steps.simulator-logging.outputs.simulator-udid }}
        DIAGNOSTICS_MODE: ${{ inputs.diagnostics-mode }}
      run: |
        source scripts/ui_test_experiment_options.sh
        effective_job_cap=$production_parallel
        if [[ "$USER_MODE" == internal ]]; then effective_job_cap=$internal_parallel; fi
        jq -n --arg requested_job_cap "$UI_TEST_JOB_CAP" --argjson effective_job_cap "$effective_job_cap" \
          --arg execution_mode "$UI_TEST_EXECUTION_MODE" --arg iterations "$UI_TEST_ITERATIONS" \
          --arg app_lock_relaunch_gap "$APP_LOCK_RELAUNCH_GAP" --arg simulator_log_level "$SIMULATOR_LOG_LEVEL" \
          --arg app_lock_disable_animations "$APP_LOCK_DISABLE_ANIMATIONS" --arg test_class "$TEST_CLASS" --arg device "$DEVICE" --arg user_mode "$USER_MODE" \
          '{requested_job_cap: $requested_job_cap, effective_job_cap: $effective_job_cap, execution_mode: $execution_mode, iterations: $iterations, app_lock_relaunch_gap: $app_lock_relaunch_gap,
            simulator_log_level: $simulator_log_level, app_lock_disable_animations: $app_lock_disable_animations, test_class: $test_class, device: $device, user_mode: $user_mode}' \
          | tee experiment-options.json
        : > ui-tests.log
        xctestrun_path=$(<xctestrun-path)
        DESTINATION="platform=iOS Simulator,id=$SIMULATOR_UDID"
        diagnostics_args=()
        case "$DIAGNOSTICS_MODE" in
          default) ;;
          never) diagnostics_args=(-collect-test-diagnostics never) ;;
          *) echo "::error::Unsupported diagnostics mode '$DIAGNOSTICS_MODE'."; exit 1 ;;
        esac
        timeline_command=()
        if [[ "$DIAGNOSTICS_MODE" == default && "$TEST_CLASS" == ApplicationLockUITests ]]; then
          timeline_command=(python3 scripts/capture_app_lock_timeline.py "$SIMULATOR_UDID" app-lock-timeline)
        fi
        set -o pipefail && "${timeline_command[@]}" env TEST_RUNNER_INTERNAL_USER_MODE="$INTERNAL_USER_MODE" \
          TEST_RUNNER_APP_LOCK_DISABLE_ANIMATIONS="$APP_LOCK_DISABLE_ANIMATIONS" \
          TEST_RUNNER_APP_LOCK_RELAUNCH_GAP="$APP_LOCK_RELAUNCH_GAP" \
          TEST_RUNNER_UI_TEST_EXECUTION_MODE="$UI_TEST_EXECUTION_MODE" \
          TEST_RUNNER_UI_TEST_ITERATIONS="$UI_TEST_ITERATIONS" \
          xcodebuild test-without-building \
          -xctestrun "$xctestrun_path" \
          -destination "$DESTINATION" \
          -resultBundlePath TestResults.xcresult \
          "${repetition_args[@]}" \
          "-only-testing:UI Tests/$TEST_CLASS" \
          "${diagnostics_args[@]}" \
        2>&1 | tee ui-tests.log \
        | xcbeautify

    - name: Export available test videos
      if: always() && github.event_name == 'workflow_dispatch' && steps.run-ui-tests.outcome != 'skipped'
      continue-on-error: true
      run: |
        # Includes recorded videos when XCTest retained them. Timeouts may have no recording.
        if [[ -d TestResults.xcresult ]]; then
          xcrun xcresulttool export attachments --path TestResults.xcresult --output-path test-attachments --filter '*.mp4'
        fi

    - name: Restore simulator logging defaults
      if: always() && steps.simulator-logging.outputs.simulator-udid != ''
      env:
        SIMULATOR_UDID: ${{ steps.simulator-logging.outputs.simulator-udid }}
      run: |
        xcrun simctl spawn "$SIMULATOR_UDID" log config --subsystem General --mode level:info,persist:default

    - name: Prepare test report
      if: always() && steps.checkout.outcome == 'success'
      env:
        DESTINATION: ${{ steps.select-simulator.outputs.destination }}
      run: |
        file="${TEST_CLASS}-${DEVICE}-${USER_MODE}.xml"
        invalid="reports/${file%.xml}.invalid"
        selected_ios_version="${DESTINATION##*,OS=}"
        test_id="$TEST_CLASS ($DEVICE_NAME, iOS $selected_ios_version, $USER_MODE)"
        mkdir -p reports
        touch "$invalid"
        jq -n --argjson workflow_attempt "$GITHUB_RUN_ATTEMPT" \
          '{workflow_attempt: $workflow_attempt}' \
          > "reports/${file%.xml}.meta.json"

        if [[ ! -s ui-tests.log ]]; then
          echo "::error::UI test log is missing or empty."
          exit 1
        fi
        xcbeautify --report junit --report-path reports --junit-report-filename "$file" < ui-tests.log
        # Replace the default test suite name with the test id for better grouping in the test report
        sed -i '' "s/Selected tests/${test_id}/" "reports/$file"
        test_count=$(xmllint --xpath 'count(//testcase)' "reports/$file")
        if [[ "$test_count" == 0 ]]; then
          echo "::error::JUnit report contains no test cases."
          exit 1
        fi
        xcrun xcresulttool get test-results summary \
          --path TestResults.xcresult --compact > results-summary.json
        if ! jq -e '(.totalTestCount | type) == "number" and ((.skippedTests // 0) | type) == "number" and (.totalTestCount > (.skippedTests // 0))' results-summary.json >/dev/null; then
          echo "::error::xcresult contains no executed tests."
          exit 1
        fi
        rm "$invalid"

    # Upload test report as artifact for the test-report job
    # that publishes a combined report for all test cases
    - name: Upload test report
      if: always()
      uses: ./.github/actions/upload-artifact-with-retry
      with:
        name: "ios-testreport-${{ inputs.test }}-${{ inputs.device }}-${{ inputs.user-mode }}"
        path: "iOS/reports/*"
        if-no-files-found: error
        retention-days: 3

    - name: Upload test logs
      if: always()
      uses: ./.github/actions/upload-artifact-with-retry
      with:
        name: "ios-uitest-logs-${{ inputs.test }}-${{ inputs.device }}-${{ inputs.user-mode }}-attempt${{ github.run_attempt }}"
        path: |
          iOS/ui-tests.log
          iOS/TestResults.xcresult
          iOS/results-summary.json
          iOS/experiment-options.json
          iOS/test-attachments
          iOS/app-lock-timeline
        if-no-files-found: warn
        retention-days: 7
