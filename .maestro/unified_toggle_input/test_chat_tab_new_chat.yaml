appId: com.duckduckgo.mobile.ios
tags:
    - iphone
    - release
    - unified_toggle_input
name: test_chat_tab_new_chat

---

- launchApp:
    appId: "com.duckduckgo.mobile.ios"
    clearState: true
    clearKeychain: true
    arguments:
        isOnboardingCompleted: ${ONBOARDING_COMPLETED}
        currentAppVariant: ${APP_VARIANT}
        isRunningUITests: true
        ff.browsingMenuSheetEnabledByDefault: "true"
        ff.unifiedToggleInput: "true"

- tapOn:
    id: "Browser.OmniBar.Button.AIChat"

- runFlow:
    when:
        visible: "Agree and Continue"
    commands:
        - tapOn: "Agree and Continue"
- runFlow:
    when:
        visible: "×"
    commands:
        - tapOn: "×"
- runFlow:
    when:
        visible: "×"
    commands:
        - tapOn: "×"

- assertVisible: "Close tab"

# Tap "Recent chats" — opens the chat history + new chat panel
- tapOn: "Recent chats"
- assertVisible: "New Chat"
- assertVisible: "New Voice Chat"
- assertVisible: "New Image"

# Tap "New Chat" — starts a new empty chat; panel closes, chat tab remains open
- tapOn: "New Chat"
- assertVisible: "Close tab"
- assertVisible:
    id: "AIChat.Toolbar.Button.ModelChip"
