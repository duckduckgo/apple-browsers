# cset_sync_dev_environment.yaml

appId: com.duckduckgo.mobile.ios
---

#Open Debug Menu
- runFlow:
    file: ./open_debug_menu.yaml

# Center the row and let the list settle before tapping: a tap while the list is still
# scrolling stops the scroll instead of opening the Sync debug screen.
- scrollUntilVisible:
    element: Sync
    direction: DOWN
    centerElement: true
    waitToSettleTimeoutMs: 500
- waitForAnimationToEnd
- tapOn: Sync
- extendedWaitUntil:
    visible: Sync now
    timeout: 10000
- scroll
- scrollUntilVisible:
    element: Production
    direction: DOWN
    centerElement: false
- tapOn: Production
- tapOn: Debug
- tapOn: Settings