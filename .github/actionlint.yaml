# Configuration for actionlint (GitHub Actions workflow linter)
# https://github.com/rhysd/actionlint
#
# This file defines custom self-hosted runner labels that actionlint
# should recognize as valid. Without this configuration, actionlint
# would report errors for workflows using custom runner labels.

self-hosted-runner:
  labels:
    - apple
    - xcode-27
    - image:osx-27-edge
    - image:osx-sequoia-26
    - image:osx-tahoe-26
    - image:osx-tahoe-27
    - general-purpose
    - ui-tests
    - m4pro

# actionlint's copy of create-github-app-token@v3 predates client-id, which v3 has and prefers over the
# deprecated app-id
paths:
  .github/workflows/agent-worker.yml:
    ignore:
      - 'input "client-id" is not defined in action "actions/create-github-app-token@v3"'
      - 'missing input "app-id" which is required by action "actions/create-github-app-token@v3"'
