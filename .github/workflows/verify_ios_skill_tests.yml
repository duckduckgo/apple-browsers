name: iOS - verify-ios Skill Tests

on:
  pull_request:
    # opened, synchronize, reopened are the default triggering events for a pull request
    # We're also adding ready_for_review to run checks when a draft PR becomes ready for review.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.agents/skills/verify-ios/**'
      - '.github/workflows/verify_ios_skill_tests.yml'

permissions:
  contents: read

jobs:
  should-run-checks:
    name: Determine if checks should run
    uses: ./.github/workflows/should_run_pr_checks.yml

  tests:
    name: verify-ios skill tests
    needs: should-run-checks
    if: needs.should-run-checks.outputs.should_run == 'true'
    # The skill only runs on macOS (simctl, ps, pgrep), so its tests run there too. They need no simulator.
    runs-on: macos-26
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Run tests
        run: python3 -m unittest discover -s .agents/skills/verify-ios/tests -p 'test_*.py' -v
