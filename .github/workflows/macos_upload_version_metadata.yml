name: macOS - Upload Version Metadata

on:
  schedule:
    - cron: '20 * * * *'
  workflow_dispatch:
    inputs:
      is_critical:
        description: 'Critical release ("unchanged" keeps the published value)'
        type: choice
        options:
          - unchanged
          - 'true'
          - 'false'
        default: unchanged
      dry_run:
        description: 'Dry run'
        type: boolean
        default: false
  workflow_call:
    inputs:
      is_critical:
        description: 'Critical release: unchanged, true or false'
        type: string
        default: unchanged
      dry_run:
        description: 'Dry run'
        type: boolean
        default: false
    secrets:
      AWS_ACCESS_KEY_ID_RELEASE_S3:
        required: true
      AWS_SECRET_ACCESS_KEY_RELEASE_S3:
        required: true
      APPLE_API_KEY_ID:
        required: true
      APPLE_API_KEY_ISSUER:
        required: true
      APPLE_API_KEY_BASE64:
        required: true
      APPLE_GH_RO_PAT:
        required: false
      ASANA_ACCESS_TOKEN:
        required: false

defaults:
  run:
    working-directory: macOS

concurrency:
  group: ${{ github.workflow }}-${{ inputs.dry_run && 'dry-run' || 'upload' }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  upload-metadata:
    name: Upload Release Metadata to CDN
    if: github.event_name != 'schedule' || vars.MACOS_AUTOMATIC_VERSION_METADATA == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      S3_PATH: s3://${{ vars.RELEASE_BUCKET_NAME }}/${{ vars.RELEASE_BUCKET_PREFIX }}/
      CDN_PATH: ${{ vars.DMG_URL_ROOT }}

    steps:
      - name: Check out the code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Ruby and Bundler
        uses: ./.github/actions/setup-ruby
        with:
          working-directory: macOS
          cache-key-prefix: macos-ruby

      - name: Test the release metadata logic
        run: ruby fastlane/test/appstore_release_metadata_test.rb

      - name: Upload App Store version metadata to CDN
        env:
          # Apple API keys
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_ISSUER: ${{ secrets.APPLE_API_KEY_ISSUER }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          # AWS S3 configuration
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID_RELEASE_S3 }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_RELEASE_S3 }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
          # S3 and CDN paths
          RELEASE_BUCKET_NAME: ${{ vars.RELEASE_BUCKET_NAME }}
          RELEASE_BUCKET_PREFIX: ${{ vars.RELEASE_BUCKET_PREFIX }}
          CDN_PATH: ${{ vars.DMG_URL_ROOT }}
          IS_CRITICAL: ${{ inputs.is_critical || 'unchanged' }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          bundle exec fastlane upload_appstore_version_metadata \
            is_critical:"$IS_CRITICAL" \
            dry_run:"$DRY_RUN"

  report-failure:
    name: Report Failure
    needs: upload-metadata
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read

    defaults:
      run:
        working-directory: .

    steps:
      # The schedule runs hourly, so report a failure only once: skip it when the previous run failed and
      # its report succeeded. If reporting failed too, try again.
      - name: Check whether the failure was already reported
        id: previous-run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read -r run_id conclusion < <(gh run list \
            --repo "${{ github.repository }}" \
            --workflow macos_upload_version_metadata.yml \
            --event schedule \
            --branch "${{ github.ref_name }}" \
            --limit 20 \
            --json databaseId,status,conclusion \
            --jq "map(select(.databaseId != ${{ github.run_id }} and .status == \"completed\" and .conclusion != \"cancelled\"))[0] // {} | \"\\(.databaseId // \"\") \\(.conclusion // \"\")\"")
          report=""
          if [[ "$conclusion" == "failure" ]]; then
            report=$(gh run view "$run_id" \
              --repo "${{ github.repository }}" \
              --json jobs \
              --jq '.jobs[] | select(.name == "Report Failure") | .conclusion')
          fi
          echo "Previous scheduled run: ${conclusion:-none}, failure report: ${report:-none}"
          echo "reported=$([[ "$report" == "success" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Resolve Asana assignee
        id: asana-assignee
        if: steps.previous-run.outputs.reported != 'true'
        continue-on-error: true  # Fall back to an unassigned task if the lookup fails.
        uses: duckduckgo/native-github-asana-sync@v2.5.1
        with:
          action: get-asana-user-id
          github-username: frosty
          github-pat: ${{ secrets.APPLE_GH_RO_PAT }}

      - name: Create Asana task
        if: steps.previous-run.outputs.reported != 'true'
        uses: duckduckgo/native-github-asana-sync@v2.5.1
        with:
          action: create-asana-task
          asana-pat: ${{ secrets.ASANA_ACCESS_TOKEN }}
          asana-project: ${{ vars.MACOS_APP_DEVELOPMENT_ASANA_PROJECT_ID }}
          asana-task-name: GH Workflow Failure - macOS Upload Version Metadata
          asana-task-assignee: ${{ steps.asana-assignee.outputs.asanaUserId }}
          asana-task-description: The scheduled macOS App Store version metadata upload has failed. Later failures won't be reported until a run succeeds. See https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
