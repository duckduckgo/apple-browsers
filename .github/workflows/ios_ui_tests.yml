name: iOS - UI Tests

permissions:
  contents: read

defaults:
  run:
    working-directory: iOS

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1-5' # 2AM UTC to not clash with macOS tests run at 3AM
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/ios_ui_tests.yml'
      - '.xcode-version'
      - 'SharedPackages/**'
      - 'iOS/**'

concurrency:
  # When this workflow is called by another workflow (e.g. code freeze), `github.workflow` contains the name of the calling workflow,
  # and the value of `${{ github.workflow }}-${{ github.ref }}` would be the same for PR Checks and UI Tests, which would prevent them
  # from being run concurrently. We're adding a suffix here to tell PR Checks and UI Tests apart and allow for running the two
  # side by side in the code freeze workflow.
  group: ${{ github.workflow }}-${{ github.ref }}-ios-ui-tests
  cancel-in-progress: true

jobs:
  should-run-checks:
    name: Determine if checks should run
    uses: ./.github/workflows/should_run_pr_checks.yml

  ui-tests:
    name: UI Tests
    needs: should-run-checks
    if: needs.should-run-checks.outputs.should_run == 'true'
    runs-on: [image:osx-27-edge, m4pro]
    timeout-minutes: 45

    steps:
    - name: Register SSH keys for private repos
      uses: webfactory/ssh-agent@v0.10.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY_DUCKSANS_FONT }}

    - name: Check out the code
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Print macOS version
      run: sw_vers

    - name: Select Xcode
      uses: ./.github/actions/select-xcode-version

    - name: Check if SPM dependencies are pinned to versions
      id: spm-cache
      run: |
        has_only_tags=$(jq '[.pins[].state | has("version")] | all' DuckDuckGo-iOS.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved)
        echo "has-only-tags=$has_only_tags" >> "$GITHUB_OUTPUT"

    - name: Restore SPM cache
      if: steps.spm-cache.outputs.has-only-tags == 'true'
      uses: actions/cache/restore@v5
      with:
        path: iOS/DerivedData/SourcePackages
        key: ${{ runner.os }}-ios-${{ hashFiles('iOS/DuckDuckGo-iOS.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

    - name: Select iOS Simulator
      id: select-simulator
      uses: ./.github/actions/select-ios-simulator
      with:
        preferred-versions: "27.0"

    - name: Start the simulator before building
      continue-on-error: true
      env:
        DESTINATION: ${{ steps.select-simulator.outputs.destination }}
      run: |
        name="${DESTINATION#*,name=}"
        name="${name%,OS=*}"
        version="${DESTINATION##*,OS=}"
        runtime="com.apple.CoreSimulator.SimRuntime.iOS-${version//./-}"
        device=$(xcrun simctl list devices available --json | jq -r --arg name "$name" --arg runtime "$runtime" '
          [.devices[$runtime][]? | select(.name == $name and .state == "Shutdown")][0].udid // empty
        ')
        if [[ -n "$device" ]]; then
          xcrun simctl boot "$device"
        fi

    - name: Record simulator runtime diagnostics
      continue-on-error: true
      run: |
        xcode-select -p
        for xcode_app in /Applications/Xcode*.app; do
          [ -d "$xcode_app" ] || continue
          echo "Installed Xcode: $xcode_app"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$xcode_app/Contents/version.plist" || true
          /usr/libexec/PlistBuddy -c 'Print :ProductBuildVersion' "$xcode_app/Contents/version.plist" || true
        done
        xcodebuild -version
        xcrun --sdk iphonesimulator --show-sdk-build-version
        xcrun simctl runtime list
        xcrun simctl runtime match list

    - name: Run UI test
      run: |
        echo "Using iOS simulator: ${{ steps.select-simulator.outputs.ios-version }}"
        echo "Destination: ${{ steps.select-simulator.outputs.destination }}"

        set -o pipefail && xcodebuild test \
          -scheme "iOS UI Tests" \
          -destination "${{ steps.select-simulator.outputs.destination }}" \
          -parallel-testing-enabled NO \
          -derivedDataPath "DerivedData" \
          -showBuildTimingSummary \
          -resultBundlePath "DerivedData/Logs/Test/iOS-UI-Tests.xcresult" \
          -skipPackagePluginValidation \
          -skipMacroValidation \
          -test-iterations 2 \
          -retry-tests-on-failure \
          -test-repetition-relaunch-enabled NO \
          OTHER_CODE_SIGN_FLAGS=--timestamp=none \
          2>&1 | tee ui-tests-xcodebuild.log \
          | xcbeautify

    - name: Check UI test diagnostics
      id: ui-diagnostics
      if: always()
      run: |
        log=ui-tests-xcodebuild.log
        if [ ! -f "$log" ]; then
          exit 0
        fi
        grep -F 'elapsed -- Testing started completed.' "$log" || true
        if grep -Eq 'Test [Cc]ase .* failed( on | \()|App animations complete notification not received' "$log"; then
          echo 'retain=true' >> "$GITHUB_OUTPUT"
        fi

    - name: Upload UI test diagnostics
      if: failure() || cancelled() || steps.ui-diagnostics.outputs.retain == 'true'
      uses: ./.github/actions/upload-artifact-with-retry
      with:
        name: ios-ui-test-diagnostics
        path: |
          iOS/ui-tests-xcodebuild.log
          iOS/DerivedData/Logs/Test/
        if-no-files-found: warn
        retention-days: 7
