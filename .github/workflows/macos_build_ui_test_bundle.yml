name: macOS - Build shared UI test bundle

on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: true
      os-version:
        type: string
        required: true
      xcode-version:
        type: string
        required: true
      branch:
        type: string
        required: true
      build-type:
        type: string
        default: dmg
      test-plan:
        type: string
        default: ''

jobs:
  build:
    name: UI test bundle (macOS ${{ inputs.os-version }}, ${{ inputs.build-type }})
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: macOS
    env:
      scheme: ${{ inputs.build-type == 'appstore' && 'macOS UI Tests App Store CI' || 'macOS UI Tests CI' }}
      extra-xcargs: ${{ inputs.build-type == 'appstore' && 'UI_TESTS_TARGET_APP=sandbox' || '' }}
      TEST_PLAN: ${{ inputs.test-plan }}
    steps:
    - name: Register SSH keys for private repos
      uses: webfactory/ssh-agent@v0.10.0
      with:
        ssh-private-key: |
          ${{ secrets.SSH_PRIVATE_KEY_FASTLANE_MATCH }}
          ${{ secrets.SSH_PRIVATE_KEY_DUCKSANS_FONT }}

    - name: Check out the code
      uses: actions/checkout@v6
      with:
        ref: ${{ inputs.branch }}

    - name: Initialize submodules with retry
      run: |
        max_attempts=3
        retry_delay=15
        for attempt in $(seq 1 $max_attempts); do
          echo "Submodule init attempt $attempt of $max_attempts"
          if git submodule update --init --recursive; then
            echo "Submodules initialized successfully"
            exit 0
          fi
          if [[ $attempt -lt $max_attempts ]]; then
            echo "Failed, retrying in ${retry_delay}s..."
            sleep $retry_delay
          fi
        done
        echo "All submodule init attempts failed"
        exit 1

    - name: Ensure GNU timeout is available
      shell: bash
      timeout-minutes: 5
      run: |
        if ! command -v gtimeout >/dev/null && ! command -v timeout >/dev/null; then
          brew install coreutils
        fi

    - name: Select Xcode
      uses: ./.github/actions/select-xcode-version
      with:
        xcode-version: ${{ inputs.xcode-version }}

    - name: Set cache key hash
      run: |
        has_only_tags=$(jq '[ .pins[].state | has("version") ] | all' DuckDuckGo-macOS.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved)
        if [[ "$has_only_tags" == "true" ]]; then
          echo "cache_key_hash=${{ hashFiles('macOS/DuckDuckGo-macOS.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}" >> $GITHUB_ENV
        else
          echo "Package.resolved contains dependencies specified by branch or commit, skipping cache."
        fi

    - name: Cache SPM
      if: env.cache_key_hash
      uses: actions/cache@v5
      with:
        path: macOS/DerivedData/SourcePackages
        key: ${{ runner.os }}-macos-${{ env.cache_key_hash }}
        restore-keys: |
          ${{ runner.os }}-macos-

    - name: Resolve package dependencies
      id: resolve-packages
      working-directory: macOS
      shell: bash
      timeout-minutes: 30
      env:
        RESOLVE_SCHEME: ${{ env.scheme }}
      run: |
        max_attempts=5
        retry_delay=10
        TIMEOUT_BIN="$(command -v gtimeout || command -v timeout)"

        for attempt in $(seq 1 $max_attempts); do
          attempt_directory="package-resolution/attempt-${attempt}"
          mkdir -p "$attempt_directory"
          echo "Attempt $attempt of $max_attempts"
          if "$TIMEOUT_BIN" --verbose --kill-after=10s 5m \
            xcodebuild -resolvePackageDependencies \
            -scheme "$RESOLVE_SCHEME" \
            -derivedDataPath DerivedData \
            2>&1 | tee "$attempt_directory/resolve.log"; then
            echo "Package resolution succeeded"
            exit 0
          else
            status=$?
            echo "Package resolution exited with status $status (attempt $attempt)"
            if [[ $status -eq 130 || $status -eq 143 ]]; then
              exit "$status"
            fi
          fi

          if [[ $attempt -lt $max_attempts ]]; then
            echo "Package resolution failed (attempt $attempt), retrying in ${retry_delay}s..."
            sleep $retry_delay
          fi
        done
        echo "Package resolution failed after $max_attempts attempts"
        exit 1

    - name: Upload package resolution logs
      if: always() && steps.resolve-packages.outcome != 'skipped'
      uses: ./.github/actions/upload-artifact-with-retry
      with:
        name: "package-resolution-ui-bundle-${{ inputs.build-type }}-macos${{ inputs.os-version }}"
        path: macOS/package-resolution/
        retention-days: 7

    - name: Restore Xcode Compilation Cache
      if: runner.environment != 'self-hosted'
      uses: actions/cache/restore@v5
      with:
        path: macOS/DerivedData/CompilationCache.noindex
        key: xcode-compilation-cache-ui-tests
        restore-keys: |
          xcode-compilation-cache-ui-tests-

    - name: Build for testing
      working-directory: macOS
      run: |
        test_plan_args=()
        if [[ -n "$TEST_PLAN" ]]; then
          test_plan_args=(-testPlan "$TEST_PLAN")
        fi
        set -o pipefail && xcodebuild build-for-testing \
          -scheme "${{ env.scheme }}" \
          "${test_plan_args[@]}" \
          -derivedDataPath DerivedData \
          -skipPackagePluginValidation \
          -skipMacroValidation \
          COMPILATION_CACHE_ENABLE_CACHING=YES \
          CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
          OTHER_CODE_SIGN_FLAGS=--timestamp=none \
          ${{ env.extra-xcargs }} \
        | tee xcodebuild.log \
        | xcbeautify

    - name: Compute Compilation Cache hash
      if: runner.environment != 'self-hosted' && github.ref == 'refs/heads/main'
      id: compilation-cache-hash
      run: |
        if [ -d "DerivedData/CompilationCache.noindex" ]; then
          hash=$(find DerivedData/CompilationCache.noindex -type f \( -name "*.index" -o -name "*.actions" \) 2>/dev/null | sort | xargs cat | shasum -a 256 | cut -d' ' -f1)
          echo "hash=${hash}" >> $GITHUB_OUTPUT
        else
          echo "No compilation cache directory found (Xcode version may not support compilation caching)"
        fi

    - name: Save Xcode Compilation Cache
      if: runner.environment != 'self-hosted' && github.ref == 'refs/heads/main' && steps.compilation-cache-hash.outputs.hash
      uses: actions/cache/save@v5
      with:
        path: macOS/DerivedData/CompilationCache.noindex
        key: xcode-compilation-cache-ui-tests-${{ steps.compilation-cache-hash.outputs.hash }}

    - name: Archive test products
      run: |
        # tar preserves the runner executable bits and framework symlinks.
        # Consumers install the existing notarized app artifact separately.
        tar -czf ui-test-products.tar.gz --exclude='Build/Products/Review/DuckDuckGo*.app' -C DerivedData Build/Products

    - name: Upload shared UI test bundle
      uses: actions/upload-artifact@v6
      with:
        name: DuckDuckGo-ui-tests-${{ inputs.build-type }}-macos${{ inputs.os-version }}-xcode${{ inputs.xcode-version }}
        path: macOS/ui-test-products.tar.gz
        retention-days: 1
