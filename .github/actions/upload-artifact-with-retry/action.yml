name: 'Upload Artifact with Retry'
description: 'Uploads an artifact and retries once after a transient failure'

inputs:
  name:
    description: 'Artifact name'
    required: true
  path:
    description: 'File, directory, or wildcard pattern to upload'
    required: true
  retention-days:
    description: 'Number of days to retain the artifact'
    required: false
    default: '1'
  if-no-files-found:
    description: 'Behavior when no files match: warn, error, or ignore'
    required: false
    default: 'warn'
  retry-delay-seconds:
    description: 'Number of seconds to wait before retrying'
    required: false
    default: '10'

runs:
  using: 'composite'
  steps:
    - name: Upload artifact
      id: upload-artifact
      continue-on-error: true
      uses: actions/upload-artifact@v6
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: ${{ inputs.if-no-files-found }}

    - name: Wait before retrying artifact upload
      if: steps.upload-artifact.outcome == 'failure'
      shell: bash
      run: |
        echo "Artifact upload failed. Retrying in ${{ inputs.retry-delay-seconds }} seconds..."
        sleep "${{ inputs.retry-delay-seconds }}"

    - name: Retry artifact upload
      if: steps.upload-artifact.outcome == 'failure'
      uses: actions/upload-artifact@v6
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        overwrite: true
