appId: com.duckduckgo.mobile.ios
tags:
    - iphone
    - release
    - floating_ui_swipe_hides_chrome
name: floating_ui_swipe_hides_chrome

---

- launchApp:
    appId: "com.duckduckgo.mobile.ios"
    clearState: true
    clearKeychain: true
    arguments:
        isOnboardingCompleted: ${ONBOARDING_COMPLETED}
        currentAppVariant: ${APP_VARIANT}
        isRunningUITests: true
        ff.browsingMenuSheetEnabledByDefault: "true"
        ff.unifiedToggleInput: "true"
        ff.unifiedToggleInputIncludeNewUsers: "true"
        ff.floatingUI: "true"

- runFlow:
    file: ../shared/dismiss_chat_open_modals.yaml

- assertVisible:
    id: "searchEntry"
- tapOn:
    id: "searchEntry"
- inputText: "https://privacy-test-pages.site/viewport/fixed-elements.html"
- pressKey: Enter

- extendedWaitUntil:
    visible: "Page Content"
    timeout: 15000
- assertVisible: "Fixed top bar"
- assertVisible: "Fixed bottom bar"

- swipe:
    start: "50%, 75%"
    end: "50%, 25%"
    duration: 1000

- assertNotVisible:
    id: "searchEntry"
- assertVisible: "privacy-test-pages.site"
- assertVisible: "Fixed top bar"
- assertVisible: "Fixed bottom bar"

- swipe:
    start: "50%, 25%"
    end: "50%, 75%"
    duration: 1000

- assertVisible:
    id: "searchEntry"
- assertVisible: "Fixed top bar"
- assertVisible: "Fixed bottom bar"
