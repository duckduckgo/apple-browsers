appId: com.duckduckgo.mobile.ios
# Turns off Sync and deletes server data via the "Turn Off Sync & Backup" action.
# This action authenticates first, then opens the turn-off sheet, which defaults to deleting
# server data when this is the only synced device, and confirms the final alert.
# Ends on the logged-out Sync settings screen.
---

- assertVisible: Sync & Backup
- scrollUntilVisible:
    element:
      text: Turn Off Sync & Backup
    direction: DOWN
- tapOn: Turn Off Sync & Backup
# Authenticate only if prompted — the auth session may still be valid from a recent step.
- runFlow:
    when:
      visible: Unlock device to set up Sync & Backup
    commands:
      - inputText: "0000"
      - pressKey: Enter
# With only this device synced, the turn-off sheet opens with "delete server data" switched on.
- extendedWaitUntil:
    visible:
      id: "TurnOffAndDeleteServerDataButton"
    timeout: 30000
- tapOn:
    id: "TurnOffAndDeleteServerDataButton"
- assertVisible: You Can’t Undo This Action.
- tapOn: Permanently Delete
- extendedWaitUntil:
    visible: I Have a Recovery Code
    timeout: 30000
