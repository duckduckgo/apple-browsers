appId: com.duckduckgo.mobile.ios
tags:
    - iphone
    - example

---

# This test will run on iPhone simulator because it has the 'iphone' tag

# Set up 
- runFlow: 
    file: ../shared/setup.yaml

# First, verify we're running on iPhone by checking user agent
- assertVisible:
    id: searchEntry
- tapOn: 
    id: searchEntry
    
# Navigate to a user agent checking service
- inputText: "whatismybrowser.com"
- pressKey: Enter

# Wait for search results and click the first result
- assertVisible: "WhatIsMyBrowser.com"
- tapOn: "WhatIsMyBrowser.com"

# Wait for the page to load and verify iPhone is detected (not iPad)
- waitForAnimationToEnd
- assertVisible: ".*iPhone.*"
- assertNotVisible: ".*iPad.*"

# Navigate back to search
- tapOn:
    id: searchEntry
- clearText
    
# Now run a normal search to verify iPhone-specific layout
- inputText: "iOS developer jobs"
- pressKey: Enter

- assertVisible: ".*" # This will match any visible element