name: macOS - Performance tests

defaults:
  run:
    working-directory: macOS

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      branch:
        description: "Branch name"
        required: false
        type: string
  schedule:
    - cron: '0 5 * * *' # run at 5 AM UTC
  push:
    branches: [ main, "release/macos/**", "hotfix/macos/**" ]
    paths:
      - 'SharedPackages/BrowserServicesKit/**'
      - 'macOS/**'
  pull_request:
    # opened, synchronize, reopened are the default triggering events for a pull request
    # We're also adding ready_for_review to run checks when a draft PR becomes ready for review.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/macos_performance_tests.yml'
      - '.xcode-version'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  create-notarized-app:
    name: Build Notarized Review app
    uses: ./.github/workflows/macos_build_notarized.yml
    with:
      release-type: review
      create-dmg: false
      branch: ${{ inputs.branch || github.sha }}
      skip-notify: true
      build-ui-tests: true
    secrets: inherit

  performance-tests:
    name: Performance Tests
    needs: create-notarized-app
    runs-on: [image:osx-tahoe-27, ui-tests]

    env:
      RUNS_ON: image:osx-tahoe-27,ui-tests # keep this in sync with runs-on above
      RUNNER_NAME: image-osx-tahoe-27,ui-tests # artifact names cannot contain colons
      OS_VERSION: "26"

    timeout-minutes: 60

    steps:
    - name: Check out the code
      uses: actions/checkout@v6
      with:
        ref: ${{ inputs.branch || github.sha }}

    - name: Print macOS version
      run: sw_vers

    - name: Start measuring duration
      id: start-duration
      uses: ./.github/actions/measure-duration
      with:
        mode: start

    - name: Install screenresolution
      run: brew install screenresolution

    - name: Change screen resolution
      run: screenresolution set 1920x1080x32@60

    - name: Setup Ruby and dependencies
      uses: ./.github/actions/setup-ruby
      with:
        working-directory: macOS
        cache-key-prefix: macos-ruby

    - name: Download app artifact
      uses: actions/download-artifact@v7
      with:
        pattern: DuckDuckGo-review-*.app.tar.xz
        merge-multiple: true
        path: macOS

    - name: Download UI test bundle
      uses: actions/download-artifact@v7
      with:
        pattern: DuckDuckGo-ui-tests-review-*.tar.gz
        path: macOS/test-artifact
        merge-multiple: true

    - name: Select installed runtime Xcode
      run: python3 UITests/Helpers/ui-tests/latest-xcode.py

    - name: Configure system logging
      working-directory: SharedPackages/BrowserServicesKit
      run: |
        sudo cp com.apple.system.logging.plist /Library/Preferences/Logging/com.apple.system.logging.plist
        sudo killall logd || true

    - name: Start log stream in background
      working-directory: macOS
      run: |
        log stream --debug --info --predicate 'process == "DuckDuckGo Review" OR process == "UI Tests-Runner"' --style syslog > app-console.log 2>&1 &
        echo $! > log_stream.pid

    - name: Extract app and test artifacts
      run: |
        set -euo pipefail
        tar -xf DuckDuckGo-*.app.tar.xz
        tar -xzf test-artifact/*.tar.gz
        app=$(find . -maxdepth 1 -type d -name '*.app' -print -quit)
        ditto "$app" 'ui-tests/Products/Review/DuckDuckGo Review.app'

    - name: Run Performance Tests
      id: run-ui-tests

      run: |
        set -o pipefail
        python3 ui-tests/Scripts/artifact.py run ui-tests --suite performance \
          --result DerivedData/Logs/Test/portable-results \
          | tee -a xcodebuild.log | tee ui-tests.log

    - name: Build Performance Report
      if: always()
      working-directory: macOS
      run: |
        XCRESULT_PATH="$(find DerivedData/Logs/Test/portable-results -type d -name '*.xcresult' -print -quit)"
        if [[ ! -d "$XCRESULT_PATH" ]]; then
          echo "No .xcresult bundle found at $XCRESULT_PATH"
          exit 1
        fi

        START_TIME=$(date -u -r "${{ steps.start-duration.outputs.start-timestamp }}" '+%Y-%m-%d %H:%M:%S')

        ./scripts/build-memory-metrics-sql.sh \
          --runner "${{ env.RUNS_ON }}" \
          --xcresult-path "$XCRESULT_PATH" \
          --run-id "${{ github.run_id }}" \
          --branch "${{ github.ref_name }}" \
          --commit-hash "${{ github.sha }}" \
          --start-time "$START_TIME" \
          > insert-statements-memory.sql

        ./scripts/build-startup-metrics-sql.sh \
          --runner "${{ env.RUNS_ON }}" \
          --xcresult-path "$XCRESULT_PATH" \
          --suite StartupPerformanceTests \
          --run-id "${{ github.run_id }}" \
          --branch "${{ github.ref_name }}" \
          --commit-hash "${{ github.sha }}" \
          --start-time "$START_TIME" \
          > insert-statements-startup-metrics.sql

    - name: Debug Insert SQL
      if: always()
      working-directory: macOS
      run: |
        if [ -f insert-statements-memory.sql ]; then
          echo "Generated insert-statements-memory.sql:"
          cat insert-statements-memory.sql
        else
          echo "No insert-statements-memory.sql found"
        fi

        if [ -f insert-statements-startup-metrics.sql ]; then
          echo "Generated insert-statements-startup-metrics.sql:"
          cat insert-statements-startup-metrics.sql
        else
          echo "No insert-statements-startup-metrics.sql found"
        fi

    - name: Upload memory metrics
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: memory-metrics
        path: macOS/insert-statements-memory.sql
        retention-days: 1

    - name: Upload startup metrics
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: startup-metrics
        path: macOS/insert-statements-startup-metrics.sql
        retention-days: 1

    - name: Stop log stream
      if: always()
      working-directory: macOS
      run: |
        if [ -f log_stream.pid ]; then
          kill $(cat log_stream.pid) || true
        fi

    - name: Check for test failures
      id: check-failures
      if: always()
      working-directory: macOS
      run: |
        if grep -Eq 'XCTAssert.*failed|Test Case.*failed|Testing failed:' ui-tests.log; then
          echo "had_failures=true" >> $GITHUB_OUTPUT
          echo "⚠️ Detected test failures in the log (may have passed on retry)"
        else
          echo "had_failures=false" >> $GITHUB_OUTPUT
        fi

    - name: Report job duration
      if: success() || (always() && steps.run-ui-tests.outcome == 'failure')
      uses: ./.github/actions/measure-duration
      with:
        mode: stop
        start-timestamp: ${{ steps.start-duration.outputs.start-timestamp }}
        pixel-name: m_ci_apple_duration_macos_${{ env.OS_VERSION }}_performance_tests
        pixel-params: |
          runner: ${{ env.RUNS_ON }}

    - name: Prepare test report
      if: always() && steps.run-ui-tests.outcome != 'skipped'
      working-directory: macOS
      run: |
        xcbeautify --report junit --report-path . --junit-report-filename ui-tests.xml < ui-tests.log

    - name: Publish tests report
      uses: mikepenz/action-junit-report@v6
      if: always() && steps.run-ui-tests.outcome != 'skipped'
      with:
        check_name: "Test Report ${{ env.RUNNER_NAME }}"
        report_paths: macOS/ui-tests.xml
        check_retries: true

    - name: Upload xcresult files (passed on retry)
      uses: actions/upload-artifact@v6
      if: always() && steps.check-failures.outputs.had_failures == 'true' && steps.run-ui-tests.outcome == 'success'
      with:
        name: "xcresult-${{ env.RUNNER_NAME }}"
        path: "macOS/DerivedData/Logs/Test/**/*.xcresult"
        retention-days: 1

    - name: Upload app console log (passed on retry)
      uses: actions/upload-artifact@v6
      if: always() && steps.check-failures.outputs.had_failures == 'true' && steps.run-ui-tests.outcome == 'success'
      with:
        name: "app-console-${{ env.RUNNER_NAME }}-macos${{ env.OS_VERSION }}"
        path: "macOS/app-console.log"
        if-no-files-found: warn
        retention-days: 1

    - name: Organize logs for upload
      if: failure() || cancelled()
      working-directory: macOS
      run: |
        echo "Current working directory: $(pwd)"

        # Create staging directory with timestamp and OS version
        timestamp=$(date +"%Y-%m-%d_%H-%M-%S")
        archive_name="BuildLogs ${{ env.RUNNER_NAME }} (macOS ${{ env.OS_VERSION }}) ${timestamp}"
        echo "Creating archive directory: $archive_name"
        mkdir -p "$archive_name"

        # locate and copy all files, flattening the structure with verbose output
        cp "xcodebuild.log" "$archive_name/" || echo "No xcodebuild.log found"
        cp "ui-tests.log" "$archive_name/" || echo "No ui-tests.log found"
        cp "ui-tests.xml" "$archive_name/" || echo "No ui-tests.xml found"
        cp "app-console.log" "$archive_name/" || echo "No app-console.log found"
        find DerivedData/Logs/Test -name "*.xcresult" -print -exec cp -rf {} "$archive_name/" \; 2>&1 || echo "No .xcresult files found"
        cp -rf ~/Library/Logs/DiagnosticReports "$archive_name/" || echo "No DiagnosticReports found"

        # Store archive name for upload step
        echo "ARCHIVE_NAME=$archive_name" >> $GITHUB_ENV

    - name: Upload logs when workflow failed
      uses: actions/upload-artifact@v6
      if: failure() || cancelled()
      with:
        name: "${{ env.ARCHIVE_NAME }}"
        path: "macOS/${{ env.ARCHIVE_NAME }}"
        retention-days: 7

  report-memory-metrics-to-clickhouse:
    name: Report Memory Metrics to ClickHouse
    needs: performance-tests
    if: always()
    runs-on: [ self-hosted, apple, Linux ]

    steps:
      - name: Download startup metrics
        uses: actions/download-artifact@v7
        with:
          name: startup-metrics

      - name: Download memory metrics
        uses: actions/download-artifact@v7
        with:
          name: memory-metrics

      - name: Report Startup Metrics to ClickHouse
        working-directory: .
        run: |
          echo "🕰️🕰️🕰️ Reporting Startup Metrics 🕰️🕰️🕰️"
          cat insert-statements-startup-metrics.sql

          clickhouse-client --no-warnings -m -n --user dev-rw -h clickhouse.duckduckgo.com --queries-file insert-statements-startup-metrics.sql

          echo "🏁🏁🏁 Report complete 🏁🏁🏁"

      - name: Report Memory Metrics to ClickHouse
        working-directory: .
        run: |
          echo "🧠🧠🧠 Reporting Memory Metrics 🧠🧠🧠"
          cat insert-statements-memory.sql

          clickhouse-client --no-warnings -m -n --user dev-rw -h clickhouse.duckduckgo.com --queries-file insert-statements-memory.sql

          echo "🏁🏁🏁 Report complete 🏁🏁🏁"

  notify-failure:
    name: Notify on failure
    if: ${{ always() && github.event_name == 'schedule' && (needs.performance-tests.result == 'failure' || needs.performance-tests.result == 'cancelled') }}
    needs: [performance-tests]
    runs-on: ubuntu-latest

    steps:
    - name: Check out the code
      uses: actions/checkout@v6
      with:
        ref: ${{ inputs.branch || github.sha }}

    - name: Create Asana task when workflow failed
      uses: duckduckgo/native-github-asana-sync@v2.5.1
      with:
        action: create-asana-task
        asana-pat: ${{ secrets.ASANA_ACCESS_TOKEN }}
        asana-project: ${{ vars.MACOS_APP_DEVELOPMENT_ASANA_PROJECT_ID }}
        asana-task-name: GH Workflow Failure - Performance Tests
        asana-task-description: The Performance Tests workflow has failed. See https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
