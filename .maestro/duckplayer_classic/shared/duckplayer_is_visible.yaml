appId: com.duckduckgo.mobile.ios
---
# Verify Duck Player Classic is visible - wait for iframe to load
- waitForAnimationToEnd

- assertVisible: 
    text: "Duck Player"

- retry:
    maxRetries: 2
    commands:
        - runFlow:
            when:
                notVisible: ${output.watchOnYoutubeLabel}
            commands:
                - tapOn:
                    point: "50%,15%"
        - assertVisible: 
            text: ${output.watchOnYoutubeLabel}

- retry:
    maxRetries: 2
    commands:
        - runFlow:
            when:
                notVisible: ${output.openInfoLabel}
            commands:
                - tapOn:
                    point: "50%,15%"
        - assertVisible: 
            text: ${output.openInfoLabel}
