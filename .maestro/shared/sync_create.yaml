appId: com.duckduckgo.mobile.ios
# Creates a Sync account on this device using the simplified Sync setup UI.
# Account creation is triggered by the "Sync & Backup" toggle.
---

- tapOn: Sync & Backup
- assertVisible: Sync & Backup
- tapOn:
    id: "SyncToggle"
- inputText: "0000"
- pressKey: Enter
- runFlow:
    when:
      visible: Sync your data with another device?
    commands:
      - tapOn: Not Now
- assertVisible: Turn Off Sync and Delete Server Data
