name: Smartling - On Merge

# Submits a platform's new strings to Smartling as soon as a merge into main changes its English strings, instead of
# waiting for the nightly, so a PR's label job is less likely to take them first. The nightly still runs as a safety
# net for merges this misses and runs that fail, and only the nightly opens a failure task.
# Each merge gets its own job, authorized up to the same limit as the nightly.
# To test the trigger and job name without writing to Smartling or Asana, run it manually with dry_run set.
on:
  push:
    branches:
      - main
      - andremartingo/smartling-submit-on-merge
    # The committed English sources. The exported XLIFFs aren't committed, and PR checks keep these in sync with the code.
    paths:
      - 'iOS/**/en.lproj/**'
      - 'iOS/**/*.xcstrings'
      - 'iOS/**/*.storyboard'
      - 'iOS/**/*.xib'
      - 'macOS/**/en.lproj/**'
      - 'macOS/**/*.xcstrings'
      - 'macOS/**/*.storyboard'
      - 'macOS/**/*.xib'
      - 'SharedPackages/**/en.lproj/**'
      - 'SharedPackages/**/*.xcstrings'
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform"
        type: choice
        default: both
        options:
          - both
          - iOS
          - macOS
      auto_authorize_max_usd:
        description: "Authorize jobs whose maximum USD estimate is at most this (0 never authorizes)"
        type: string
        default: "500.00"
      dry_run:
        description: "Export and resolve the job name without writing to Smartling or Asana"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  platforms:
    name: Find platforms with string changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      platforms: ${{ steps.platforms.outputs.platforms }}
    steps:
      # The paths above trigger the run for either platform, so pick the platforms whose strings changed. When the
      # changed files can't be listed in full, both platforms run: a run with nothing new only deletes its empty job.
      - name: Find platforms
        id: platforms
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PLATFORM: ${{ inputs.platform }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            case "$PLATFORM" in
              both) platforms='["iOS","macOS"]' ;;
              *) platforms="[\"$PLATFORM\"]" ;;
            esac
          elif [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]]; then
            echo "No previous commit to compare with, so both platforms run."
            platforms='["iOS","macOS"]'
          else
            # The compare API lists at most 300 files, like the paths filter.
            files="$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$AFTER" --jq '.files[].filename')"
            ios=false
            macos=false
            if [[ "$(wc -l <<< "$files")" -ge 300 ]]; then
              echo "The merge changes at least 300 files, so both platforms run."
              ios=true
              macos=true
            fi
            ! grep -qE '^(iOS/.*(/en\.lproj/|\.xcstrings$|\.storyboard$|\.xib$)|SharedPackages/.*(/en\.lproj/|\.xcstrings$))' <<< "$files" || ios=true
            ! grep -qE '^(macOS/.*(/en\.lproj/|\.xcstrings$|\.storyboard$|\.xib$)|SharedPackages/.*(/en\.lproj/|\.xcstrings$))' <<< "$files" || macos=true
            platforms="$(jq -cn --argjson ios "$ios" --argjson macos "$macos" \
              '[if $ios then "iOS" else empty end, if $macos then "macOS" else empty end]')"
          fi
          echo "Platforms: $platforms"
          echo "platforms=$platforms" >> "$GITHUB_OUTPUT"

  smartling:
    name: ${{ matrix.platform }} on merge
    needs: platforms
    if: needs.platforms.outputs.platforms != '[]'
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.platforms.outputs.platforms) }}
    uses: ./.github/workflows/smartling_submit.yml
    with:
      kind: merge
      platform: ${{ matrix.platform }}
      auto_authorize_max_usd: ${{ inputs.auto_authorize_max_usd || '500.00' }}
      dry_run: ${{ inputs.dry_run || github.ref_name != 'main' }}
    secrets: inherit
