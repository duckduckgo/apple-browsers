name: macOS - crossbench Safari LCP (WPR)

# Test harness on a GitHub-hosted macOS runner,
# measures Safari navigation -> Largest Contentful Paint against WPR archives
# through the US-broadband traffic-shaping profile,
# and uploads the per-rep results as a downloadable artifact. Optionally
# (opt-in dispatch input) a second, self-hosted job inserts per-domain
# aggregates into ClickHouse (native_apps.macos_browser_health_nav_to_lcp).
#
# Safari sibling of macos_crossbench_chrome.yml. Two Safari-specific wrinkles:
#   - Safari's per-app proxy preferences route it through a local HTTP proxy,
#     pinned tsproxy and pinned WPR. The original preference state is restored
#     on exit; no system proxy or keychain is changed.
#   - LCP is read from the page via a buffered PerformanceObserver over
#     WebDriver, with acceptInsecureCerts=true.
#   - The Safari automation helper drives safaridriver (WebDriver), which requires
#     "Allow Remote Automation". We enable it with `sudo safaridriver --enable`
#     below. GitHub-hosted macOS runners grant passwordless sudo, so this works
#     there; a self-hosted runner must allow it (see the step's comment).
#
# Triggered manually (workflow_dispatch) and on a daily off-peak schedule. No
# pull_request/push trigger, so fork PRs can't run it.

on:
  workflow_dispatch:
    inputs:
      sites:
        description: "Comma-separated sites (blank = full 22-site list)"
        required: false
        default: ""
      reps:
        description: "Measured loads per site"
        required: false
        default: "10"
      upload-to-clickhouse:
        description: "Upload aggregated per-domain results to ClickHouse"
        type: boolean
        required: false
        default: false
      alert-asana:
        description: "Create an Asana subtask for new WPR archive validation errors"
        type: boolean
        required: false
        default: true
  schedule:
    # 06:00 UTC = 2am US Eastern / 7am CET: deep US night, before the EU ramp,
    # and the ~1.5h run finishes before either region gets busy — so both
    # hosted and self-hosted runners are near their quietest. A scheduled run
    # takes the input defaults (blank sites = full 22-site list) and forces the
    # ClickHouse upload via the job gate below. NOTE: GitHub only fires schedule
    # triggers from the repo's default branch (main).
    - cron: "0 6 * * *"

permissions:
  contents: read
  # actions: read lets the aggregate step read this run's metadata via
  # `gh api .../actions/runs/{id}`. Not strictly needed while the repo is
  # public (run metadata is world-readable), but required if it ever goes
  # private, and it documents the dependency.
  actions: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: macOS/scripts/crossbench

jobs:
  validate-wpr:
    uses: ./.github/workflows/wpr_archive_validation.yml
    with:
      sites: ${{ inputs.sites || '' }}
      alert-asana: ${{ github.event_name != 'workflow_dispatch' || inputs.alert-asana }}
    secrets:
      ASANA_ACCESS_TOKEN: ${{ secrets.ASANA_ACCESS_TOKEN }}

  safari-lcp:
    name: Safari LCP (WPR)
    needs: validate-wpr
    # Free standard hosted runner (Apple Silicon, 3 cores), matching the Chrome
    # workflow so both browsers are measured on identical hardware. The larger
    # macos-26-xlarge was measured on the Chrome side and made no difference, so
    # it billed without buying anything. If you revisit this, note macos-*-large
    # is Intel x86_64 and would break comparability; only -xlarge is Apple
    # Silicon.
    runs-on: macos-latest
    # Ten measured loads per site with no replay warm-up. The cap leaves room
    # for provisioning and slow/failing navigations.
    timeout-minutes: 200

    steps:
      - name: Check out the code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download validated WPR archives
        uses: actions/download-artifact@v7
        with:
          name: validated-wpr-archives
          path: ${{ runner.temp }}/wpr-archives

      - name: Provision WPR and traffic shaping (no Chrome)
        # INSTALL_CHROME=0 retains the pinned WPR build and checksum-verified
        # tsproxy, while skipping the browser this job does not use.
        env:
          INSTALL_CHROME: "0"
        run: ./provision-macos.sh

      - name: Enable safaridriver Remote Automation
        # REQUIRED: crossbench drives Safari through safaridriver (WebDriver),
        # which refuses to create a session until "Allow Remote Automation" is
        # enabled. `--enable` needs root; GitHub-hosted macOS runners provide
        # passwordless sudo, so this succeeds there. RISK / UNKNOWN: on a locked-
        # down self-hosted runner sudo may prompt or be denied, and the setting
        # is per-user — if the runner's Safari user differs this must be enabled
        # for that user. If this step fails, the run below cannot start Safari.
        run: sudo safaridriver --enable

      - name: Run Safari LCP suite
        # Inputs passed via env, not interpolated into the script, to avoid shell injection.
        env:
          SITES: ${{ inputs.sites }}
          REPS: ${{ inputs.reps }}
          WPR_DIR: ${{ runner.temp }}/wpr-archives
          WPR_ARCHIVES_PREPARED: "1"
        run: |
          args=(--yes)
          if [ -n "$SITES" ]; then
            args+=(--sites "$SITES")
          fi
          if [ -n "$REPS" ]; then
            args+=(--reps "$REPS")
          fi
          ./test-safari.sh "${args[@]}"

      - name: Upload results TSV
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: safari-lcp-results
          # Path is workspace-relative (not affected by defaults.working-directory).
          path: macOS/scripts/crossbench/crossbench-results/*.tsv
          if-no-files-found: warn
          retention-days: 7

      - name: Upload per-site dispositions TSV
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: safari-lcp-dispositions
          # Separate directory from crossbench-results/ on purpose: the aggregate
          # step below globs that directory for *.tsv and feeds the first match to
          # aggregate-lcp.py, so a second TSV there would be read as measurements.
          path: macOS/scripts/crossbench/crossbench-dispositions/*.tsv
          if-no-files-found: warn
          retention-days: 7

      - name: Aggregate results for ClickHouse
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # run_started_at is per-ATTEMPT (it becomes the ReplacingMergeTree
          # version column, so a re-run supersedes the rows of the attempt it
          # replaces); created_at is stable across attempts and keeps
          # start_time — and the date partition derived from it — identical
          # for every attempt of the run.
          #
          # Replay rows use sfr-wpr so they cannot mix with historical
          # live-network sfr rows. webview-channel remains stable.
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
          in_tsv=(crossbench-results/*.tsv)
          ./aggregate-lcp.py \
            --input "${in_tsv[0]}" \
            --output clickhouse-rows.tsv \
            --run-id "$GITHUB_RUN_ID" \
            --start-time "$(jq -r '.created_at' <<< "$run_json")" \
            --gh-run-started-at "$(jq -r '.run_started_at' <<< "$run_json")" \
            --webview-type sfr-wpr
          cat clickhouse-rows.tsv

      - name: Upload ClickHouse rows TSV
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: safari-lcp-clickhouse-rows
          path: macOS/scripts/crossbench/clickhouse-rows.tsv
          if-no-files-found: warn
          retention-days: 7

      - name: Aggregate dispositions for ClickHouse
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Same run metadata as the metrics aggregation above, so a domain's
          # metrics row and its attempts row share run_id, start_time and the
          # ReplacingMergeTree version.
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
          in_tsv=(crossbench-dispositions/*.tsv)
          ./aggregate-dispositions.py \
            --input "${in_tsv[0]}" \
            --output clickhouse-attempts.tsv \
            --run-id "$GITHUB_RUN_ID" \
            --start-time "$(jq -r '.created_at' <<< "$run_json")" \
            --gh-run-started-at "$(jq -r '.run_started_at' <<< "$run_json")" \
            --webview-type sfr-wpr
          cat clickhouse-attempts.tsv

      - name: Upload ClickHouse attempts TSV
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: safari-lcp-attempts-rows
          path: macOS/scripts/crossbench/clickhouse-attempts.tsv
          if-no-files-found: warn
          retention-days: 7

  upload-to-clickhouse:
    name: Upload to ClickHouse
    needs: safari-lcp
    # Hosted runners can't reach the ClickHouse host, hence this separate
    # self-hosted job.
    #
    # always() on purpose: without it the implicit success() means a benchmark
    # job that fails or times out uploads NOTHING — including the disposition
    # record, which is exactly what you need for the runs that went wrong. Each
    # insert below is guarded on its file existing instead, so a partial run
    # uploads whatever it did produce.
    if: always() && (github.event_name == 'schedule' || inputs.upload-to-clickhouse)
    runs-on: [ self-hosted, apple ]

    steps:
      - name: Download ClickHouse rows TSV
        # A cancelled or early-failed benchmark job may never have uploaded this;
        # that is not a reason to skip the attempts insert below.
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: safari-lcp-clickhouse-rows

      - name: Download ClickHouse attempts TSV
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: safari-lcp-attempts-rows

      - name: Insert rows into ClickHouse
        # Workspace root: the repo isn't checked out in this job, so the
        # workflow-level working-directory doesn't exist here, and
        # download-artifact lands files at the root.
        working-directory: .
        env:
          GH_RUN_CONCLUSION: ${{ needs.safari-lcp.result }}
        run: |
          inserted=0

          # gh_run_conclusion is appended here rather than in the aggregation
          # step: a job can't know its own conclusion while still running.
          if [ -s clickhouse-rows.tsv ]; then
            awk -v c="$GH_RUN_CONCLUSION" '{ print $0 "\t" c }' clickhouse-rows.tsv > clickhouse-rows-final.tsv
            cat clickhouse-rows-final.tsv
            clickhouse-client --no-warnings --user dev-rw -h clickhouse.duckduckgo.com --query "INSERT INTO native_apps.macos_browser_health_nav_to_lcp (run_id, start_time, domain, webview_type, webview_channel, webview_version, samples, min_ms, max_ms, mean_ms, p25_ms, p50_ms, p75_ms, p95_ms, gh_run_started_at, gh_run_conclusion) FORMAT TSV" < clickhouse-rows-final.tsv
            inserted=$((inserted + 1))
          else
            echo "no metrics rows to insert (benchmark job produced none)"
          fi

          if [ -s clickhouse-attempts.tsv ]; then
            awk -v c="$GH_RUN_CONCLUSION" '{ print $0 "\t" c }' clickhouse-attempts.tsv > clickhouse-attempts-final.tsv
            cat clickhouse-attempts-final.tsv
            clickhouse-client --no-warnings --user dev-rw -h clickhouse.duckduckgo.com --query "INSERT INTO native_apps.macos_browser_health_nav_to_lcp_attempts (run_id, start_time, domain, webview_type, webview_channel, webview_version, outcome, validation_status, validation_reason, validation_http_status, validation_detail, archive_sha256, requested_repetitions, observed_repetitions, recorded_samples, dropped_unfinalized, dropped_no_metric, load_window_ms, runner_image, gh_run_started_at, gh_run_conclusion) FORMAT TSV" < clickhouse-attempts-final.tsv
            inserted=$((inserted + 1))
          else
            echo "no attempts rows to insert"
          fi

          if [ "$inserted" -eq 0 ]; then
            echo "ERROR: neither artifact was present — nothing was uploaded." >&2
            exit 1
          fi
