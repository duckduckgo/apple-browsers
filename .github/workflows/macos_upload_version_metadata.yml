name: macOS - Upload Version Metadata

on:
  workflow_dispatch:
    inputs:
      is_critical:
        description: 'Mark this release as critical (for hotfixes)'
        type: boolean
        default: false
  pull_request:
    paths:
      - '.github/workflows/macos_upload_version_metadata.yml'
  workflow_call:
    inputs:
      is_critical:
        description: 'Mark this release as critical'
        type: boolean
        default: false
    secrets:
      AWS_ACCESS_KEY_ID_RELEASE_S3:
        required: true
      AWS_SECRET_ACCESS_KEY_RELEASE_S3:
        required: true

defaults:
  run:
    working-directory: macOS

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upload-metadata:
    name: Upload Release Metadata to CDN
    runs-on: macos-15
    timeout-minutes: 10

    env:
      S3_PATH: s3://ddg-staticcdn/macos-desktop-browser/
      CDN_PATH: https://staticcdn.duckduckgo.com/macos-desktop-browser/

    steps:
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        uses: ./.github/actions/select-xcode-version

      - name: Extract version and build number
        id: version-info
        run: |
          # Extract version and build number using the same pattern as other workflows
          VERSION=$(xcrun xcodebuild \
            -scheme "macOS Browser" \
            -showBuildSettings 2>/dev/null \
            | grep "MARKETING_VERSION" \
            | awk '{print $3}')
          
          BUILD=$(xcrun xcodebuild \
            -scheme "macOS Browser" \
            -showBuildSettings 2>/dev/null \
            | grep "CURRENT_PROJECT_VERSION" \
            | awk '{print $3}')
          
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          # Validate that we got the version info
          if [[ -z "$VERSION" ]]; then
            echo "Error: Failed to extract MARKETING_VERSION"
            exit 1
          fi
          
          if [[ -z "$BUILD" ]]; then
            echo "Error: Failed to extract CURRENT_PROJECT_VERSION"
            exit 1
          fi
          
          echo "Extracted version: $VERSION"
          echo "Extracted build: $BUILD"
          echo "Generated timestamp: $TIMESTAMP"
          
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "build=${BUILD}" >> $GITHUB_OUTPUT
          echo "timestamp=${TIMESTAMP}" >> $GITHUB_OUTPUT

      - name: Download existing metadata (if exists)
        continue-on-error: true
        run: |
          echo "Checking for existing metadata at ${CDN_PATH}release_metadata.json"
          if curl -fLSs "${CDN_PATH}release_metadata.json" --output existing_metadata.json; then
            echo "✅ Found existing metadata file"
            echo "Current content:"
            cat existing_metadata.json | jq .
          else
            echo "❌ No existing metadata found, will create new file"
            echo "{}" > existing_metadata.json
          fi

      - name: Generate updated metadata JSON
        run: |
          echo "Generating updated metadata JSON..."
          jq --arg version "${{ steps.version-info.outputs.version }}" \
             --arg build "${{ steps.version-info.outputs.build }}" \
             --arg timestamp "${{ steps.version-info.outputs.timestamp }}" \
             --argjson critical "${{ inputs.is_critical || false }}" \
             '.latest_appstore_version = {
               "latest_version": $version,
               "build_number": $build,
               "release_date": $timestamp,
               "is_critical": $critical
             }' existing_metadata.json > release_metadata.json
          
          echo "Generated metadata:"
          cat release_metadata.json | jq .
          
          # Validate JSON structure
          if ! jq -e '.latest_appstore_version.latest_version' release_metadata.json > /dev/null; then
            echo "Error: Generated JSON is missing required latest_version field"
            exit 1
          fi

      - name: Upload metadata to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID_RELEASE_S3 }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_RELEASE_S3 }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
        run: |
          echo "Uploading release_metadata.json to S3..."
          aws s3 cp release_metadata.json "${S3_PATH}release_metadata.json" --acl public-read
          
          echo "✅ Upload completed successfully"

      - name: Verify upload
        run: |
          echo "Verifying upload by fetching from CDN..."
          sleep 5  # Brief wait for CDN propagation
          
          if curl -fLSs "${CDN_PATH}release_metadata.json" --output verified_metadata.json; then
            echo "✅ File successfully accessible from CDN"
            echo "Verified content:"
            cat verified_metadata.json | jq .
            
            # Verify the version matches what we uploaded
            UPLOADED_VERSION=$(jq -r '.latest_appstore_version.latest_version' verified_metadata.json)
            if [[ "$UPLOADED_VERSION" == "${{ steps.version-info.outputs.version }}" ]]; then
              echo "✅ Version verification successful: $UPLOADED_VERSION"
            else
              echo "❌ Version mismatch: expected ${{ steps.version-info.outputs.version }}, got $UPLOADED_VERSION"
              exit 1
            fi
          else
            echo "❌ Failed to verify upload - file not accessible from CDN"
            exit 1
          fi

      - name: Summary
        run: |
          echo "🎉 Successfully updated macOS release metadata"
          echo "Version: ${{ steps.version-info.outputs.version }}"
          echo "Build: ${{ steps.version-info.outputs.build }}"
          echo "Release Date: ${{ steps.version-info.outputs.timestamp }}"
          echo "Is Critical: ${{ inputs.is_critical || false }}"
          echo "📍 Available at: ${CDN_PATH}release_metadata.json"
          
          # Add to GitHub Step Summary
          {
            echo "## 📱 macOS Version Metadata Updated"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| **Version** | \`${{ steps.version-info.outputs.version }}\` |"
            echo "| **Build Number** | \`${{ steps.version-info.outputs.build }}\` |"
            echo "| **Release Date** | \`${{ steps.version-info.outputs.timestamp }}\` |"
            echo "| **Is Critical** | \`${{ inputs.is_critical || false }}\` |"
            echo "| **CDN URL** | [release_metadata.json](${CDN_PATH}release_metadata.json) |"
            echo ""
            echo "✅ Metadata successfully uploaded to CDN"
          } >> $GITHUB_STEP_SUMMARY
