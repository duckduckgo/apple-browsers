name: Shared - SwiftLint
on:
  pull_request:
    types: [labeled, unlabeled, opened, reopened, edited, synchronize]

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: SwiftLint
        run: |
          docker run --rm \
            -v "$(pwd):/workspace" \
            -w /workspace \
            norionomura/swiftlint:0.54.0_swift-5.9.0 \
            swiftlint --reporter github-actions-logging --strict --quiet \
          | tee >(grep -oP '(?<=file=)[^,]+' | sort -u >&2)
