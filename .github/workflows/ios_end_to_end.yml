name: iOS - Duck Player CI diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the failed Maestro upload
        env:
          MAESTRO_API_KEY: ${{ secrets.ROBIN_API_KEY }}
          PROJECT_ID: ${{ vars.ROBIN_PROJECT_KEY }}
          GH_ENTERPRISE_TOKEN: unused
        run: |
          mkdir diagnostics
          gh api --hostname api.copilot.mobile.dev --method GET \
            --header "Authorization: Bearer $MAESTRO_API_KEY" \
            --header "Accept: application/json" \
            "v2/project/$PROJECT_ID/upload/mupload_01m7nmc5hdetbbhh0t5dxr0tzj" \
            > diagnostics/upload.json

      - name: Preserve diagnostic evidence
        uses: actions/upload-artifact@v6
        with:
          name: duckplayer-ci-diagnostics
          path: diagnostics/
          retention-days: 3
