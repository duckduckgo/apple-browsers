# XcodeGen spec for the verify-ios runner. VRunner.xcodeproj is generated from this file and checked in, so
# nobody needs XcodeGen to use the skill. After editing, regenerate with: (cd runner && xcodegen generate)
# Not part of DuckDuckGo-iOS.xcodeproj: CI's UI tests never build or run it.
name: VRunner
options:
  bundleIdPrefix: com.duckduckgo.verifyios
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
targets:
  VRHost-iOS:
    type: application
    platform: iOS
    sources: [Sources/Host]
    settings: { base: { PRODUCT_BUNDLE_IDENTIFIER: com.duckduckgo.verifyios.host, INFOPLIST_KEY_UILaunchScreen_Generation: YES } }
  VRunnerUITests-iOS:
    type: bundle.ui-testing
    platform: iOS
    sources: [Sources/Runner]
    dependencies: [{ target: VRHost-iOS }]
    settings: { base: { PRODUCT_BUNDLE_IDENTIFIER: com.duckduckgo.verifyios.runner, TEST_TARGET_NAME: VRHost-iOS } }
schemes:
  VRunner-iOS:
    build: { targets: { VRHost-iOS: all, VRunnerUITests-iOS: [test] } }
    test: { targets: [VRunnerUITests-iOS] }
