appId: com.duckduckgo.mobile.ios
tags:
    - iphone
    - release
    - unified_toggle_input
name: test_chat_tab_send_prompt

---

- launchApp:
    appId: "com.duckduckgo.mobile.ios"
    clearState: true
    clearKeychain: true
    arguments:
        isOnboardingCompleted: ${ONBOARDING_COMPLETED}
        currentAppVariant: ${APP_VARIANT}
        isRunningUITests: true
        ff.browsingMenuSheetEnabledByDefault: "true"
        ff.unifiedToggleInput: "true"

# Open Duck.ai chat tab
- tapOn:
    id: "Browser.OmniBar.Button.AIChat"

- runFlow:
    when:
        visible: "Agree and Continue"
    commands:
        - tapOn: "Agree and Continue"
- runFlow:
    when:
        visible: "×"
    commands:
        - tapOn: "×"
- runFlow:
    when:
        visible: "×"
    commands:
        - tapOn: "×"

# Verify chat tab is open
- assertVisible: "Close tab"
- assertVisible:
    id: "AIChat.Toolbar.Button.ModelChip"

# Type a prompt and submit
- tapOn:
    id: "searchEntry"
- inputText: "What is a duck?"
- tapOn: "Submit"

# User message appears in conversation (deterministic: text persists as chat bubble)
- assertVisible: "What is a duck?"
