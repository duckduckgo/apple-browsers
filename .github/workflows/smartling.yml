name: Smartling

on:
  # push:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform"
        type: choice
        required: true
        default: 'iOS'
        options:
           - iOS
           - macOS
      action:
        description: "Action"
        type: choice
        required: true
        default: 'upload'
        options:
           - upload
           - approve
           - status
           - download
      job-id:
        description: "Smartling job ID"
        required: false
        type: string
      force:
        description: "Force import even if it causes deletions"
        required: false
        type: boolean
        default: false

jobs:
  shellcheck:

    name: ShellCheck

    runs-on: ubuntu-latest

    steps:
    - name: Check out the code
      uses: actions/checkout@v4

    - name: Run ShellCheck
      run: |
        shellcheck -e SC1091 scripts/loc_tool.sh scripts/smartling_download.sh scripts/smartling_upload.sh scripts/smartling_messages.sh

  pylint:

    name: Python Lint

    runs-on: ubuntu-latest

    steps:
    - name: Check out the code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: |
        pip install aiohttp pylint

    - name: Run pylint
      run: |
        pylint scripts/localization_tool.py

  smartling:
    runs-on: macos-15-xlarge
    name: Smartling translation job

    env:
      RUNS_ON: macos-15-xlarge # keep this in sync with runs-on above

    steps:

      - name: Assert not main or release branch
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]] || [[ "${{ github.ref_name }}" == release/* ]]; then
            echo "🚫 Smartling workflow should not run on main or release branches"
            echo "This workflow is for feature branches only"
            exit 1
          fi
          echo "✅ Running on branch: ${{ github.ref_name }}"

      - name: Check out the code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Set Smartling credentials (iOS)
        if: ${{ github.event.inputs.platform == 'iOS' }}
        run: |
          echo "SMARTLING_USER_ID=${{ secrets.IOS_SMARTLING_USER_ID }}" >> $GITHUB_ENV
          echo "SMARTLING_USER_SECRET=${{ secrets.IOS_SMARTLING_USER_SECRET }}" >> $GITHUB_ENV
          echo "SMARTLING_PROJECT_ID=${{ vars.IOS_SMARTLING_PROJECT_ID }}" >> $GITHUB_ENV

      - name: Set Smartling credentials (macOS)
        if: ${{ github.event.inputs.platform == 'macOS' }}
        run: |
          echo "SMARTLING_USER_ID=${{ secrets.MACOS_SMARTLING_USER_ID }}" >> $GITHUB_ENV
          echo "SMARTLING_USER_SECRET=${{ secrets.MACOS_SMARTLING_USER_SECRET }}" >> $GITHUB_ENV
          echo "SMARTLING_PROJECT_ID=${{ vars.MACOS_SMARTLING_PROJECT_ID }}" >> $GITHUB_ENV

      - name: Select Xcode
        uses: ./.github/actions/select-xcode-version

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install aiohttp

      - name: Install xmlstarlet (required for macOS export)
        if: ${{ github.event.inputs.platform == 'macOS' && github.event.inputs.action == 'upload' }}
        run: |
          brew install xmlstarlet

      - name: Export
        id: export
        if: ${{ github.event.inputs.action == 'upload' }}
        run: |
          set -e -o pipefail
          ./${{ github.event.inputs.platform }}/scripts/loc_export.sh | xcbeautify

      - name: Upload to Smartling
        if: ${{ github.event.inputs.action == 'upload' }}
        id: upload
        run: |
          # Capture output and extract job ID
          output=$(./scripts/smartling_upload.sh "${{ github.event.inputs.platform }}" "${{ github.ref_name }}" 2>&1 || echo "FAILED")
          echo "$output"

          if echo "$output" | grep -q "JOB_ID="; then
            job_id=$(echo "$output" | grep -o 'JOB_ID=[^[:space:]]*' | cut -d= -f2)
            echo "job_id=$job_id" >> $GITHUB_OUTPUT

            # Generate success message
            ./scripts/smartling_messages.sh upload upload_message.txt "${{ github.event.inputs.platform }}" "$job_id" "${{ env.SMARTLING_PROJECT_ID }}" success
          else
            # Generate error message
            ./scripts/smartling_messages.sh upload upload_message.txt "${{ github.event.inputs.platform }}" "" "${{ env.SMARTLING_PROJECT_ID }}" failed
          fi

      - name: Comment upload result
        if: ${{ github.event.inputs.action == 'upload' }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: smartling-upload
          path: upload_message.txt

      - name: Check Status
        if: ${{ github.event.inputs.action == 'status' }}
        run: |
          output=$(./scripts/loc_tool.sh status --job-id "${{ github.event.inputs.job-id }}" 2>&1)
          echo "$output"

          # Extract status and progress
          status=$(echo "$output" | grep -o 'STATUS=[^[:space:]]*' | cut -d= -f2 || echo "UNKNOWN")
          percent=$(echo "$output" | grep -o 'PERCENT=[^[:space:]]*' | cut -d= -f2 || echo "0")

          # Generate status message
          ./scripts/smartling_messages.sh status status_message.txt "${{ github.event.inputs.platform }}" "${{ github.event.inputs.job-id }}" "${{ env.SMARTLING_PROJECT_ID }}" "$status" "$percent"

      - name: Comment status result
        if: ${{ github.event.inputs.action == 'status' }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: smartling-status
          path: status_message.txt

      - name: Approve Job
        if: ${{ github.event.inputs.action == 'approve' }}
        run: |
          output=$(./scripts/loc_tool.sh approve --job-id "${{ github.event.inputs.job-id }}" 2>&1)
          echo "$output"

          if echo "$output" | grep -q "APPROVED=1"; then
            # Generate success message
            ./scripts/smartling_messages.sh approve approve_message.txt "${{ github.event.inputs.platform }}" "${{ github.event.inputs.job-id }}" "${{ env.SMARTLING_PROJECT_ID }}" success
          else
            # Generate error message
            ./scripts/smartling_messages.sh approve approve_message.txt "${{ github.event.inputs.platform }}" "${{ github.event.inputs.job-id }}" "${{ env.SMARTLING_PROJECT_ID }}" failed
          fi

      - name: Comment approve result
        if: ${{ github.event.inputs.action == 'approve' }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: smartling-approve
          path: approve_message.txt

      - name: Download from Smartling
        if: ${{ github.event.inputs.action == 'download' }}
        run: |
          set +e
          output=$(./scripts/smartling_download.sh "${{ github.event.inputs.job-id }}" "${{ github.event.inputs.force }}" "${{ github.event.inputs.platform }}" 2>&1)
          exit_code=$?
          set -e
          echo "$output"

          if [ $exit_code -eq 0 ]; then
            if echo "$output" | grep -q "Changes pushed to current branch"; then
              # Generate success message
              ./scripts/smartling_messages.sh download download_message.txt "${{ github.event.inputs.platform }}" "${{ github.event.inputs.job-id }}" "${{ env.SMARTLING_PROJECT_ID }}" success
            else
              # Generate no changes message
              ./scripts/smartling_messages.sh download download_message.txt "${{ github.event.inputs.platform }}" "${{ github.event.inputs.job-id }}" "${{ env.SMARTLING_PROJECT_ID }}" no_changes
            fi
          else
            # Check for specific errors
            if echo "$output" | grep -q "Import would delete existing translations"; then
              # Generate deletion error message
              ./scripts/smartling_messages.sh download download_message.txt "${{ github.event.inputs.platform }}" "${{ github.event.inputs.job-id }}" "${{ env.SMARTLING_PROJECT_ID }}" failed deletions
            else
              # Generate generic error message
              ./scripts/smartling_messages.sh download download_message.txt "${{ github.event.inputs.platform }}" "${{ github.event.inputs.job-id }}" "${{ env.SMARTLING_PROJECT_ID }}" failed
            fi
          fi

      - name: Comment download result
        if: ${{ github.event.inputs.action == 'download' }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: smartling-download
          path: download_message.txt
