name: iOS - Make ad-hoc build

defaults:
  run:
    working-directory: iOS

on:
  workflow_dispatch:
    inputs:
      suffix:
        description: "Text to append at the end of the build name"
        required: false
      asana-task-url:
        description: "Asana task URL"
        required: false
        type: string
      build-type:
        description: "Build Configuration"
        type: choice
        required: true
        default: 'Alpha'
        options:
           - Alpha
           - Release
           - Experimental
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

jobs:
  make-adhoc:
    if: >-
      ${{
        github.repository == 'duckduckgo/apple-browsers' &&
        (
          github.event_name == 'workflow_dispatch' ||
          (
            github.event_name == 'pull_request' &&
            github.event.pull_request.state == 'open' &&
            github.event.pull_request.base.repo.full_name == 'duckduckgo/apple-browsers' &&
            github.event.pull_request.head.repo.full_name == 'duckduckgo/apple-browsers' &&
            github.event.pull_request.author_association == 'MEMBER' &&
            github.event.pull_request.user.type == 'User' &&
            (
              (github.event.action == 'labeled' && github.event.label.name == 'create-review-builds') ||
              (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'create-review-builds'))
            )
          )
        )
      }}

    runs-on: macos-26-xlarge
    name: Make ad-hoc build

    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true

    outputs:
      install-url: ${{ steps.generate-ota.outputs.install-url }}
      ipa-url: ${{ steps.upload-ipa-to-s3.outputs.ipa-url }}

    env:
      RUNS_ON: macos-26-xlarge # keep this in sync with runs-on above
      BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BUILD_TYPE: ${{ github.event.inputs.build-type || 'Alpha' }}

    steps:

      - name: Register SSH keys for private repos
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: |
            ${{ secrets.SSH_PRIVATE_KEY_FASTLANE_MATCH }}
            ${{ secrets.SSH_PRIVATE_KEY_DUCKSANS_FONT }}

      - name: Check out the code
        uses: actions/checkout@v6
        with:
          ref: ${{ env.BUILD_SHA }}
          submodules: recursive

      - name: Start measuring duration
        id: start-duration
        uses: ./.github/actions/measure-duration
        with:
          mode: start

      - name: Select Xcode
        uses: ./.github/actions/select-xcode-version
        with:
          xcode-version: ${{ env.BUILD_TYPE == 'Experimental' && '26.4' || '' }}

      - name: Add commit SHA to plist
        run: |
          echo "Setting DDG_COMMIT_SHA to ${BUILD_SHA}"

          plist_path="DuckDuckGo/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :DDG_COMMIT_SHA string ${BUILD_SHA}" "${plist_path}" \
            || /usr/libexec/PlistBuddy -c "Set :DDG_COMMIT_SHA ${BUILD_SHA}" "${plist_path}"

          experimental_plist_path="DuckDuckGo/Info-Experimental.plist"
          /usr/libexec/PlistBuddy -c "Add :DDG_COMMIT_SHA string ${BUILD_SHA}" "${experimental_plist_path}" \
            || /usr/libexec/PlistBuddy -c "Set :DDG_COMMIT_SHA ${BUILD_SHA}" "${experimental_plist_path}"

      - name: Setup Ruby and dependencies
        uses: ./.github/actions/setup-ruby
        with:
          working-directory: iOS
          cache-key-prefix: ios-ruby

      - name: Archive and upload the app
        id: archive-and-upload
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_ISSUER: ${{ secrets.APPLE_API_KEY_ISSUER }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: |
          app_version="$(cut -d ' ' -f 3 < Configuration/Version.xcconfig)"
          build_number="$(cut -d ' ' -f 3 < Configuration/BuildNumber.xcconfig)"
          echo "app_version=${app_version}" >> $GITHUB_ENV
          echo "build_number=${build_number}" >> $GITHUB_ENV

          lane_to_use="adhoc"
          if [[ "${BUILD_TYPE}" == "Release" ]]; then
            lane_to_use="release_adhoc"
          elif [[ "${BUILD_TYPE}" == "Experimental" ]]; then
            lane_to_use="experimental_adhoc"
          fi

          if [[ -n "${{ github.event.inputs.suffix }}" ]]; then
            bundle exec fastlane ${lane_to_use} suffix:${{ github.event.inputs.suffix }}
          else
            bundle exec fastlane ${lane_to_use}
          fi

      - name: Measure App Size
        if: steps.archive-and-upload.outcome == 'success'
        continue-on-error: true
        uses: ./.github/actions/measure-app-size
        with:
          report-file: "iOS/App Thinning Size Report.txt"
          download-size-pixel-name: "m_ci_apple_ios_adhoc_download_size"
          installation-size-pixel-name: "m_ci_apple_ios_adhoc_installation_size"
          app-version: ${{ env.app_version }}
          build-number: ${{ env.build_number }}
          suffix: ${{ github.event.inputs.suffix }}

      - name: Report job duration
        if: success() || (always() && steps.archive-and-upload.outcome == 'failure')
        continue-on-error: true
        uses: ./.github/actions/measure-duration
        with:
          mode: stop
          start-timestamp: ${{ steps.start-duration.outputs.start-timestamp }}

      - name: Set filenames
        run: |
          echo "ipa_filename=${{ env.output_name }}.ipa" >> $GITHUB_ENV
          echo "dsyms_filename=${{ env.output_name }}.app.dSYM.zip" >> $GITHUB_ENV

      - name: Set paths
        run: |
          echo "ipa_path=${{ github.workspace }}/iOS/${{ env.ipa_filename }}" >> $GITHUB_ENV
          echo "dsyms_path=${{ github.workspace }}/iOS/${{ env.dsyms_filename }}" >> $GITHUB_ENV

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.ipa_filename }}
          path: ${{ env.ipa_path }}

      - name: Upload dSYMs artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.dsyms_filename }}
          path: ${{ env.dsyms_path }}

      - name: Upload dSYMs to S3
        id: upload-dsyms-to-s3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID_RELEASE_S3 }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_RELEASE_S3 }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
          DSYM_LOCAL_PATH: "${{ env.dsyms_path }}"
          DSYM_NAME: ${{ env.dsyms_filename }}
          DSYM_URL_ROOT: ${{ vars.IPA_URL_ROOT }}
          RELEASE_BUCKET_NAME: ${{ vars.RELEASE_BUCKET_NAME }}
          RELEASE_BUCKET_PREFIX: ${{ vars.IOS_RELEASE_BUCKET_PREFIX }}
          REVIEW_BUILDS_BUCKET_PREFIX: ${{ vars.REVIEW_BUILDS_BUCKET_PREFIX }}
        run: |
          ref_sha="$(git rev-parse --short HEAD)"
          test_build_s3_path="s3://${RELEASE_BUCKET_NAME}/${RELEASE_BUCKET_PREFIX}/${REVIEW_BUILDS_BUCKET_PREFIX}/${ref_sha}/"
          dsym_s3_path="${test_build_s3_path}${DSYM_NAME}"
          echo "test-build-s3-path=${test_build_s3_path}" >> $GITHUB_OUTPUT

          # Calculate the URL for the dSYM to report it later
          s3_bucket_url="s3://${RELEASE_BUCKET_NAME}/${RELEASE_BUCKET_PREFIX}/"
          dsym_url="${dsym_s3_path/#${s3_bucket_url}/${DSYM_URL_ROOT}}" # replace S3 bucket url with CDN URL
          echo "dsym-url=${dsym_url}" >> $GITHUB_OUTPUT
          aws s3 cp $DSYM_LOCAL_PATH $dsym_s3_path --acl public-read
          echo "dsym-s3-path=${dsym_s3_path}" >> $GITHUB_OUTPUT

      - name: Upload IPA to S3
        id: upload-ipa-to-s3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID_RELEASE_S3 }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_RELEASE_S3 }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
          TEST_BUILD_S3_PATH: ${{ steps.upload-dsyms-to-s3.outputs.test-build-s3-path }}
          IPA_LOCAL_PATH: ${{ env.ipa_path }}
          IPA_NAME: ${{ env.ipa_filename }}
          IPA_URL_ROOT: ${{ vars.IPA_URL_ROOT }}
          RELEASE_BUCKET_NAME: ${{ vars.RELEASE_BUCKET_NAME }}
          RELEASE_BUCKET_PREFIX: ${{ vars.IOS_RELEASE_BUCKET_PREFIX }}
        run: |
          ipa_s3_path="${TEST_BUILD_S3_PATH}${IPA_NAME}"

          # Calculate the URL for the dSYM to report it later
          s3_bucket_url="s3://${RELEASE_BUCKET_NAME}/${RELEASE_BUCKET_PREFIX}/"
          ipa_url="${ipa_s3_path/#${s3_bucket_url}/${IPA_URL_ROOT}}" # replace S3 bucket url with CDN URL
          echo "ipa-url=${ipa_url}" >> $GITHUB_OUTPUT

          aws s3 cp $IPA_LOCAL_PATH $ipa_s3_path --acl public-read
          echo "ipa-s3-path=${ipa_s3_path}" >> $GITHUB_OUTPUT

      - name: Generate and upload OTA install manifest and page
        id: generate-ota
        continue-on-error: true
        uses: ./.github/actions/generate-ios-adhoc-ota-install
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_RELEASE_S3 }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_RELEASE_S3 }}
          aws-default-region: ${{ vars.AWS_DEFAULT_REGION }}
          build-type: ${{ env.BUILD_TYPE }}
          ipa-url: ${{ steps.upload-ipa-to-s3.outputs.ipa-url }}
          ipa-s3-path: ${{ steps.upload-ipa-to-s3.outputs.ipa-s3-path }}
          app-version: ${{ env.app_version }}
          build-number: ${{ env.build_number }}
          output-name: ${{ env.output_name }}

      - name: Report success
        env:
          ASANA_TASK_URL: ${{ github.event.inputs.asana-task-url }}
          IPA_URL: ${{ steps.upload-ipa-to-s3.outputs.ipa-url }}
          IPA_S3_PATH: ${{ steps.upload-ipa-to-s3.outputs.ipa-s3-path }}
          DSYM_URL: ${{ steps.upload-dsyms-to-s3.outputs.dsym-url }}
          DSYM_S3_PATH: ${{ steps.upload-dsyms-to-s3.outputs.dsym-s3-path }}
          INSTALL_URL: ${{ steps.generate-ota.outputs.install-url }}
          QR_URL: ${{ steps.generate-ota.outputs.qr-url }}
          TITLE: ${{ steps.generate-ota.outputs.title }}
          WORKFLOW_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ASANA_ACCESS_TOKEN: ${{ secrets.ASANA_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          echo "## Build Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          if [[ -n "${INSTALL_URL:-}" ]]; then
            echo "🔗 [Install on iPhone](${INSTALL_URL})" >> $GITHUB_STEP_SUMMARY
          else
            echo "> [!WARNING]" >> $GITHUB_STEP_SUMMARY
            echo "> OTA install page generation failed or did not produce a URL. Use the IPA link below." >> $GITHUB_STEP_SUMMARY
          fi
          echo "🔗 [${IPA_S3_PATH}](${IPA_URL})" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [${DSYM_S3_PATH}](${DSYM_URL})" >> $GITHUB_STEP_SUMMARY

          # QR comes last: a trailing raw-HTML <img> block can't absorb any
          # markdown after it, so the links above always render correctly.
          if [[ -n "${INSTALL_URL:-}" && -n "${QR_URL:-}" ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📸 Scan with your iPhone to open the install page in Safari:" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "<img src=\"${QR_URL}\" alt=\"Scan to install on iPhone\" width=\"240\">" >> $GITHUB_STEP_SUMMARY
          fi

          if [[ -z "$ASANA_TASK_URL" ]]; then
            exit 0
          fi

          bundle exec fastlane run asana_add_comment \
            task_url:"$ASANA_TASK_URL" \
            template_name:"ios-adhoc-build-available"

  notify-pr-author:
    name: Notify PR author in Mattermost
    needs: make-adhoc
    if: >-
      ${{
        always() &&
        github.event_name == 'pull_request' &&
        github.repository == 'duckduckgo/apple-browsers' &&
        github.event.pull_request.state == 'open' &&
        github.event.pull_request.base.repo.full_name == 'duckduckgo/apple-browsers' &&
        github.event.pull_request.head.repo.full_name == 'duckduckgo/apple-browsers' &&
        github.event.pull_request.author_association == 'MEMBER' &&
        github.event.pull_request.user.type == 'User' &&
        (needs.make-adhoc.result == 'success' || needs.make-adhoc.result == 'failure')
      }}

    runs-on: macos-26

    steps:
      - name: Check out notification dependencies
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: |
            .github
            .ruby-version
            iOS/Gemfile
            iOS/Gemfile.lock
            iOS/fastlane

      - name: Setup Ruby and dependencies
        uses: ./.github/actions/setup-ruby
        with:
          working-directory: iOS
          cache-key-prefix: ios-ruby

      - name: Send Mattermost message
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          COMMIT_URL: https://github.com/${{ github.repository }}/commit/${{ github.event.pull_request.head.sha }}
          INSTALL_URL: ${{ needs.make-adhoc.outputs.install-url }}
          IPA_URL: ${{ needs.make-adhoc.outputs.ipa-url }}
          WORKFLOW_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          MM_WEBHOOK_URL: ${{ secrets.MM_WEBHOOK_URL }}
          TEMPLATE_NAME: ${{ needs.make-adhoc.result == 'success' && 'ios-adhoc-build-complete' || 'ios-adhoc-build-failed' }}
        run: |
          bundle exec fastlane run mattermost_send_message \
            mattermost_webhook_url:"$MM_WEBHOOK_URL" \
            github_handle:"$PR_AUTHOR" \
            template_name:"$TEMPLATE_NAME"
