name: Smartling - Submit

# Submits one platform's strings to Smartling and authorizes the job up to a limit. Above it, the maintenance DRI
# gets a review task.
#   nightly: main, as "Nightly <platform> - <date>", called by smartling_nightly.yml. Fails the run on errors.
#   release: a release branch, as "Release <platform> <version>", called at code freeze, where nothing depends on it.
#            Errors are reported on the release task instead of failing code freeze.
# To test without authorizing anything, run it manually with auto_authorize_max_usd set to 0. For a release, use a
# test branch with a fake 0.x.y version.
on:
  workflow_call:
    inputs:
      kind:
        description: "nightly or release"
        required: true
        type: string
      platform:
        description: "Platform (iOS or macOS)"
        required: true
        type: string
      branch:
        description: "Release branch, e.g. release/ios/7.200.0 (release only)"
        required: false
        type: string
      version:
        description: "Release version, taken from a release/<platform>/<version> branch if empty (release only)"
        required: false
        type: string
      asana_task_url:
        description: "Release Asana task, commented on if the submission fails (release only)"
        required: false
        type: string
      auto_authorize_max_usd:
        description: "Authorize the job if its maximum USD estimate is at most this (0 never authorizes)"
        required: false
        type: string
        default: "500.00"
      dry_run:
        description: "Export and resolve the job name without writing to Smartling or Asana"
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      kind:
        description: "Kind"
        required: true
        type: choice
        default: release
        options:
          - release
          - nightly
      platform:
        description: "Platform"
        required: true
        type: choice
        options:
          - iOS
          - macOS
      branch:
        description: "Release branch, e.g. release/ios/7.200.0 (release only)"
        required: false
        type: string
      version:
        description: "Release version, taken from a release/<platform>/<version> branch if empty (release only)"
        required: false
        type: string
      asana_task_url:
        description: "Release Asana task, commented on if the submission fails (release only)"
        required: false
        type: string
      auto_authorize_max_usd:
        description: "Authorize the job if its maximum USD estimate is at most this (0 never authorizes)"
        type: string
        default: "500.00"
      dry_run:
        description: "Export and resolve the job name without writing to Smartling or Asana"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  smartling:
    name: ${{ inputs.platform }} ${{ inputs.kind }} translation job
    runs-on: [image:osx-tahoe-27, m4pro]
    timeout-minutes: 45
    # A failed release submission is reported on the release task instead of failing the code freeze run.
    continue-on-error: ${{ inputs.kind == 'release' }}
    # Runs for the same job wait for each other, so they can't both create it.
    concurrency:
      group: smartling-submit-${{ inputs.kind }}-${{ inputs.platform }}-${{ inputs.branch }}
      cancel-in-progress: false

    env:
      KIND: ${{ inputs.kind }}
      PLATFORM: ${{ inputs.platform }}
      AUTO_AUTHORIZE_MAX_USD: ${{ inputs.auto_authorize_max_usd || '500.00' }}

    steps:
      # The release import finds a release job by its exact name and downloads the files under the release branch,
      # so the release job name and file URI prefix are its contract. Don't change them without updating the import.
      - name: Resolve Smartling job
        id: job
        env:
          BRANCH: ${{ inputs.branch }}
          VERSION: ${{ inputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          platform_lowercase="$(echo "$PLATFORM" | tr '[:upper:]' '[:lower:]')"
          case "$KIND" in
            nightly)
              if [[ "${GITHUB_REF}" != "refs/heads/${DEFAULT_BRANCH}" ]]; then
                echo "Nightly Smartling writes are only allowed from ${DEFAULT_BRANCH}." >&2
                exit 1
              fi
              # Nothing is submitted while an earlier nightly job awaits authorization: its review task is still open.
              {
                echo "ref=${DEFAULT_BRANCH}"
                echo "job_name=Nightly $PLATFORM - $(date -u +%Y-%m-%d)"
                echo "pending_job_prefix=Nightly $PLATFORM - "
                echo "file_uri_prefix=${DEFAULT_BRANCH}"
              } >> "$GITHUB_OUTPUT"
              ;;
            release)
              # A release branch decides the version; any other branch (e.g. for testing) needs one passed in.
              if [[ "$BRANCH" =~ ^release/([^/]+)/([^/]+)$ ]]; then
                branch_platform="${BASH_REMATCH[1]}"
                branch_version="${BASH_REMATCH[2]}"
                if [[ "$branch_platform" != "$platform_lowercase" ]]; then
                  echo "Branch '$BRANCH' is a release branch for '$branch_platform', not '$platform_lowercase'." >&2
                  exit 1
                fi
                if [[ -n "$VERSION" && "$VERSION" != "$branch_version" ]]; then
                  echo "Version '$VERSION' doesn't match release branch '$BRANCH'." >&2
                  exit 1
                fi
                VERSION="$branch_version"
              fi
              if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "Can't resolve a release version from version '$VERSION' and branch '$BRANCH'." >&2
                exit 1
              fi
              # No pending-job prefix: only a job with exactly this name stops a new one, so a rerun of code freeze
              # finds this release's own job in any state, while other releases' jobs are ignored.
              {
                echo "ref=$BRANCH"
                echo "job_name=Release $PLATFORM $VERSION"
                echo "pending_job_prefix="
                echo "file_uri_prefix=$BRANCH"
              } >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unknown kind: $KIND" >&2
              exit 1
              ;;
          esac

      - name: Register SSH keys for private repos
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY_DUCKSANS_FONT }}

      - name: Check out ${{ steps.job.outputs.ref }}
        id: checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.job.outputs.ref }}
          submodules: recursive

      - name: Resolve platform configuration
        run: |
          case "$PLATFORM" in
            iOS)
              {
                echo "SMARTLING_USER_ID=${{ secrets.IOS_SMARTLING_USER_ID }}"
                echo "SMARTLING_USER_SECRET=${{ secrets.IOS_SMARTLING_USER_SECRET }}"
                echo "SMARTLING_PROJECT_ID=${{ vars.IOS_SMARTLING_PROJECT_ID }}"
                echo "ASANA_PROJECT_ID=${{ vars.GH_ASANA_IOS_APP_PROJECT_ID }}"
                echo "ASANA_INCOMING_SECTION_NAME=Incoming"
                echo "ASANA_TRIAGE_ROTATION_SECTION_ID=1210869535563575"
                echo "REVIEW_TASK_GITHUB_ASSIGNEE=pballart"
              } >> "$GITHUB_ENV"
              ;;
            macOS)
              {
                echo "SMARTLING_USER_ID=${{ secrets.MACOS_SMARTLING_USER_ID }}"
                echo "SMARTLING_USER_SECRET=${{ secrets.MACOS_SMARTLING_USER_SECRET }}"
                echo "SMARTLING_PROJECT_ID=${{ vars.MACOS_SMARTLING_PROJECT_ID }}"
                echo "ASANA_PROJECT_ID=${{ vars.MACOS_APP_DEVELOPMENT_ASANA_PROJECT_ID }}"
                echo "ASANA_INCOMING_SECTION_NAME=Incoming: Dev Related Issues"
                echo "ASANA_TRIAGE_ROTATION_SECTION_ID=1210871971126998"
                echo "REVIEW_TASK_GITHUB_ASSIGNEE=andremartingo"
              } >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unknown platform: $PLATFORM" >&2
              exit 1
              ;;
          esac

      - name: Select Xcode
        uses: ./.github/actions/select-xcode-version

      - name: Set up Python
        if: runner.environment != 'self-hosted'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install aiohttp

      - name: Install xmlstarlet
        if: inputs.platform == 'macOS'
        run: brew install xmlstarlet

      - name: Export localizations
        run: |
          set -e -o pipefail
          "./$PLATFORM/scripts/loc_export.sh" | xcbeautify

      # A release job left half-submitted by a failure is deleted, so that a rerun starts over instead of finding it.
      # A nightly one is kept for the review task, and the next night creates a new job anyway.
      - name: Submit ${{ inputs.platform }} strings to Smartling
        id: submit
        if: ${{ !inputs.dry_run }}
        env:
          JOB_NAME: ${{ steps.job.outputs.job_name }}
          PENDING_JOB_PREFIX: ${{ steps.job.outputs.pending_job_prefix }}
          FILE_URI_PREFIX: ${{ steps.job.outputs.file_uri_prefix }}
        run: |
          kind_args=()
          [ -z "$PENDING_JOB_PREFIX" ] || kind_args+=(--pending-job-prefix "$PENDING_JOB_PREFIX")
          [ "$KIND" != release ] || kind_args+=(--delete-job-on-failure)
          ./scripts/smartling/smartling_submit.sh "$PLATFORM" \
            --job-name "$JOB_NAME" \
            --file-uri-prefix "$FILE_URI_PREFIX" \
            --auto-authorize-max-usd "$AUTO_AUTHORIZE_MAX_USD" \
            "${kind_args[@]}"

      - name: Print dry run result
        if: inputs.dry_run
        env:
          JOB_NAME: ${{ steps.job.outputs.job_name }}
          FILE_URI_PREFIX: ${{ steps.job.outputs.file_uri_prefix }}
        run: |
          echo "Dry run: would submit '$JOB_NAME' with files under $FILE_URI_PREFIX/, authorized up to \$$AUTO_AUTHORIZE_MAX_USD." \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # A job over the limit gets a review task. So does any nightly failure; release failures go to the release task.
      - name: Decide on a review task
        id: review
        if: >-
          always() && !cancelled() && !inputs.dry_run && steps.job.outcome == 'success' &&
          (steps.submit.outputs.outcome == 'review_required' || failure())
        env:
          FAILED: ${{ job.status == 'failure' || steps.submit.outputs.failed == 'true' }}
        run: |
          if [[ "$KIND" == nightly || "$FAILED" != true ]]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      # For now the review task goes to a fixed person per platform while the automation beds in.
      # Remove this step and --assignee below to assign the platform's triage DRI instead.
      - name: Resolve ${{ inputs.platform }} review task assignee
        id: review-assignee
        if: ${{ !cancelled() && steps.review.outputs.needed == 'true' }}
        continue-on-error: true  # Fall back to the triage DRI if the lookup fails.
        uses: duckduckgo/native-github-asana-sync@v2.5.1
        with:
          action: get-asana-user-id
          github-username: ${{ env.REVIEW_TASK_GITHUB_ASSIGNEE }}
          github-pat: ${{ secrets.APPLE_GH_RO_PAT }}

      # Due today in the app project's incoming section (named differently per project), assigned to the platform's triage DRI
      # from the Asana triage rotation (on weekends, the next week's DRI), unless an assignee was resolved above.
      - name: Open ${{ inputs.platform }} Smartling review task
        if: ${{ !cancelled() && steps.review.outputs.needed == 'true' }}
        env:
          ASANA_ACCESS_TOKEN: ${{ secrets.ASANA_ACCESS_TOKEN }}
          ASSIGNEE: ${{ steps.review-assignee.outputs.asanaUserId }}
          TASK_NAME: "Smartling job needs review: ${{ steps.submit.outputs.job_name || format('{0} (no job created)', steps.job.outputs.job_name) }}"
          TASK_NOTES: |
            🌍 The ${{ inputs.platform }} ${{ inputs.kind }} Smartling job could not be automatically authorized.${{ inputs.kind == 'release' && ' The release''s translations are imported once it''s authorized and completed.' || '' }}

            🔗 Job: ${{ steps.submit.outputs.job_id && format('https://dashboard.smartling.com/app/projects/{0}/account-jobs/{0}:{1}', env.SMARTLING_PROJECT_ID, steps.submit.outputs.job_id) || 'no job was created' }}
            💵 Maximum USD estimate / limit: ${{ steps.submit.outputs.max_usd && format('${0}', steps.submit.outputs.max_usd) || 'unavailable' }} / $${{ env.AUTO_AUTHORIZE_MAX_USD }}
            📝 String translations: ${{ steps.submit.outputs.total_strings && format('{0} across {1} locales', steps.submit.outputs.total_strings, steps.submit.outputs.locales) || 'unavailable' }}
            ✋ Reason: ${{ steps.submit.outputs.reason || 'Localization export or Smartling submission failed' }}
            🌿 Branch: ${{ steps.job.outputs.ref }}
            🔖 Commit: ${{ steps.checkout.outputs.commit || 'unavailable' }}
            ⚙️ Workflow: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          assignee_args=()
          [ -z "$ASSIGNEE" ] || assignee_args=(--assignee "$ASSIGNEE")
          python3 ./scripts/smartling/asana_review_task.py \
            --project "$ASANA_PROJECT_ID" \
            --section-name "$ASANA_INCOMING_SECTION_NAME" \
            --rotation-section "$ASANA_TRIAGE_ROTATION_SECTION_ID" \
            --name "$TASK_NAME" \
            --notes "$TASK_NOTES" \
            "${assignee_args[@]}"

      - name: Resolve release task ID
        id: release-task
        if: >-
          always() && !cancelled() && !inputs.dry_run && inputs.kind == 'release' && inputs.asana_task_url != '' &&
          (failure() || steps.submit.outputs.failed == 'true')
        env:
          ASANA_TASK_URL: ${{ inputs.asana_task_url }}
        run: |
          task_id="$(echo "$ASANA_TASK_URL" | grep -oE '[0-9]+' | tail -1)"
          echo "task_id=$task_id" >> "$GITHUB_OUTPUT"

      - name: Comment on the release task
        # Without a status check, GitHub would add success() and skip this after a failed step.
        if: ${{ !cancelled() && steps.release-task.outputs.task_id != '' }}
        uses: duckduckgo/native-github-asana-sync@v2.5.1
        with:
          action: post-comment-asana-task
          asana-pat: ${{ secrets.ASANA_ACCESS_TOKEN }}
          asana-task-id: ${{ steps.release-task.outputs.task_id }}
          asana-task-comment-pinned: false
          asana-task-comment-is-html: false
          asana-task-comment: |
            ⚠️ Submitting ${{ inputs.branch }} to Smartling failed, so this release's translations won't be imported automatically.

            ✋ Reason: ${{ steps.submit.outputs.failed == 'true' && steps.submit.outputs.reason || 'The localization export, Smartling submission or review task failed. See the workflow logs.' }}
            ⚙️ Workflow: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            🔁 To retry, run the "Smartling - Submit" workflow with kind release, platform ${{ inputs.platform }} and branch ${{ inputs.branch }}.

      # The submit script exits successfully even when Smartling fails, so the nightly run fails here, after the
      # review task is open. Release runs report on the release task instead.
      - name: Fail the nightly run if the submission failed
        if: ${{ !cancelled() && inputs.kind == 'nightly' && steps.submit.outputs.failed == 'true' }}
        env:
          REASON: ${{ steps.submit.outputs.reason }}
        run: |
          echo "::error::Smartling submission failed: $REASON"
          exit 1
