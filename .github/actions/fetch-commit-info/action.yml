name: 'Fetch Commit Info'
description: 'Fetches commit author and PR reviewers information from GitHub API'

inputs:
  github-token:
    description: 'GitHub token for API access'
    required: true
    default: ${{ github.token }}

outputs:
  commit_author:
    description: 'GitHub handle of the person responsible for the commit (empty if only a bot is found)'
    value: ${{ steps.fetch_info.outputs.commit_author }}
  pr_reviewers:
    description: 'Comma-separated list of all PR reviewers (empty if not a PR merge)'
    value: ${{ steps.fetch_info.outputs.pr_reviewers }}

runs:
  using: "composite"
  steps:
    - name: Fetch commit author and PR reviewers
      id: fetch_info
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        head_commit=$(git rev-parse HEAD)
        author=""
        commit_message=""

        if [[ -f "${GITHUB_EVENT_PATH:-}" ]]; then
          event_head_commit=$(jq -r '.head_commit.id // .after // ""' "$GITHUB_EVENT_PATH")
          if [[ "$event_head_commit" == "$head_commit" ]]; then
            author=$(jq -r '.head_commit.author.username // .head_commit.committer.username // ""' "$GITHUB_EVENT_PATH")
            commit_message=$(jq -r '.head_commit.message // ""' "$GITHUB_EVENT_PATH")
          fi
        fi

        if [[ -z "$commit_message" ]]; then
          commit_message=$(git log -1 --format=%B "$head_commit")
        fi

        if [[ -z "$author" ]]; then
          author=$(gh api "https://api.github.com/repos/${{ github.repository }}/commits/${head_commit}" --jq '.author.login // ""' || true)
        fi

        # GitHub puts the PR number at the start of a merge subject or the end of a squash subject.
        subject=${commit_message%%$'\n'*}
        pr_number=""
        if [[ "$subject" =~ ^"Merge pull request #"([0-9]+)([[:space:]]|$) ]]; then
          pr_number=${BASH_REMATCH[1]}
        elif [[ "$subject" =~ [[:space:]]\(#([0-9]+)\)$ ]]; then
          pr_number=${BASH_REMATCH[1]}
        fi

        # Bot-authored commits (e.g. PRs opened by an agent) have no Asana user.
        # Attribute them to the person who merged the PR instead.
        if [[ "$author" == *"[bot]" && -n "$pr_number" ]]; then
          merged_by=$(gh api "https://api.github.com/repos/${{ github.repository }}/pulls/${pr_number}" --jq '.merged_by.login // ""' || true)
          echo "Commit author ${author} is a bot, using PR #${pr_number} merger '${merged_by}' instead"
          author="$merged_by"
        fi
        if [[ "$author" == *"[bot]" ]]; then
          echo "Commit author ${author} is a bot with no human to attribute, leaving it empty"
          author=""
        fi

        echo "commit_author=${author}" >> "$GITHUB_OUTPUT"

        if [[ -n "$pr_number" ]]; then
          echo "Found PR merge: #${pr_number}"

          # Get all PR reviewers who approved (unique reviewers only)
          reviewers=$(gh api "https://api.github.com/repos/${{ github.repository }}/pulls/${pr_number}/reviews" \
            --jq '[.[] | select(.state == "APPROVED") | .user.login] | unique | join(",")' || true)

          if [[ -n "$reviewers" && "$reviewers" != "null" ]]; then
            echo "PR reviewers found: ${reviewers}"
            echo "pr_reviewers=${reviewers}" >> "$GITHUB_OUTPUT"
          else
            echo "No reviewers found for PR #${pr_number}"
            echo "pr_reviewers=" >> "$GITHUB_OUTPUT"
          fi
        else
          echo "Not a PR merge"
          echo "pr_reviewers=" >> "$GITHUB_OUTPUT"
        fi
