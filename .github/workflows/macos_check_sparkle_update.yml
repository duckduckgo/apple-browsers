name: macOS - Check Sparkle Update

on:
  push:
    branches: [diego/update-wireguard-automation]  # TEMP: remove before merge
  schedule:
    - cron: '0 1 * * 5'  # Every Friday at 01:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-update:
    uses: ./.github/workflows/shared_dependency_update.yml
    with:
      dependency-slug: sparkle
      display-name: Sparkle
      repo: sparkle-project/Sparkle
      pin-kind: package-swift
      pin-files: macOS/LocalPackages/AppUpdater/Package.swift
      lockfiles: macOS/DuckDuckGo-macOS.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
      resolve-targets: |
        -workspace|DuckDuckGo.xcworkspace|macOS Browser
        -project|macOS/DuckDuckGo-macOS.xcodeproj|macOS Browser
      # Feature owners (GitHub handles, space-separated). Used for PR reviewers and Asana assignee.
      owners: diegoreymendez jotaemepereira
      asana-parent-task-id: "1212461351428211"
      labels: dependencies,macOS
    secrets:
      SSH_PRIVATE_KEY_DUCKSANS_FONT: ${{ secrets.SSH_PRIVATE_KEY_DUCKSANS_FONT }}
      ASANA_ACCESS_TOKEN: ${{ secrets.ASANA_ACCESS_TOKEN }}
