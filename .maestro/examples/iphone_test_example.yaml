appId: com.duckduckgo.mobile.ios
tags:
    - iphone
    - example

---

# This test will run on iPhone simulator because it has the 'iphone' tag

# Set up 
- runFlow: 
    file: ../shared/setup.yaml

# First, verify we're running on iPhone by checking browser info
- assertVisible:
    id: searchEntry
- tapOn: 
    id: searchEntry
    
# Use a data URI to display user agent directly
- inputText: "data:text/html,<h1>User Agent:</h1><p style='font-size:20px'>%3Cscript%3Edocument.write(navigator.userAgent)%3C/script%3E</p>"
- pressKey: Enter

# Wait for the page to render and verify iPhone is detected (not iPad)
- waitForAnimationToEnd
- assertVisible: "iPhone"
- assertNotVisible: "iPad"

# Navigate back to search
- tapOn:
    id: searchEntry

- pressKey: Backspace
    
# Now run a normal search to verify iPhone-specific layout
- inputText: "remote iOS developer jobs"
- pressKey: Enter

- assertVisible: ".*" # This will match any visible element