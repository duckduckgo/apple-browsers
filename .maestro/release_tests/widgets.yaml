# widgets.yaml
appId: com.duckduckgo.mobile.ios

tags:
    - release

---

# Set up 
- runFlow: 
    file: ../shared/setup.yaml

# Load a website
- assertVisible:
    id: "searchEntry"
- tapOn: 
    id: "searchEntry"
- inputText: "https://privacy-test-pages.site/"
- pressKey: Enter

- assertVisible: ".*Privacy Test Pages.*"

# Prepare to add widgets
- pressKey: HOME

# Swipe to first page to get from the app (removing the app from home screen doesn't work)
- swipe:  
    start: 5%, 70%
    end: 95%, 70%

# Validate search widget
- longPressOn:
    point: 50%,50%

# iOS 18 now has an edit button first
- tapOn: "Edit"
- tapOn: "Add Widget"
- tapOn: "Search Widgets"
- inputText: "DuckDuckGo"
- tapOn: 
    point: 30%,30%
- tapOn: " Add Widget"
- tapOn: "Done"
- tapOn:
    point: 27%,14%
- extendedWaitUntil:
    visible:
      id: "searchEntry"
    timeout: 10000
- tapOn:
    id: "searchEntry"
- inputText: "example.com"
- pressKey: Enter
- assertVisible: "Example Domain"
- assertVisible: "Tab Switcher"
- tapOn: "Tab Switcher"
- assertVisible: "Open \"Privacy Test Pages - Home\" at privacy-test-pages.site"

# Validate favorites widget
- pressKey: HOME
- longPressOn:
    point: 50%,50%
- tapOn: "Edit"
- tapOn: "Add Widget"
- tapOn: "Search Widgets"
- inputText: "DuckDuckGo"
- tapOn:
    point: 30%,30%
- assertVisible: "Custom Shortcuts"
- swipe:
    start: 90%, 50%
    end: 10%, 50%
- assertVisible: "Custom Shortcuts"
- swipe:
    start: 90%, 50%
    end: 10%, 50%
- assertVisible: "Search and Favorites"
- swipe:
    start: 90%, 50%
    end: 10%, 50%
- assertVisible: "Search and Favorites"
- swipe:
    start: 90%, 50%
    end: 10%, 50%
- assertVisible: "Search Passwords"
- swipe:
    start: 90%, 50%
    end: 10%, 50%
- assertVisible: "VPN"
- swipe:
    start: 90%, 50%
    end: 10%, 50%
- assertVisible: "Quickly launch a private search in DuckDuckGo."

# Add the Search and Favorites widget
- swipe:
    start: 10%, 50%
    end: 90%, 50%
- swipe:
    start: 10%, 50%
    end: 90%, 50%
- swipe:
    start: 10%, 50%
    end: 90%, 50%
- swipe:
    start: 10%, 50%
    end: 90%, 50%
- assertVisible: "Search or visit your favorite sites privately with just one tap."
- tapOn: " Add Widget"
- tapOn: "Done"
- assertVisible: "Add Favorites"

# Save a favorite in the app
- launchApp:
    appId: "com.duckduckgo.mobile.ios"
- extendedWaitUntil:
    visible:
      id: "searchEntry"
    timeout: 10000
- tapOn:
    id: "searchEntry"
- inputText: "https://privacy-test-pages.site/"
- pressKey: Enter
- assertVisible: ".*Privacy Test Pages.*"
- tapOn: "Browsing menu"
- tapOn: "Add Favorite"

# Check the widget shows the new favorite
- pressKey: HOME
- swipe:
    start: 5%, 70%
    end: 95%, 70%
- extendedWaitUntil:
    visible: "Privacy Test Pages - Home"
    timeout: 10000
- assertNotVisible: "Add Favorites"
