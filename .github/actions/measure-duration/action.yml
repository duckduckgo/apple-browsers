name: 'Measure Duration'
description: 'Measure job duration with start and stop modes'
inputs:
  mode:
    description: 'Mode: start or stop'
    required: true
  start-timestamp:
    description: 'Start timestamp (required for stop mode)'
    required: false
  pixel-name:
    description: 'Pixel name to send duration data (required for stop mode)'
    required: false
  pixel-params:
    description: 'Additional query parameters as YAML key-value pairs'
    required: false
  scope:
    description: 'Use workflow when the start and stop steps run in different jobs'
    default: job
    required: false
outputs:
  start-timestamp:
    description: 'Start timestamp (returned in start mode)'
    value: ${{ steps.start.outputs.timestamp }}
  duration:
    description: 'Duration in seconds (returned in stop mode)'
    value: ${{ steps.stop.outputs.duration }}
runs:
  using: 'composite'
  steps:
    - name: Start measuring
      id: start
      if: inputs.mode == 'start'
      shell: bash
      run: |
        START_TIME=$(date +%s)
        echo "timestamp=${START_TIME}" >> $GITHUB_OUTPUT

    - name: Stop measuring and report duration
      id: stop
      if: inputs.mode == 'stop'
      shell: bash
      run: |
        END_TIME=$(date +%s)
        DURATION=$((END_TIME - ${{ inputs.start-timestamp }}))
        echo "duration=${DURATION}" >> $GITHUB_OUTPUT
        echo "::notice::Duration measured: ${DURATION} seconds"

    - name: Send duration pixel
      if: inputs.mode == 'stop' && inputs.pixel-name != ''
      uses: ./.github/actions/send-pixel
      with:
        pixel-name: ${{ inputs.pixel-name }}
        query-params: |
          seconds: ${{ steps.stop.outputs.duration }}
          ${{ inputs.pixel-params }}

    - name: Read runner queue time
      id: queue
      if: >-
        inputs.mode == 'stop' && inputs.scope == 'job' &&
        startsWith(inputs.pixel-name, 'm_ci_apple_duration_') &&
        github.event_name == 'pull_request' && github.repository == 'duckduckgo/apple-browsers'
      continue-on-error: true
      uses: actions/github-script@v8
      env:
        CHECK_RUN_ID: ${{ job.check_run_id }}
        DURATION_PIXEL: ${{ inputs.pixel-name }}
      with:
        script: |
          const { data: job } = await github.rest.actions.getJobForWorkflowRun({
            ...context.repo,
            job_id: Number(process.env.CHECK_RUN_ID)
          });
          const seconds = (Date.parse(job.started_at) - Date.parse(job.created_at)) / 1000;
          if (!Number.isFinite(seconds) || seconds < 0) {
            core.warning(`Invalid queue timestamps for job ${job.id}`);
            return;
          }
          const pool = job.labels.filter(label => !label.startsWith('image:'));
          core.setOutput('params', {
            seconds,
            job: job.name,
            job_id: job.id,
            runner: job.labels.join(','),
            runner_pool: (pool.length ? pool : job.labels).join(',')
          });
          core.setOutput('pixel', process.env.DURATION_PIXEL.replace(/^m_ci_apple_duration_/, 'm_ci_apple_queue_time_'));

    - name: Send runner queue time pixel
      if: steps.queue.outputs.pixel != ''
      continue-on-error: true
      uses: ./.github/actions/send-pixel
      with:
        pixel-name: ${{ steps.queue.outputs.pixel }}
        query-params: ${{ steps.queue.outputs.params }}
