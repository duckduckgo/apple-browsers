appId: com.duckduckgo.mobile.ios
---

# Load constants
- runFlow:
    file: constants.yaml

- assertVisible:
    id: ${output.searchEntryId}
- tapOn: 
    id: ${output.searchEntryId}
- inputText: ${output.youtubeSearchUrl}
- pressKey: Enter

- waitForAnimationToEnd

# Refresh the page to ensure the cookies are handled
- tapOn: Refresh page

- waitForAnimationToEnd

# YouTube's ranking for the title changes, so the video isn't always the first result
- scrollUntilVisible:
    element:
      text: ${output.videoTitle}.*
    direction: DOWN
    timeout: 30000
    centerElement: true
