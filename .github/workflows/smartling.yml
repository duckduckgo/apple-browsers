name: Smartling

on:
  # push:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform"
        type: choice
        required: true
        default: 'iOS'
        options:
           - iOS
          #  - macOS
      action:
        description: "Action"
        type: choice
        required: true
        default: 'upload'
        options:
           - upload
           - approve
           - status
           - download
      job-id:
        description: "Smartling job ID"
        required: false
        type: string
      force:
        description: "Force import even if it causes deletions"
        required: false
        type: boolean
        default: false

jobs:
  smartling:
    runs-on: macos-15-xlarge
    name: Smartling translation job

    env:
      RUNS_ON: macos-15-xlarge # keep this in sync with runs-on above
      IOS_SMARTLING_USER_ID: ${{ secrets.IOS_SMARTLING_USER_ID }}
      IOS_SMARTLING_USER_SECRET: ${{ secrets.IOS_SMARTLING_USER_SECRET }}
      IOS_SMARTLING_PROJECT_ID: ${{ vars.IOS_SMARTLING_PROJECT_ID }}

    steps:

      - name: Register SSH keys for access to certificates
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY_FASTLANE_MATCH }}

      - name: Check out the code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        uses: ./.github/actions/select-xcode-version

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install aiohttp

      - name: Export
        id: export
        if: ${{ github.event.inputs.action == 'upload' }}
        run: |
          ./iOS/scripts/loc_export.sh

      - name: Upload to Smartling
        if: ${{ github.event.inputs.action == 'upload' }}
        run: |
          # Use the current git branch name for the job
          JOB_NAME="${{ github.ref_name }}"

          # Upload XLIFF and stringsdict files
          ./scripts/loc_tool.sh upload \
            --job-name "$JOB_NAME" \
            --files ./iOS/scripts/assets/loc/en.xcloc/Localized\ Contents/en.xliff \
                    ./iOS/DuckDuckGo/en.lproj/Localizable.stringsdict

      - name: Check Status
        if: ${{ github.event.inputs.action == 'status' }}
        run: |
          ./scripts/loc_tool.sh status --job-id "${{ github.event.inputs.job-id }}"

      - name: Approve Job
        if: ${{ github.event.inputs.action == 'approve' }}
        run: |
          ./scripts/loc_tool.sh approve --job-id "${{ github.event.inputs.job-id }}"

      - name: Download from Smartling
        if: ${{ github.event.inputs.action == 'download' }}
        run: |
          # Create temporary download directory
          DOWNLOAD_DIR="$(mktemp -d)/smartling_downloads"
          mkdir -p "$DOWNLOAD_DIR"

          # Download translated files
          ./scripts/loc_tool.sh download --job-id "${{ github.event.inputs.job-id }}" --out-dir "$DOWNLOAD_DIR"

          # Reorganize files into locale folders as expected by loc_import.sh
          # Files are downloaded as: name_locale.extension
          # Need to reorganize as: locale/name.extension

          IMPORT_DIR="$(mktemp -d)/smartling_import"
          mkdir -p "$IMPORT_DIR"

          echo "Reorganizing downloaded files into locale folders..."

          for file in "$DOWNLOAD_DIR"/*; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")

              # Extract locale from filename (format: name_locale.extension)
              if [[ "$filename" =~ ^(.+)_([a-z]{2}(-[A-Z]{2})?)\.(.+)$ ]]; then
                base_name="${BASH_REMATCH[1]}"
                locale="${BASH_REMATCH[2]}"
                extension="${BASH_REMATCH[4]}"

                # Create locale directory
                mkdir -p "$IMPORT_DIR/$locale"

                # Copy file with original name (without locale suffix)
                cp "$file" "$IMPORT_DIR/$locale/${base_name}.${extension}"
                echo "  Moved $filename -> $locale/${base_name}.${extension}"
              fi
            fi
          done

          # Import XLIFF files first
          echo "Importing XLIFF files..."
          if ls "$IMPORT_DIR"/*/*.xliff >/dev/null 2>&1; then
            # Determine the base name from the first xliff file found
            XLIFF_BASE=""
            for xliff in "$IMPORT_DIR"/*/*.xliff; do
              if [ -f "$xliff" ]; then
                XLIFF_BASE=$(basename "$xliff" .xliff)
                echo "Found XLIFF with base name: $XLIFF_BASE"
                break
              fi
            done

            if [ -n "$XLIFF_BASE" ]; then
              ./iOS/scripts/loc_import.sh "$IMPORT_DIR" "$XLIFF_BASE"
            fi
          else
            echo "No XLIFF files found to import"
          fi

          # Import stringsdict files if present
          echo "Checking for stringsdict files..."
          if ls "$IMPORT_DIR"/*/Localizable.stringsdict >/dev/null 2>&1; then
            echo "Importing stringsdict files..."
            ./iOS/scripts/loc_import.sh "$IMPORT_DIR" "Localizable"
          fi

          # Cleanup
          rm -rf "$DOWNLOAD_DIR" "$IMPORT_DIR"

          # Check for deleted translation keys
          echo "Checking for deleted translation keys..."

          # Look for deleted lines in .strings files (lines that start with -)
          DELETED_KEYS=$(git diff --no-index --no-prefix --unified=0 -- '*.strings' 2>/dev/null | grep '^-"' | wc -l || echo "0")

          # Also check using git status to see overall changes
          DELETED_LINES=$(git diff -- '*.strings' '*.stringsdict' | grep '^-[^-]' | grep -v '^---' | wc -l)

          if [ "$DELETED_LINES" -gt 0 ]; then
            echo "⚠️ Detected $DELETED_LINES deleted lines in translation files"

            # Show a sample of what was deleted
            echo "Sample of deleted content:"
            git diff -- '*.strings' | grep '^-"' | head -10

            if [ "${{ github.event.inputs.force }}" != "true" ]; then
              echo ""
              echo "❌ ERROR: Import would delete existing translations"
              echo ""
              echo "This usually happens when:"
              echo "1. Main was merged into the branch after translation started"
              echo "2. Some features were removed"
              echo ""
              echo "Options:"
              echo "• If deletions are expected: Run with force=true parameter"
              echo "• If unexpected: Merge main and run 'upload' action to create a new translation job"
              echo ""

              # Revert all changes
              git checkout -- .
              exit 1
            else
              echo "⚠️ Proceeding with deletions because force=true was set"
            fi
          else
            echo "✅ No translation keys deleted"
          fi

          # Commit the imported translations
          echo "Committing imported translations..."

          # Check if there are any changes to commit
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit"
          else
            # Configure Git identity for the commit
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            # Add all changes
            git add -A

            # Create commit message
            git commit -m "Import translations from Smartling job ${{ github.event.inputs.job-id }}"

            echo "✅ Translations committed successfully"

            # Push the commit to the current branch
            git push origin HEAD:${{ github.ref_name }}
            echo "✅ Changes pushed to branch ${{ github.ref_name }}"
          fi
