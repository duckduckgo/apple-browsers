<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; frame-src 'self'; form-action 'none'; connect-src 'none'">
<title>Spokeo opt-out — Local demo</title><style>
body { margin:0; color:#253746; background:#f3f5f7; font:16px system-ui; }
header { background:#182c45; color:white; padding:24px max(28px,calc((100% - 1000px)/2)); font-weight:700; font-size:22px; }
main { background:white; max-width:680px; margin:48px auto; padding:36px; border:1px solid #d5dce3; border-radius:8px; }
h1 { font-size:28px; margin-top:0; } p { line-height:1.6; } label { display:block; font-weight:600; margin:22px 0; }
input { display:block; box-sizing:border-box; width:100%; padding:13px; margin-top:8px; font:inherit; border:1px solid #8999a7; border-radius:4px; }
button { background:#db6b13; color:white; padding:14px 26px; border:0; border-radius:5px; font:600 17px system-ui; cursor:pointer; }
button:disabled { opacity:.45; cursor:default; } iframe { border:1px solid #d5dce3; width:320px; height:65px; }
footer { max-width:680px; margin:24px auto; color:#5d6974; font-size:13px; } [role=listitem] { padding:20px; border:1px solid #ddd; margin:16px 0; }
</style></head><body><header>Spokeo · Privacy Center</header><main><h1>Remove a public listing</h1><p>Enter the URL of the listing you want removed and an email address for confirmation.</p>
<form class="optout_container" data-verification="complete">
<label>Listing URL<input type="url" name="url" required value="https://profiles.example.invalid/avery-example-001"></label><label>Email address<input type="email" name="email" autocomplete="email" required value="removal-test@example.invalid"></label><div id="g-recaptcha"><iframe title="Verification widget" srcdoc="&lt;p&gt;Verification complete (local simulation)&lt;/p&gt;"></iframe></div>
<p role="status">Verification complete.</p>
<button class="responsive-button" type="submit" >Remove this listing</button>
</form><p>Removal requests must be confirmed by email.</p></main><footer>Local Spokeo-style demo · Fictional records · No external requests</footer>
<script>
const form = document.querySelector('form');
if (form) {
  const update = () => { form.querySelector('button').disabled = form.dataset.verification !== 'complete' || !form.checkValidity(); };
  form.addEventListener('input', update);
  form.addEventListener('submit', event => {
    event.preventDefault();
    if (form.querySelector('button').disabled || !form.checkValidity()) return;
    document.querySelector('main').innerHTML = '<h1>Check your email</h1><p role="status">Please check your inbox for a confirmation email</p><p>Your listing has not yet been removed. This local replay sends no email.</p>';
  });
  update();
}
</script></body></html>
