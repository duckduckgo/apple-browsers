name: 'Send Pixel'
description: 'Send a pixel tracking request'
inputs:
  pixel-name:
    description: 'Name of the pixel to send'
    required: true
  query-params:
    description: 'Query parameters as YAML key-value pairs'
    required: false
    default: '{}'
runs:
  using: 'composite'
  steps:
    - name: Send pixel request
      shell: bash
      run: |
        PIXEL_URL="${{ vars.PIXEL_BASE_URL }}${{ inputs.pixel-name }}"

        # Parse YAML query params using yq and build query string
        if [[ "${{ inputs.query-params }}" != "{}" && -n "${{ inputs.query-params }}" ]]; then
          QUERY_STRING=$(yq -r 'to_entries | map("\(.key)=\(.value | @uri)") | join("&")' <<< '${{ inputs.query-params }}')

          # Only add query string if yq produced valid output
          if [[ -n "${QUERY_STRING}" && "${QUERY_STRING}" != "null" ]]; then
            PIXEL_URL="${PIXEL_URL}?${QUERY_STRING}"
          fi
        fi

        echo "::notice::Sending pixel to: ${PIXEL_URL}"
        curl -fLSs -o /dev/null "${PIXEL_URL}"