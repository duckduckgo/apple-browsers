appId: com.duckduckgo.mobile.ios
tags:
    - iphone
    - sync
name: 00_setup

---

# Set up 
- runFlow: 
    file: ../shared/setup.yaml

- pressKey: HOME

- swipe:
    direction: DOWN

- inputText: Settings
- pressKey: ENTER

- tapOn: General
- tapOn: Keyboard

- scrollUntilVisible:
    element: Dictation

- tapOn: Enable Dictation

- runFlow:
    when:
      visible: Enable Dictation
    commands:
        - tapOn: Cancel

- runFlow:
    when:
      visible: Turn Off Dictation
    commands:
        - tapOn: Turn Off Dictation
