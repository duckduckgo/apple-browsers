name: iOS - UI Tests

permissions:
  contents: read

defaults:
  run:
    working-directory: iOS

env:
  IOS_VERSION: "26.5"
  IPHONE_DEVICE_NAME: "iPhone 17"
  IPAD_DEVICE_NAME: "iPad (A16)"

on:
  workflow_dispatch:
    inputs:
      single_test_class:
        description: "Run one or more UITestCases (optional, space-separated, e.g. 'AppLaunchUITests')"
        type: string
        required: false
      devices:
        description: "Device family to run"
        type: choice
        default: both
        options:
        - iphone
        - ipad
        - both
      user_modes:
        description: "User mode(s) to run. 'production' = production behaviour (release-gating). 'internal' = isInternalUser=true, runs internally-gated features (advance warning). 'both' = run both legs."
        type: choice
        default: production
        options:
        - production
        - internal
        - both
  schedule:
    - cron: '0 2 * * 1-5' # 2AM UTC to not clash with macOS tests run at 3AM
  pull_request:
    # opened, synchronize, reopened are the default triggering events for a pull request
    # We're also adding ready_for_review to run checks when a draft PR becomes ready for review.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/**'
      - '.xcode-version'
      - 'SharedPackages/**'
      - 'iOS/**'

concurrency:
  # When this workflow is called by another workflow (e.g. code freeze), `github.workflow` contains the name of the calling workflow,
  # and the value of `${{ github.workflow }}-${{ github.ref }}` would be the same for PR Checks and UI Tests, which would prevent them
  # from being run concurrently. We're adding a suffix here to tell PR Checks and UI Tests apart and allow for running the two
  # side by side in the code freeze workflow.
  group: ${{ github.workflow }}-${{ github.ref }}-ios-ui-tests
  cancel-in-progress: true

jobs:
  should-run-checks:
    name: Determine if checks should run
    uses: ./.github/workflows/should_run_pr_checks.yml

  # This job sets up the matrix strategy arguments for the ui-tests jobs
  setup-tests:
    name: Set up tests list
    runs-on: ubuntu-latest

    needs: should-run-checks
    if: needs.should-run-checks.outputs.should_run == 'true'

    outputs:
      include: ${{ steps.matrix.outputs.include }}
      run-production: ${{ steps.modes.outputs.run-production }}
      run-internal: ${{ steps.modes.outputs.run-internal }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Define user-modes
        id: modes
        working-directory: ${{ github.workspace }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODES: ${{ inputs.user_modes }}
        run: |
          case "$EVENT_NAME" in
            schedule) modes='["production", "internal"]' ;;
            workflow_dispatch)
              case "$INPUT_MODES" in
                internal) modes='["internal"]' ;;
                both) modes='["production", "internal"]' ;;
                *) modes='["production"]' ;;
              esac
              ;;
            *) modes='["production"]' ;;
          esac
          echo "run-production=$(jq -r 'index("production") != null' <<< "$modes")" >> "$GITHUB_OUTPUT"
          echo "run-internal=$(jq -r 'index("internal") != null' <<< "$modes")" >> "$GITHUB_OUTPUT"

      - name: Define test matrix
        id: matrix
        working-directory: ${{ github.workspace }}
        env:
          DEVICES: ${{ inputs.devices || 'both' }}
          TEST_CLASSES: ${{ inputs.single_test_class }}
        run: |
          # Follow macOS class discovery; Common/Support contain helper-only base classes.
          invalid_classes=$(grep -r 'class.*:.*XCTestCase' iOS/UITests --include='*.swift' \
            | grep -v 'class UITestCase:' || true)
          if [[ -n "$invalid_classes" ]]; then
            echo "::error::UI test classes must inherit from UITestCase: $invalid_classes"
            exit 1
          fi
          test_names=$(grep -rh 'class.*:.*UITestCase' iOS/UITests --include='*.swift' \
            --exclude-dir=Common --exclude-dir=Support \
            | sed -E 's/^[^c]*class[[:space:]]+([A-Za-z0-9_]+)[[:space:]]*:.*/\1/' | sort -u)
          tests=$(printf '%s\n' "$test_names" | jq -Rsc 'split("\n") | map(select(length > 0))')
          requested=$(printf '%s' "$TEST_CLASSES" | jq -Rsc '[splits("\\s+") | select(length > 0)]')

          # Resolve device eligibility from the test plans. iPad is explicitly opt-in.
          phone_tests=$(jq -c --argjson tests "$tests" '
            .testTargets[0] | (.selectedTests // $tests) - (.skippedTests // [])
            ' 'iOS/UITests/UI Tests.xctestplan')
          pad_tests=$(jq -c '
            .testTargets[0] |
            if (.selectedTests | type) != "array" then
              error("iPad requires an explicit selectedTests list")
            else .selectedTests - (.skippedTests // []) end
            ' 'iOS/UITests/iPad UI Tests.xctestplan')

          # Validate the plans before applying optional device/class filters.
          jq -en --argjson tests "$tests" --argjson phone "$phone_tests" --argjson ipad "$pad_tests" '
            ($phone + $ipad) as $eligible |
            if ($eligible - $tests | length) > 0 then
              error("Test plans must reference known classes, not individual methods")
            elif ($tests - $eligible | length) > 0 then
              error("A discovered test class is excluded from both device plans")
            else true end' > /dev/null

          # Create one matrix entry per eligible class/device pair.
          matrix=$(jq -cn --argjson tests "$tests" --argjson requested "$requested" \
            --argjson phone "$phone_tests" --argjson ipad "$pad_tests" \
            --arg devices "$DEVICES" --arg iphone_name "$IPHONE_DEVICE_NAME" --arg ipad_name "$IPAD_DEVICE_NAME" '
            {include: [
              $tests[] as $test |
              select(($requested | length) == 0 or ($requested | index($test)) != null) |
              {device: "iphone", "device-name": $iphone_name, tests: $phone},
              {device: "ipad", "device-name": $ipad_name, tests: $ipad} |
              select($devices == "both" or $devices == .device) |
              select(.tests | index($test)) |
              {test: $test, device, "device-name"}
            ]}')

          jq -e --argjson requested "$requested" '
            if (.include | length) == 0 then error("No tests selected")
            elif ($requested - [.include[].test] | length) > 0 then
              error("Requested class is unknown or not eligible for selected devices")
            else true end' <<< "$matrix" > /dev/null
          echo "include=$(jq -c '.include' <<< "$matrix")" >> "$GITHUB_OUTPUT"
          echo "Resolved matrix: $matrix"

  build-for-testing:
    name: Build UI Tests
    runs-on: ['image:osx-tahoe-26', ui-tests]

    needs: should-run-checks
    if: needs.should-run-checks.outputs.should_run == 'true'

    timeout-minutes: 45

    outputs:
      artifact-name: ${{ steps.package.outputs.artifact-name }}
      ios-version: ${{ steps.select-simulator.outputs.ios-version }}
    steps:
    - name: Register SSH keys for private repos
      uses: webfactory/ssh-agent@v0.10.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY_DUCKSANS_FONT }}

    - name: Check out the code
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Print macOS version
      run: sw_vers

    - name: Set cache key hash
      run: |
        has_only_tags=$(jq '[ .pins[].state | has("version") ] | all' DuckDuckGo-iOS.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved)
        if [[ "$has_only_tags" == "true" ]]; then
          # hashFiles does not respect the working directory, so the full path must be specified
          echo "cache_key_hash=${{ hashFiles('iOS/DuckDuckGo-iOS.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}" >> $GITHUB_ENV
        else
          echo "Package.resolved contains dependencies specified by branch or commit, skipping cache."
        fi

    - name: Cache SPM
      if: env.cache_key_hash
      uses: actions/cache@v5
      with:
        path: iOS/DerivedData/SourcePackages
        key: ${{ runner.os }}-ios-${{ env.cache_key_hash }}
        restore-keys: |
          ${{ runner.os }}-ios-

    - name: Select Xcode
      uses: ./.github/actions/select-xcode-version

    - name: Setup Bitrise Build Cache
      uses: ./.github/actions/bitrise-build-cache
      with:
        enabled: ${{ vars.BITRISE_BUILD_CACHE_ENABLED }}
        token: ${{ secrets.BITRISE_BUILD_CACHE_AUTH_TOKEN }}
        workspace-id: ${{ secrets.BITRISE_BUILD_CACHE_WORKSPACE_ID }}

    - name: Select build simulator
      id: select-simulator
      uses: ./.github/actions/select-ios-simulator
      with:
        preferred-versions: ${{ env.IOS_VERSION }}
        device-name: ${{ env.IPHONE_DEVICE_NAME }}

    - name: Build for testing
      run: |
        # Omitting -testPlan makes Xcode build one run configuration for every plan registered in
        # the scheme. Workers select the device-specific .xctestrun without recompiling the app.
        set -o pipefail && xcodebuild build-for-testing \
          -scheme "iOS UI Tests" \
          -destination "${{ steps.select-simulator.outputs.destination }}" \
          -derivedDataPath DerivedData \
          -skipPackagePluginValidation \
          -skipMacroValidation \
          COMPILATION_CACHE_ENABLE_CACHING=YES \
          OTHER_CODE_SIGN_FLAGS=--timestamp=none \
        | tee xcodebuild.log \
        | xcbeautify

    - name: Package build products
      id: package
      env:
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
      run: |
        artifact_name="ios-ui-tests-build-${RUN_ID}-${RUN_ATTEMPT}"
        tar -czf build-products.tar.gz -C DerivedData Build/Products
        echo "artifact-name=$artifact_name" >> "$GITHUB_OUTPUT"

    - name: Upload immutable build products
      uses: ./.github/actions/upload-artifact-with-retry
      with:
        name: ${{ steps.package.outputs.artifact-name }}
        path: iOS/build-products.tar.gz
        if-no-files-found: error
        retention-days: 1

    - name: Upload build logs when the build fails
      if: failure() || cancelled()
      uses: ./.github/actions/upload-artifact-with-retry
      with:
        name: "ios-ui-build-logs-${{ github.run_id }}-${{ github.run_attempt }}"
        path: "iOS/xcodebuild.log"
        if-no-files-found: warn
        retention-days: 7

  # UI Tests run as two jobs, one per user mode, each calling the reusable ios_run_ui_test.yml
  # helper once per (device x test) combination.
  # Each job runs only when its mode was requested (production by default; internal for
  # user_modes=internal/both and the scheduled run). Internal-mode failures stay non-gating via
  # continue-on-error inside the helper's job.
  ui-tests-production:
    name: UI Tests
    needs: [setup-tests, build-for-testing]
    if: needs.setup-tests.outputs.run-production == 'true'
    strategy:
      # PRs run only production; allow up to eight class/device jobs at once.
      fail-fast: false
      max-parallel: 8
      matrix:
        include: ${{ fromJSON(needs.setup-tests.outputs.include) }}
    uses: ./.github/workflows/ios_run_ui_test.yml
    with:
      test: ${{ matrix.test }}
      device: ${{ matrix.device }}
      device-name: ${{ matrix.device-name }}
      ios-version: ${{ needs.build-for-testing.outputs.ios-version }}
      user-mode: production
      build-artifact-name: ${{ needs.build-for-testing.outputs.artifact-name }}

  ui-tests-internal:
    name: UI Tests
    needs: [setup-tests, build-for-testing]
    if: needs.setup-tests.outputs.run-internal == 'true'
    strategy:
      # Keep internal at four, so scheduled/manual both-mode runs peak at twelve workers in total.
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.setup-tests.outputs.include) }}
    uses: ./.github/workflows/ios_run_ui_test.yml
    with:
      test: ${{ matrix.test }}
      device: ${{ matrix.device }}
      device-name: ${{ matrix.device-name }}
      ios-version: ${{ needs.build-for-testing.outputs.ios-version }}
      user-mode: internal
      build-artifact-name: ${{ needs.build-for-testing.outputs.artifact-name }}

  test-report:
    name: Report test results
    if: always() && needs.should-run-checks.outputs.should_run == 'true'
    needs: [should-run-checks, setup-tests, build-for-testing, ui-tests-production, ui-tests-internal]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write

    steps:
    - name: Check out repository
      uses: actions/checkout@v6

    - name: Download test reports
      uses: actions/download-artifact@v7
      with:
        pattern: "ios-testreport-*"
        path: reports
        merge-multiple: true

    - name: Check report completeness
      if: always()
      working-directory: ${{ github.workspace }}
      env:
        MATRIX: ${{ needs.setup-tests.outputs.include }}
        RUN_PRODUCTION: ${{ needs.setup-tests.outputs.run-production }}
        RUN_INTERNAL: ${{ needs.setup-tests.outputs.run-internal }}
      run: |
        # Stable per-class/device/mode artifacts replace rerun reports, as in macOS.
        for mode in production internal; do
          if [[ "$mode" == production && "$RUN_PRODUCTION" != true ]] || \
             [[ "$mode" == internal && "$RUN_INTERNAL" != true ]]; then
            continue
          fi
          while IFS= read -r cell; do
            if [[ ! -s "reports/${cell}-${mode}.xml" ]]; then
              echo "::error::Missing report for ${cell}-${mode}."
              exit 1
            fi
          done < <(jq -r '.[] | .test + "-" + .device' <<< "$MATRIX")
        done
        if compgen -G 'reports/*.invalid' > /dev/null; then
          echo "::error::A UI-test job did not produce valid execution results. Check its logs and xcresult."
          exit 1
        fi

    - name: Publish tests report
      uses: mikepenz/action-junit-report@v6
      if: always()
      with:
        check_name: Tests Report
        report_paths: "reports/*.xml"
        require_tests: true
        check_retries: true
        group_reports: false
        flaky_summary: true
        verbose_summary: false
        include_time_in_summary: true
        skip_annotations: true
        fail_on_failure: false
