name: Smartling - Release Translations Check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - 'release/**'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: smartling-release-translations-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Check the release translations
    if: startsWith(github.head_ref, 'smartling/release-')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the pull request
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Check the translations
        id: check
        env:
          BASE_REF: ${{ github.base_ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 scripts/smartling/check_release_translations.py \
            --base "origin/$BASE_REF" \
            --comment-file "$RUNNER_TEMP/comment.md" \
            --run-url "$RUN_URL"

      - name: Comment on the pull request
        id: comment
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          VERDICT: ${{ steps.check.outputs.verdict || 'error' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ ! -f "$RUNNER_TEMP/comment.md" ]; then
            printf '%s\n' \
              '<!-- smartling-release-translations-check verdict=error -->' \
              "## ❌ The translations check couldn't run" \
              '' \
              "Don't merge yet: this pull request's translations weren't checked. The [workflow run]($RUN_URL) shows what failed. Re-run it once that's fixed." \
              > "$RUNNER_TEMP/comment.md"
          fi
          previous="$(gh api "repos/$REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- smartling-release-translations-check")) | "\(.id) \(.body | split("\n")[0])"' \
            | tail -n 1)"
          comment_id="${previous%% *}"
          notified="$(sed -n 's/.* notified=\([a-z]*\) -->$/\1/p' <<< "$previous")"
          sed -i "1s/ -->\$/ notified=${notified:-none} -->/" "$RUNNER_TEMP/comment.md"
          if [ -n "$comment_id" ]; then
            response="$(gh api -X PATCH "repos/$REPOSITORY/issues/comments/$comment_id" -F body=@"$RUNNER_TEMP/comment.md" --jq '"\(.id) \(.html_url)"')"
          else
            response="$(gh api "repos/$REPOSITORY/issues/$PR_NUMBER/comments" -F body=@"$RUNNER_TEMP/comment.md" --jq '"\(.id) \(.html_url)"')"
          fi
          url="${response#* }"
          echo "Comment: $url"
          echo "id=${response%% *}" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          if [ "$notified" != "$VERDICT" ]; then
            echo "notify=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Get the Translations task ID
        id: task
        if: ${{ !cancelled() && steps.comment.outputs.notify == 'true' }}
        uses: duckduckgo/apple-toolbox/actions/asana-extract-task-id@main
        with:
          text: ${{ github.event.pull_request.body }}

      - name: Point the release DRI to the comment
        id: asana
        if: ${{ !cancelled() && steps.task.outputs.task-id != '' }}
        continue-on-error: true
        uses: duckduckgo/native-github-asana-sync@v2.5.1
        with:
          action: post-comment-asana-task
          asana-pat: ${{ secrets.ASANA_ACCESS_TOKEN }}
          asana-task-id: ${{ steps.task.outputs.task-id }}
          asana-task-comment-pinned: false
          asana-task-comment-is-html: false
          asana-task-comment: |
            ${{ (steps.check.outputs.verdict == 'ready' && '✅ The release translations are ready to merge.') || (steps.check.outputs.verdict == 'warning' && '⚠️ The release translations are ready to merge after checking the warnings.') || (steps.check.outputs.verdict == 'fix' && '❌ Some release translations need a fix before merging.') || '❌ The release translations check couldn''t run, so don''t merge yet.' }}

            🔀 Pull request: ${{ github.event.pull_request.html_url }}
            📋 What to do: ${{ steps.comment.outputs.url }}

      - name: Remember the release DRI was told
        if: ${{ !cancelled() && steps.asana.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMENT_ID: ${{ steps.comment.outputs.id }}
          VERDICT: ${{ steps.check.outputs.verdict || 'error' }}
        run: |
          sed -i "1s/ notified=[a-z]* -->\$/ notified=$VERDICT -->/" "$RUNNER_TEMP/comment.md"
          gh api -X PATCH "repos/$REPOSITORY/issues/comments/$COMMENT_ID" -F body=@"$RUNNER_TEMP/comment.md" --silent

      - name: Fail the run if a translation needs a fix
        if: steps.check.outputs.verdict == 'fix'
        run: |
          echo "::error::Some translations need a fix before merging. See the pull request comment."
          exit 1
