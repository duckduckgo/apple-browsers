name: 'Select iOS Simulator Version'
description: 'Selects the first available iOS simulator version from a list of preferred versions'
inputs:
  preferred-versions:
    description: 'Comma-separated list of preferred iOS versions (e.g., "18.6,18.2")'
    required: true
  device-name:
    description: 'iOS simulator device name'
    required: false
    default: 'iPhone 16'
outputs:
  destination:
    description: 'Complete xcodebuild destination string'
    value: ${{ steps.select-version.outputs.destination }}
  ios-version:
    description: 'Selected iOS version'
    value: ${{ steps.select-version.outputs.ios-version }}
runs:
  using: 'composite'
  steps:
    - name: Select iOS simulator version
      id: select-version
      shell: bash
      run: |
        IFS=',' read -r -a PREFERRED_VERSIONS <<< "${{ inputs.preferred-versions }}"
        DEVICE_NAME='${{ inputs.device-name }}'

        runtimes_json="$(xcrun simctl list runtimes --json)"

        pick_exact_version() {
          local pref="$1"
          jq -r --arg pref "$pref" '
            .runtimes
            | map(select(
              .isAvailable == true and
              (.name | startswith("iOS ")) and
              (.version | startswith($pref))
            ))
            | sort_by(.version)
          | .[-1].version
          ' <<< "$runtimes_json"
        }

        for v in "${PREFERRED_VERSIONS[@]}"; do
          v="$(echo "$v" | xargs)"
          [[ -z "$v" ]] && continue
          exact="$(pick_exact_version "$v")"
          if [[ -n "$exact" ]]; then
            dest="platform=iOS Simulator,name=${DEVICE_NAME},OS=${exact}"
            echo "✅ Selected iOS $v (exact: $exact)"
            echo "destination=$dest" >> "$GITHUB_OUTPUT"
            echo "ios-version=$exact" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        done

        echo "⚠️ No preferred iOS version found, using default OS for device"
        echo "destination=platform=iOS Simulator,name=${DEVICE_NAME}" >> "$GITHUB_OUTPUT"
        echo "ios-version=default" >> "$GITHUB_OUTPUT"
