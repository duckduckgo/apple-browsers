# duckai_chrome_shortcut_tap_opens_duckai.yaml
#
# Scenario 1: Tapping the chrome shortcut opens the Duck.ai menu, and New Chat opens Duck.ai.
appId: com.duckduckgo.mobile.ios
tags:
    - ipad
    - duckai_chrome_shortcut

---

- runFlow: ../shared/duckai_chrome_shortcut_setup.yaml

# The chrome shortcut is visible in the iPad tabs bar on a clean launch.
- assertVisible:
    id: "Browser.TabsBar.AIChatMenuButton"

# The button shows its menu as the primary action, so a plain tap opens the menu.
- tapOn:
    id: "Browser.TabsBar.AIChatMenuButton"
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible: "New Chat"

- tapOn: "New Chat"
- waitForAnimationToEnd:
    timeout: 3000

# Duck.ai is open: the Duck.ai input prompt is shown.
- assertVisible: "Ask anything privately"
