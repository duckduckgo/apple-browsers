name: Smartling - Nightly Jobs

# Runs every night, weekends included, for both platforms with the default limit.
# To test without authorizing anything or opening a review task, run it manually with auto_authorize_max_usd set to 0.
# Each night also opens an Asana task for each new Smartling issue on an English string, for the author of the pull
# request that added the string. To test that alone without opening tasks, run it manually with open_issues_only and
# open_issues_dry_run, from any branch.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform"
        type: choice
        default: both
        options:
          - both
          - iOS
          - macOS
      auto_authorize_max_usd:
        description: "Authorize jobs whose maximum USD estimate is at most this (0 never authorizes)"
        type: string
        default: "500.00"
      open_issues_only:
        description: "Only open tasks for new Smartling issues, without submitting strings"
        type: boolean
        default: false
      open_issues_dry_run:
        description: "List the tasks for new Smartling issues without opening them"
        type: boolean
        default: false
      open_issues_since:
        description: "Look at Smartling issues opened since this ISO time if it is before the last successful night (a dry run starts there; otherwise not before go-live)"
        type: string
        default: ""

permissions:
  contents: read

# A read-only run gets a group of its own: queued in the shared group, it would replace a pending nightly.
concurrency:
  group: smartling-nightly${{ inputs.open_issues_only && inputs.open_issues_dry_run && format('-dry-run-{0}', github.run_id) || '' }}
  cancel-in-progress: false

jobs:
  smartling:
    name: ${{ matrix.platform }} nightly
    if: ${{ !inputs.open_issues_only }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON((github.event_name == 'schedule' || inputs.platform == 'both') && '["iOS","macOS"]' || format('["{0}"]', inputs.platform)) }}
    uses: ./.github/workflows/smartling_submit.yml
    with:
      kind: nightly
      platform: ${{ matrix.platform }}
      auto_authorize_max_usd: ${{ inputs.auto_authorize_max_usd || '500.00' }}
    secrets: inherit

  # Doesn't wait for the submission, so a job awaiting authorization or a failed submission doesn't stop it. Its
  # window starts when this job last succeeded on main, so the name, without " (dry run)", is part of that lookup.
  open_issues:
    name: ${{ matrix.platform }} open issues${{ inputs.open_issues_dry_run && ' (dry run)' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON((github.event_name == 'schedule' || inputs.platform == 'both') && '["iOS","macOS"]' || format('["{0}"]', inputs.platform)) }}
    env:
      PLATFORM: ${{ matrix.platform }}
      # Issues opened before the automation went live are left alone, even with open_issues_since, except in a dry
      # run. Until the first successful night on main, the window starts here.
      NOT_BEFORE: '2026-11-05T00:00:00Z'

    steps:
      - name: Allow tasks only from main
        if: ${{ !inputs.open_issues_dry_run && github.ref != 'refs/heads/main' }}
        run: |
          echo "Opening tasks is only allowed from the default branch. Run with open_issues_dry_run from other branches." >&2
          exit 1

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Resolve platform configuration
        run: |
          case "$PLATFORM" in
            iOS)
              {
                echo "SMARTLING_USER_ID=${{ secrets.IOS_SMARTLING_USER_ID }}"
                echo "SMARTLING_USER_SECRET=${{ secrets.IOS_SMARTLING_USER_SECRET }}"
                echo "SMARTLING_PROJECT_ID=${{ vars.IOS_SMARTLING_PROJECT_ID }}"
                echo "ASANA_PROJECT_ID=${{ vars.GH_ASANA_IOS_APP_PROJECT_ID }}"
                echo "ASANA_INCOMING_SECTION_NAME=Incoming"
                echo "ASANA_TRIAGE_ROTATION_SECTION_ID=1210869535563575"
              } >> "$GITHUB_ENV"
              ;;
            macOS)
              {
                echo "SMARTLING_USER_ID=${{ secrets.MACOS_SMARTLING_USER_ID }}"
                echo "SMARTLING_USER_SECRET=${{ secrets.MACOS_SMARTLING_USER_SECRET }}"
                echo "SMARTLING_PROJECT_ID=${{ vars.MACOS_SMARTLING_PROJECT_ID }}"
                echo "ASANA_PROJECT_ID=${{ vars.MACOS_APP_DEVELOPMENT_ASANA_PROJECT_ID }}"
                echo "ASANA_INCOMING_SECTION_NAME=Incoming: Dev Related Issues"
                echo "ASANA_TRIAGE_ROTATION_SECTION_ID=1210871971126998"
              } >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unknown platform: $PLATFORM" >&2
              exit 1
              ;;
          esac

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install aiohttp

      # Without the map, every task goes to the triage DRI.
      - name: Fetch the GitHub to Asana user map
        env:
          GH_TOKEN: ${{ secrets.APPLE_GH_RO_PAT }}
        run: |
          set -o pipefail
          if gh api repos/duckduckgo/internal-github-asana-utils/contents/user_map.yml --jq .content 2>/dev/null \
              | base64 -d > "$RUNNER_TEMP/user_map.yml"; then
            echo "Fetched user_map.yml"
          else
            echo "::warning::Couldn't fetch user_map.yml, so every task goes to the triage DRI"
            : > "$RUNNER_TEMP/user_map.yml"
          fi

      - name: Open ${{ matrix.platform }} tasks for new Smartling issues
        env:
          ASANA_ACCESS_TOKEN: ${{ secrets.ASANA_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          SINCE: ${{ inputs.open_issues_since }}
          DRY_RUN: ${{ inputs.open_issues_dry_run }}
        run: |
          extra_args=()
          [ -z "$SINCE" ] || extra_args+=(--since "$SINCE")
          [ "$DRY_RUN" != true ] || extra_args+=(--dry-run)
          python3 ./scripts/smartling/smartling_open_issues.py \
            --platform "$PLATFORM" \
            --asana-project "$ASANA_PROJECT_ID" \
            --section-name "$ASANA_INCOMING_SECTION_NAME" \
            --rotation-section "$ASANA_TRIAGE_ROTATION_SECTION_ID" \
            --user-map "$RUNNER_TEMP/user_map.yml" \
            --job-name "$PLATFORM open issues" \
            --not-before "$NOT_BEFORE" \
            --workflow-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            ${extra_args[@]+"${extra_args[@]}"}
