name: Agent worker sandbox test

# Throwaway: checks that git, xcodebuild and the Simulator work under the sandbox Claude Code uses,
# and that the sandbox still blocks a token file and the network. No secrets, never merged

on:
  push:
    branches: [jashby/sandbox-test]

permissions:
  contents: read

jobs:
  sandbox:
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          path: target
          fetch-depth: 0
          filter: blob:none
          submodules: recursive
          persist-credentials: false

      - name: Git history
        working-directory: target
        run: |
          git log -3 --oneline -- iOS/DuckDuckGo/Main/SwipeTabsCoordinator.swift
          git blame -L 600,606 iOS/DuckDuckGo/Main/SwipeTabsCoordinator.swift
          git tag -l '7.245.0+ios'

      - name: Tooling
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | head -20
          npm install -g @anthropic-ai/sandbox-runtime@latest > /dev/null
          srt --help || true

      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions
          path: actions-src
          persist-credentials: false

      - name: Select iOS Simulator
        id: sim
        uses: ./actions-src/.github/actions/select-ios-simulator
        with:
          preferred-versions: "27.0,26.2,26.1,26.0,18.6"

      - name: Sandbox policy
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/identity" && echo "dummy-token" > "$RUNNER_TEMP/identity/token"
          # srt points TMPDIR here for sandboxed commands
          mkdir -p /tmp/claude
          # macOS can't nest sandboxes, so SwiftPM's own manifest and plugin sandbox has to be off. They
          # still run inside srt's sandbox
          defaults write com.apple.dt.Xcode IDEPackageSupportDisableManifestSandbox -bool YES
          defaults write com.apple.dt.Xcode IDEPackageSupportDisablePluginExecutionSandbox -bool YES
          python3 - <<'PY'
          import json, os
          ws, tmp = os.environ["GITHUB_WORKSPACE"], os.environ["RUNNER_TEMP"]
          policy = {
              # Apple's certificate checks are for verifying signed binary frameworks such as Lottie.xcframework
              "network": {"allowedDomains": ["github.com", "*.github.com", "*.githubusercontent.com",
                                             "ocsp.apple.com", "ocsp2.apple.com", "crl.apple.com", "valid.apple.com"],
                          "deniedDomains": [],
                          "allowMachLookup": ["com.apple.CoreSimulator.*", "com.apple.dt.*", "com.apple.trustd",
                                              "com.apple.trustd.agent", "com.apple.SecurityServer", "com.apple.ocspd",
                                              "com.apple.securityd.xpc"]},
              "filesystem": {
                  "denyRead": [f"{tmp}/identity"],
                  "allowWrite": [ws, tmp, "/private/tmp", "/private/var/folders"] + [os.path.expanduser(p) for p in (
                      "~/Library/Developer", "~/Library/Caches", "~/Library/Logs", "~/Library/org.swift.swiftpm",
                      "~/.swiftpm", "~/.cache")],
                  "denyWrite": [],
              },
          }
          for p in (os.path.expanduser("~/.srt-settings.json"), f"{tmp}/srt-settings.json"):
              json.dump(policy, open(p, "w"), indent=2)
          print(json.dumps(policy, indent=2))
          PY

      - name: Canary (both must be blocked)
        run: |
          set +e
          cat "$RUNNER_TEMP/identity/token" > /dev/null && echo "control: token readable outside the sandbox"
          srt -c "echo control: srt runs commands" || echo "CONTROL FAIL: srt can't run a command"
          srt -c "cat '$RUNNER_TEMP/identity/token'" && echo "CANARY FAIL: token readable" || echo "canary ok: token read blocked"
          srt -c "curl -sS -m 10 https://example.com -o /dev/null" && echo "CANARY FAIL: example.com reachable" || echo "canary ok: example.com blocked"
          srt -c "bash -c 'cat $RUNNER_TEMP/identity/token'" && echo "CANARY FAIL: child process read token" || echo "canary ok: child process blocked"
          srt -c "curl -sS -m 10 https://github.com -o /dev/null" && echo "allowed domain reachable" || echo "NOTE: github.com not reachable under sandbox"

      # Packages are resolved before the sandbox, from main's manifests, with the deploy key for the private
      # font package. The key is gone before anything runs in the sandbox
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY_DUCKSANS_FONT }}

      - name: Resolve packages outside the sandbox
        working-directory: target
        run: |
          set -o pipefail
          xcodebuild -resolvePackageDependencies -scheme 'iOS Browser' -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/SourcePackages" \
            -skipPackagePluginValidation -skipMacroValidation 2>&1 | tail -5

      - name: Remove the deploy key
        run: |
          ssh-add -D || true
          ssh-agent -k || true
          echo "SSH_AUTH_SOCK=" >> "$GITHUB_ENV"

      # main is built once outside the sandbox, before any agent change and with no credentials on the
      # runner. Builds inside the sandbox are then incremental, so ibtool (which can't run nested) isn't needed
      - name: Prebuild main outside the sandbox
        id: prebuild
        continue-on-error: true
        working-directory: target
        env:
          DEST: ${{ steps.sim.outputs.destination }}
        run: |
          set -o pipefail
          bash -c "xcodebuild build-for-testing -scheme 'iOS Browser' -destination '$DEST' -derivedDataPath DerivedData \
            -clonedSourcePackagesDirPath '$GITHUB_WORKSPACE/SourcePackages' -disableAutomaticPackageResolution \
            -skipPackagePluginValidation -skipMacroValidation OTHER_CODE_SIGN_FLAGS=--timestamp=none COMPILATION_CACHE_ENABLE_CACHING=NO \
            OTHER_SWIFT_FLAGS='\$(inherited) -disable-sandbox'" > "$RUNNER_TEMP/prebuild.log" 2>&1 && rc=0 || rc=$?
          grep -E "BUILD (SUCCEEDED|FAILED)|Command PhaseScriptExecution failed|^error:|: error:" "$RUNNER_TEMP/prebuild.log" | grep -v "^ *export " | sort | uniq -c | sort -rn | head -20 || true
          grep -B12 "Command PhaseScriptExecution failed" "$RUNNER_TEMP/prebuild.log" | grep -v "^ *export \|^ *cd \|^ *builtin" | head -60 || true
          exit $rc

      - name: Stand-in for the agent's edit
        working-directory: target
        run: echo "// sandbox test edit" >> iOS/DuckDuckGo/Main/SwipeTabsCoordinator.swift

      - name: Incremental build under the sandbox
        id: build
        continue-on-error: true
        working-directory: target
        env:
          DEST: ${{ steps.sim.outputs.destination }}
        run: |
          set -o pipefail
          srt -c "xcodebuild build-for-testing -scheme 'iOS Browser' -destination '$DEST' -derivedDataPath DerivedData \
            -clonedSourcePackagesDirPath '$GITHUB_WORKSPACE/SourcePackages' -disableAutomaticPackageResolution \
            -skipPackagePluginValidation -skipMacroValidation OTHER_CODE_SIGN_FLAGS=--timestamp=none COMPILATION_CACHE_ENABLE_CACHING=NO \
            OTHER_SWIFT_FLAGS='\$(inherited) -disable-sandbox'" > "$RUNNER_TEMP/build.log" 2>&1 && rc=0 || rc=$?
          grep -E "BUILD (SUCCEEDED|FAILED)|Command [A-Za-z]+ failed|: error:|^error:|Operation not permitted|sandbox_extension|couldNot" "$RUNNER_TEMP/build.log" | grep -v "^ *export " | cut -c1-240 | sort | uniq -c | sort -rn | head -30 || true
          grep -B15 -E "Command [A-Za-z]+ failed" "$RUNNER_TEMP/build.log" | grep -v "^ *export \|^ *cd \|^ *builtin-SwiftDriver" | cut -c1-240 | head -60 || true
          echo "files compiled: $(grep -c "^SwiftCompile\|^CompileSwift" "$RUNNER_TEMP/build.log" || true)"
          exit $rc

      - name: One unit test under the sandbox
        if: steps.build.outcome == 'success'
        continue-on-error: true
        working-directory: target
        env:
          DEST: ${{ steps.sim.outputs.destination }}
        run: |
          set -o pipefail
          srt -c "xcodebuild test-without-building -scheme 'iOS Browser' -destination '$DEST' -derivedDataPath DerivedData \
            -clonedSourcePackagesDirPath '$GITHUB_WORKSPACE/SourcePackages' -disableAutomaticPackageResolution \
            -only-testing:DuckDuckGoTests/SwipeTabsNewTabDestinationTests" 2>&1 | tail -30

      - name: Screenshot under the sandbox
        if: steps.build.outcome == 'success'
        continue-on-error: true
        working-directory: target
        env:
          DEST: ${{ steps.sim.outputs.destination }}
        run: |
          set -euo pipefail
          udid=booted
          app=$(find DerivedData/Build/Products -maxdepth 2 -name 'DuckDuckGo.app' | head -1)
          echo "simulator $udid, app $app"
          srt -c "xcrun simctl boot ${udid:-booted}" || true
          srt -c "xcrun simctl install ${udid:-booted} '$app'"
          srt -c "xcrun simctl launch ${udid:-booted} com.duckduckgo.mobile.ios"
          sleep 15
          srt -c "xcrun simctl io ${udid:-booted} screenshot '$GITHUB_WORKSPACE/screenshot.png'"
          ls -la "$GITHUB_WORKSPACE/screenshot.png"

      # Maestro is installed outside the sandbox, then a short flow records the app under it
      - name: Install Maestro and ffmpeg
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash > /dev/null
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          command -v ffmpeg || brew install ffmpeg > /dev/null

      - name: Recording under the sandbox
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/rec"
          cat > "$GITHUB_WORKSPACE/rec/flow.yaml" <<'YAML'
          appId: com.duckduckgo.mobile.ios
          ---
          - startRecording: demo
          - launchApp
          - waitForAnimationToEnd
          - stopRecording
          YAML
          cd "$GITHUB_WORKSPACE/rec"
          srt -c "maestro test flow.yaml" 2>&1 | tail -20 || echo "maestro failed under the sandbox"
          ls -la
          if [[ -f demo.mp4 ]]; then
            ffmpeg -loglevel error -y -i demo.mp4 -vf "fps=8,scale=320:-1:flags=lanczos" -t 8 demo.gif
            ls -la demo.gif
          fi

      - name: Sandbox violations in the build log
        if: always()
        run: grep -iE "sandbox|deny|operation not permitted|blocked" "$RUNNER_TEMP/build.log" 2>/dev/null | sort | uniq -c | sort -rn | head -40 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sandbox-test
          path: screenshot.png
          if-no-files-found: ignore
