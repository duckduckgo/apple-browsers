name: Agent worker

# Agent worker: applies a plan from the apple-agent-orchestrator and opens a PR ready for review when the agent's last
# build and test run passed

on:
  workflow_dispatch:
    inputs:
      task_gid:
        description: "Asana task gid"
        required: true
        type: string
      handoff:
        description: "Handoff ID (a UUID, the handoff's prefix in the auto artifacts container)"
        required: true
        type: string
      sha256:
        description: "SHA-256 of the plan"
        required: true
        type: string
      auto_sha256:
        description: "SHA-256 of the auto plugin zip in the handoff. Empty runs the plan without auto"
        required: false
        type: string
        default: ""

permissions: {}

# One run per task at a time, so tasks under the WIP limit run side by side
concurrency:
  group: agent-worker-${{ inputs.task_gid }}
  cancel-in-progress: false

env:
  ARTIFACTS_ACCOUNT: ddgartifactsuse
  ARTIFACTS_CONTAINER: auto
  # Inputs are checked in the agent job's first step before any of these paths are used. Storage is
  # create-only, so each run gets its own prefix
  PLAN_BLOB: ${{ inputs.handoff }}/plan.md
  AUTO_BLOB: ${{ inputs.handoff }}/auto-claude.zip
  AUTO_SHA256: ${{ inputs.auto_sha256 }}
  HANDOFF_PREFIX: ${{ inputs.handoff }}
  EVIDENCE_PREFIX: ${{ inputs.handoff }}/${{ github.repository }}/${{ github.run_id }}-${{ github.run_attempt }}
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  # Agent Status field and its option gids in the agent project
  STATUS_FIELD: "1220497931497848"
  STATUS_OPTIONS: '{"ready": "1220497931497849", "pr_open": "1220497931497852", "needs_attention": "1220497931497853"}'

jobs:
  agent:
    runs-on: ${{ fromJSON(vars.WORKER_RUNNER || '["image:osx-27-edge", "general-purpose"]') }}
    environment: agent-worker
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
    outputs:
      evidence_url: ${{ steps.evidence.outputs.url }}
      decision_log_url: ${{ steps.evidence.outputs.decision_log_url }}
      changed: ${{ steps.export.outputs.changed }}
      ok: ${{ steps.result.outputs.ok }}
      failure: ${{ steps.result.outputs.failure }}
    steps:
      - name: Kill switch
        if: vars.AGENTS_ENABLED != 'true'
        run: |
          echo "::error::AGENTS_ENABLED is not 'true'"
          exit 1

      - name: Check inputs and branch
        env:
          TASK_GID: ${{ inputs.task_gid }}
          HANDOFF: ${{ inputs.handoff }}
          SHA256: ${{ inputs.sha256 }}
        run: |
          set -euo pipefail
          [[ "$TASK_GID" =~ ^[0-9]{1,20}$ ]] || { echo "::error::bad task_gid"; exit 1; }
          [[ "$HANDOFF" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]] || { echo "::error::bad handoff"; exit 1; }
          [[ "$SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::bad sha256"; exit 1; }
          [[ "$AUTO_SHA256" =~ ^([0-9a-f]{64})?$ ]] || { echo "::error::bad auto_sha256"; exit 1; }
          [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]] ||
            { echo "::error::dispatch on the agent-worker branch, not $DEFAULT_BRANCH"; exit 1; }

      # The agent works on the default branch's code, whatever branch the workflow runs from
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEFAULT_BRANCH }}
          path: target
          submodules: recursive
          persist-credentials: false

      # The worker's own scripts, from this branch and outside the agent's writable checkout
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: worker
          sparse-checkout: scripts/agent-worker
          persist-credentials: false

      # Bitrise images don't ship the Azure CLI that azure/login and blobs.sh need
      - name: Install Azure CLI
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: command -v az > /dev/null || brew install azure-cli > /dev/null

      - name: Azure login (GitHub OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.ARTIFACTS_CLIENT_ID }}
          tenant-id: ${{ vars.ARTIFACTS_TENANT_ID }}
          allow-no-subscriptions: true

      # The plan goes to a file and is never printed. The Azure login is removed before the agent
      # runs, so the agent never has a storage token
      - name: Download plan from artifacts.go
        env:
          SHA256: ${{ inputs.sha256 }}
        run: worker/scripts/agent-worker/blobs.sh plan "$RUNNER_TEMP/plan.md" "$SHA256"

      # The orchestrator copies the pinned auto release here, since this runner can't reach where auto is released
      - name: Download auto plugin from artifacts.go
        if: env.AUTO_SHA256 != ''
        run: worker/scripts/agent-worker/blobs.sh auto "$RUNNER_TEMP/auto-claude.zip" "$AUTO_SHA256"

      - name: Azure logout
        if: always()
        run: az logout > /dev/null 2>&1 || true; rm -rf "$HOME/.azure"

      # The agent builds and tests as it goes, so packages are resolved from main's manifests first, for
      # both apps, and the deploy key is removed before the agent runs
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY_DUCKSANS_FONT }}

      - name: Resolve packages
        working-directory: target
        run: |
          set -o pipefail
          for scheme in 'iOS Browser' 'macOS Browser'; do
            xcodebuild -resolvePackageDependencies -scheme "$scheme" -clonedSourcePackagesDirPath "$RUNNER_TEMP/packages" \
              -skipPackagePluginValidation -skipMacroValidation >> "$RUNNER_TEMP/resolve.log" 2>&1 && echo "resolved $scheme" || echo "resolve failed for $scheme"
          done

      - name: Remove the deploy key
        run: |
          ssh-add -D || true
          ssh-agent -k || true
          echo "SSH_AUTH_SOCK=" >> "$GITHUB_ENV"

      - name: Select iOS Simulator
        id: sim
        uses: ./target/.github/actions/select-ios-simulator
        with:
          preferred-versions: "27.0,26.2,26.1,26.0"

      - name: Install SwiftLint
        continue-on-error: true
        run: command -v swiftlint > /dev/null || brew install swiftlint > /dev/null

      # Unpacked outside the checkout and the agent's writable paths, so it can run auto's scripts but not change
      # them. Its npm packages are installed here, without install scripts, since the agent has no network
      - name: Set up auto plugin
        if: env.AUTO_SHA256 != ''
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          set -euo pipefail
          node_major=$(node -p 'process.versions.node.split(".")[0]' 2>/dev/null || echo 0)
          [[ "$node_major" -ge 24 ]] || brew install node > /dev/null
          auto="$RUNNER_TEMP/auto"
          mkdir -p "$auto" "$RUNNER_TEMP/worktrees"
          unzip -q "$RUNNER_TEMP/auto-claude.zip" -d "$auto"
          for d in skills/auto/scripts skills/show-me-your-work/scripts; do
            (cd "$auto/$d" && npm ci --ignore-scripts --omit=dev --no-audit --no-fund > /dev/null)
          done
          echo "AUTO_DIR=$auto" >> "$GITHUB_ENV"
          echo "auto $(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$auto/.claude-plugin/plugin.json") ready"

      - name: Write prompt
        run: |
          python3 -I worker/scripts/agent-worker/prompt.py "$GITHUB_WORKSPACE/target" "$RUNNER_TEMP/plan.md" \
            ${AUTO_DIR:+"$RUNNER_TEMP/worktrees"} > "$RUNNER_TEMP/prompt.md"

      - name: Install Claude Code
        run: |
          set -euo pipefail
          curl -fsSL https://claude.ai/install.sh | bash -s stable > /dev/null
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Anthropic credentials (workload identity federation)
        id: anthropic
        env:
          RULE: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ORG: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          SERVICE_ACCOUNT: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          WORKSPACE: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
        run: |
          worker/scripts/agent-worker/anthropic_identity.sh "$RUNNER_TEMP/anthropic-identity"
          echo "identity-dir=$RUNNER_TEMP/anthropic-identity" >> "$GITHUB_OUTPUT"

      # Besides file tools, the agent can run xc (build, test, lint) and read-only git, so it can check its
      # change and fix it as it goes. Building and testing runs code the agent wrote, which is why the worker
      # runs from the agent-worker branch and holds no Azure login while the agent runs.
      # With auto, the agent also gets subagents, local git commits and worktrees, and auto's local scripts.
      # Anything that needs a token or network (PRs, evidence upload, other models, reflect) stays denied
      - name: Run coding agent
        working-directory: target
        env:
          IDENTITY_DIR: ${{ steps.anthropic.outputs.identity-dir }}
          DEST: ${{ steps.sim.outputs.destination }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence" "$RUNNER_TEMP/bin"
          ln -sf "$GITHUB_WORKSPACE/worker/scripts/agent-worker/xc.sh" "$RUNNER_TEMP/bin/xc"
          git_ro="Bash(git log:*),Bash(git show:*),Bash(git blame:*),Bash(git diff:*),Bash(git status:*),Bash(git grep:*),Bash(git ls-files:*)"
          allow="Read,Glob,Grep,Edit(./**),Write(./**),Bash(xc:*),$git_ro"
          deny="WebFetch,WebSearch,Read(/$IDENTITY_DIR/**),Read(~/.azure/**),Read(//proc/**)"
          plugin=()
          if [[ -n "${AUTO_DIR:-}" ]]; then
            A=$AUTO_DIR W=$RUNNER_TEMP/worktrees
            allow+=",Agent,TodoWrite,Edit(/$W/**),Write(/$W/**),Write(~/.auto/**)"
            allow+=",Bash(git worktree add $W/:*),Bash(git worktree list:*),Bash(git worktree remove:*)"
            allow+=",Bash(git add:*),Bash(git commit:*),Bash(git cherry-pick:*),Bash(git rev-parse:*),Bash(git merge-base:*)"
            for s in auto/scripts/resolve-models auto/scripts/check-plan auto/scripts/check-pr-body \
              show-me-your-work/scripts/log show-me-your-work/scripts/snapshot show-me-your-work/scripts/new-evidence; do
              allow+=",Bash(node $A/skills/$s.ts:*)"
            done
            allow+=",Bash(node $A/scripts/installation.ts verify:*),Bash(.claude/skills/verify-ios/bin/verify-ios:*)"
            # The checkout's .claude and .git hold scripts the agent runs, so it can't change them
            deny+=",Edit(./.claude/**),Write(./.claude/**),Edit(./.git/**),Write(./.git/**)"
            deny+=",Bash(gh:*),Bash(git push:*),Bash(claude:*),Bash(codex:*)"
            for s in auto/scripts/publish-pr auto/scripts/watch-pr auto/scripts/merge-strategy auto/scripts/pstack-runner \
              show-me-your-work/scripts/upload-evidence show-me-your-work/scripts/evidence-url \
              show-me-your-work/scripts/resolve-decision-log reflect/scripts/issue; do
              deny+=",Bash(node $A/skills/$s.ts:*)"
            done
            plugin=(--plugin-dir "$A")
          fi
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          rc=0
          env -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u SSH_AUTH_SOCK \
            PATH="$RUNNER_TEMP/bin:$PATH" PACKAGES="$RUNNER_TEMP/packages" \
            XC_DERIVED="$RUNNER_TEMP/derived" XC_LOGS="$RUNNER_TEMP/xc-logs" \
            BASH_DEFAULT_TIMEOUT_MS=2700000 BASH_MAX_TIMEOUT_MS=2700000 \
            GIT_AUTHOR_NAME="Apple Agent" GIT_AUTHOR_EMAIL="agent@localhost" \
            GIT_COMMITTER_NAME="Apple Agent" GIT_COMMITTER_EMAIL="agent@localhost" \
            claude -p "$(cat "$RUNNER_TEMP/prompt.md")" ${plugin[@]+"${plugin[@]}"} \
              --permission-mode dontAsk \
              --allowedTools "$allow" \
              --disallowedTools "$deny" \
              --model opus --max-turns 150 --max-budget-usd 30 --output-format json \
              > "$RUNNER_TEMP/evidence/result.json" 2> "$RUNNER_TEMP/evidence/claude.err" || rc=$?
          # The full session as Markdown, so reviewers can see how the agent worked and tune auto or the prompt
          python3 -I "$GITHUB_WORKSPACE/worker/scripts/agent-worker/transcript_md.py" \
            "$RUNNER_TEMP/evidence/result.json" "$HOME/.claude/projects" "$RUNNER_TEMP/evidence" || true
          python3 -I "$GITHUB_WORKSPACE/worker/scripts/agent-worker/summary_md.py" \
            "$RUNNER_TEMP/evidence/result.json" "$RUNNER_TEMP/evidence" "$rc" || true
          echo "rc=$rc" >> "$GITHUB_ENV"

      # How the agent's last xc build and xc test ended, recorded by xc.sh. A failed or missing build, or failed tests,
      # send the task to Needs attention instead of a PR. Tests are optional, since not every change has one to run
      - name: Result
        id: result
        if: env.rc == '0'
        run: |
          s="$RUNNER_TEMP/xc-logs/status"
          failure=""
          if ! grep -qx "build=passed" "$s" 2> /dev/null; then failure="its last build failed or it never built"
          elif grep -qx "tests=failed" "$s"; then failure="its last test run failed"
          fi
          build=$(sed -n 's/^build=//p' "$s" 2> /dev/null); tests=$(sed -n 's/^tests=//p' "$s" 2> /dev/null)
          printf '\n## Build and tests\n\nFrom the last xc build and xc test the agent ran. Build: %s. Tests: %s.\n' \
            "${build:-not run}" "${tests:-not run}" >> "$RUNNER_TEMP/evidence/summary.md"
          { echo "ok=$([[ -z $failure ]] && echo true || echo false)"; echo "failure=$failure"; } | tee -a "$GITHUB_OUTPUT"

      - name: Export changes as a patch
        id: export
        if: env.rc == '0'
        working-directory: target
        run: |
          "$GITHUB_WORKSPACE/worker/scripts/agent-worker/export_patch.sh" "$RUNNER_TEMP/evidence"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Azure login again (GitHub OIDC)
        if: always() && steps.anthropic.outcome == 'success'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.ARTIFACTS_CLIENT_ID }}
          tenant-id: ${{ vars.ARTIFACTS_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Upload evidence to artifacts.go
        id: evidence
        if: always() && steps.anthropic.outcome == 'success'
        run: |
          set -euo pipefail
          # The run details go last in summary.md
          ev="$RUNNER_TEMP/evidence"
          if [[ -f "$ev/run-details.md" ]]; then cat "$ev/run-details.md" >> "$ev/summary.md" && rm "$ev/run-details.md"; fi
          url=$(worker/scripts/agent-worker/blobs.sh put "$ev" "$EVIDENCE_PREFIX")
          echo "Evidence (SSO): $url/"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "- Agent (SSO): [summary.md]($url/summary.md), [changes.patch]($url/changes.patch), [result.json]($url/result.json), [transcript.md]($url/transcript.md)" >> "$GITHUB_STEP_SUMMARY"
          # auto's evidence (decision log, proofs, screenshots) goes to <uuid>/ in the same container, where auto's
          # own viewer links point
          if [[ -n "${AUTO_DIR:-}" ]]; then
            log=$(worker/scripts/agent-worker/auto_evidence.sh "$HOME/.auto/evidence" "$RUNNER_TEMP/auto-evidence") || true
            if [[ -n $log ]]; then
              echo "decision_log_url=$log" >> "$GITHUB_OUTPUT"
              echo "- auto (SSO): [decision log]($log)" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Fail if the agent failed
        if: env.rc != '0'
        run: |
          echo "::error::claude exited with $rc"
          exit 1

  # Opens the PR once the agent's last build and tests passed, with no approval step. The agent-publish environment
  # holds the GitHub App key and must have no required reviewers. The patch comes from artifacts.go, never a public artifact
  publish:
    needs: agent
    if: needs.agent.outputs.changed == 'true' && needs.agent.outputs.ok == 'true'
    runs-on: ubuntu-latest
    environment: agent-publish
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    env:
      BRANCH: agent/worker-${{ github.run_id }}
    outputs:
      pr_url: ${{ steps.pr.outputs.url }}
    steps:
      # Pushes and PRs made with GITHUB_TOKEN don't start CI, so publish with the GitHub App when the
      # agent-publish environment has it, scoped to this repo
      - name: GitHub App token
        id: app-token
        if: vars.AGENT_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AGENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEFAULT_BRANCH }}
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Azure login (GitHub OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.ARTIFACTS_CLIENT_ID }}
          tenant-id: ${{ vars.ARTIFACTS_TENANT_ID }}
          allow-no-subscriptions: true

      # The worker's scripts, and the agent's title and description, or a fallback
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: worker
          sparse-checkout: scripts/agent-worker
          persist-credentials: false

      - name: Download patch from artifacts.go
        run: |
          set -euo pipefail
          worker/scripts/agent-worker/blobs.sh get "$RUNNER_TEMP" "$EVIDENCE_PREFIX" changes.patch pr.md
          [[ -s "$RUNNER_TEMP/changes.patch" ]] || { echo "::error::no patch"; exit 1; }

      - name: PR text
        env:
          TASK_GID: ${{ inputs.task_gid }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 -I worker/scripts/agent-worker/pr_text.py render "$RUNNER_TEMP/pr.md" "$RUNNER_TEMP" .github/PULL_REQUEST_TEMPLATE.md

      - name: Apply, commit, push
        run: |
          set -euo pipefail
          git switch -c "$BRANCH"
          git apply --index "$RUNNER_TEMP/changes.patch"
          if git diff --cached --name-only | grep -qE '^(\.github|scripts/agent-worker)/'; then
            echo "::error::patch touches .github/ or scripts/agent-worker/; refusing"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -F "$RUNNER_TEMP/title.txt"
          git push -q -u origin "$BRANCH"

      # Filled from the repo's PR template: the Asana link, the agent's sections and the run link
      - name: Open PR
        id: pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          set -euo pipefail
          gh pr create --base "$DEFAULT_BRANCH" --head "$BRANCH" \
            --title "$(cat "$RUNNER_TEMP/title.txt")" --body-file "$RUNNER_TEMP/body.md" \
            > "$RUNNER_TEMP/pr-url"
          echo "url=$(tail -n 1 "$RUNNER_TEMP/pr-url")" >> "$GITHUB_OUTPUT"

  # Sets the task's Agent Status from how the run ended: PR open with the PR link, or Needs attention. Acts as the Apple
  # Agent Asana App Actor, on a fresh runner so nothing the agent wrote runs next to it
  status:
    needs: [agent, publish]
    if: always()
    runs-on: ubuntu-latest
    environment: agent-worker
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: worker
          sparse-checkout: scripts/agent-worker
          persist-credentials: false

      - name: Set Agent Status
        env:
          ASANA_APP_CLIENT_ID: ${{ secrets.ASANA_APP_CLIENT_ID }}
          ASANA_APP_CLIENT_SECRET: ${{ secrets.ASANA_APP_CLIENT_SECRET }}
          ASANA_APP_REFRESH_TOKEN: ${{ secrets.ASANA_APP_REFRESH_TOKEN }}
          TASK_GID: ${{ inputs.task_gid }}
          AGENT: ${{ needs.agent.outputs.changed == 'true' && 'success' || 'failure' }}
          BUILD_OK: ${{ needs.agent.outputs.ok }}
          CANCELLED: ${{ needs.agent.result == 'cancelled' }}
          FAILURE: ${{ needs.agent.outputs.failure }}
          EVIDENCE_URL: ${{ needs.agent.outputs.evidence_url }}
          DECISION_LOG_URL: ${{ needs.agent.outputs.decision_log_url }}
          PUBLISH: ${{ needs.publish.result }}
          PR_URL: ${{ needs.publish.outputs.pr_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 -I worker/scripts/agent-worker/set_agent_status.py
