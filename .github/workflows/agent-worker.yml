name: Agent worker

# Agent worker: applies a plan from the apple-agent-orchestrator

on:
  workflow_dispatch:
    inputs:
      task_gid:
        description: "Asana task gid"
        required: true
        type: string
      handoff:
        description: "Handoff ID (a UUID, the handoff's prefix in the auto artifacts container)"
        required: true
        type: string
      sha256:
        description: "SHA-256 of the plan"
        required: true
        type: string
      auto_sha256:
        description: "SHA-256 of the auto plugin zip in the handoff"
        required: true
        type: string

permissions: {}

# One run per task at a time, so tasks under the WIP limit run side by side
concurrency:
  group: agent-worker-${{ inputs.task_gid }}
  cancel-in-progress: false

env:
  ARTIFACTS_ACCOUNT: ddgartifactsuse
  # Apple agent runs have their own container, since code the agent runs can use the artifacts identity. auto's
  # upload-evidence and viewer links use it through DDG_AUTO_EVIDENCE_CONTAINER
  ARTIFACTS_CONTAINER: apple-agent
  DDG_AUTO_EVIDENCE_CONTAINER: apple-agent
  # Inputs are checked in the agent job's first step before any of these paths are used. Storage is
  # create-only, so each run gets its own prefix
  PLAN_BLOB: ${{ inputs.handoff }}/plan.md
  AUTO_BLOB: ${{ inputs.handoff }}/auto-claude.zip
  AUTO_SHA256: ${{ inputs.auto_sha256 }}
  EVIDENCE_PREFIX: ${{ inputs.handoff }}/${{ github.repository }}/${{ github.run_id }}-${{ github.run_attempt }}
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  # Agent Status field and its option gids in the agent project
  STATUS_FIELD: "1220497931497848"
  STATUS_OPTIONS: '{"ready": "1220497931497849", "pr_open": "1220497931497852", "needs_attention": "1220497931497853"}'

jobs:
  agent:
    runs-on: ${{ fromJSON(vars.WORKER_RUNNER || '["image:osx-27-edge", "general-purpose"]') }}
    environment: agent-worker
    timeout-minutes: ${{ fromJSON(vars.WORKER_TIMEOUT_MINUTES || '300') }}
    permissions:
      contents: read
      id-token: write
    outputs:
      evidence_url: ${{ steps.evidence.outputs.url }}
      decision_log_url: ${{ steps.evidence.outputs.decision_log_url }}
      changed: ${{ steps.export.outputs.changed }}
      pr_urls: ${{ steps.audit.outputs.pr_urls }}
      audit_flags: ${{ steps.audit.outputs.flags }}
      tool_issues: ${{ steps.tools.outputs.issues }}
      ok: ${{ steps.result.outputs.ok }}
      failure: ${{ steps.result.outputs.failure }}
    steps:
      - name: Kill switch
        if: vars.AGENTS_ENABLED != 'true'
        run: |
          echo "::error::AGENTS_ENABLED is not 'true'"
          exit 1

      - name: Check inputs and branch
        env:
          TASK_GID: ${{ inputs.task_gid }}
          HANDOFF: ${{ inputs.handoff }}
          SHA256: ${{ inputs.sha256 }}
        run: |
          set -euo pipefail
          [[ "$TASK_GID" =~ ^[0-9]{1,20}$ ]] || { echo "::error::bad task_gid"; exit 1; }
          [[ "$HANDOFF" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]] || { echo "::error::bad handoff"; exit 1; }
          [[ "$SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::bad sha256"; exit 1; }
          [[ "$AUTO_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::bad auto_sha256"; exit 1; }
          [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]] ||
            { echo "::error::dispatch on the agent-worker branch, not $DEFAULT_BRANCH"; exit 1; }

      # The agent works on the default branch's code, whatever branch the workflow runs from
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEFAULT_BRANCH }}
          path: target
          submodules: recursive
          persist-credentials: false

      # The worker's own scripts, from this branch and outside the agent's writable checkout
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: worker
          sparse-checkout: scripts/agent-worker
          persist-credentials: false

      # Bitrise images don't ship the Azure CLI that azure/login and blobs.sh need
      - name: Install Azure CLI
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: command -v az > /dev/null || brew install azure-cli > /dev/null

      - name: Azure login (GitHub OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.ARTIFACTS_CLIENT_ID }}
          tenant-id: ${{ vars.ARTIFACTS_TENANT_ID }}
          allow-no-subscriptions: true

      # The plan goes to a file and is never printed. The az login is removed before the agent runs, so the
      # agent reaches storage only through auto's upload-evidence
      - name: Download plan from artifacts.go
        env:
          SHA256: ${{ inputs.sha256 }}
        run: worker/scripts/agent-worker/blobs.sh plan "$RUNNER_TEMP/plan.md" "$SHA256"

      # The orchestrator copies the pinned auto release here, since this runner can't reach where auto is released
      - name: Download auto plugin from artifacts.go
        run: worker/scripts/agent-worker/blobs.sh auto "$RUNNER_TEMP/auto-claude.zip" "$AUTO_SHA256"

      - name: Azure logout
        if: always()
        run: az logout > /dev/null 2>&1 || true; rm -rf "$HOME/.azure"

      # The agent builds and tests as it goes, so packages are resolved from main's manifests first, for
      # both apps, and the deploy key is removed before the agent runs
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY_DUCKSANS_FONT }}

      - name: Resolve packages
        working-directory: target
        run: |
          set -o pipefail
          for scheme in 'iOS Browser' 'macOS Browser'; do
            xcodebuild -resolvePackageDependencies -scheme "$scheme" -clonedSourcePackagesDirPath "$RUNNER_TEMP/packages" \
              -skipPackagePluginValidation -skipMacroValidation >> "$RUNNER_TEMP/resolve.log" 2>&1 && echo "resolved $scheme" || echo "resolve failed for $scheme"
          done

      - name: Remove the deploy key
        run: |
          ssh-add -D || true
          ssh-agent -k || true
          echo "SSH_AUTH_SOCK=" >> "$GITHUB_ENV"

      - name: Select iOS Simulator
        id: sim
        uses: ./target/.github/actions/select-ios-simulator
        with:
          preferred-versions: "27.0,26.2,26.1,26.0"

      - name: Install SwiftLint
        continue-on-error: true
        run: command -v swiftlint > /dev/null || brew install swiftlint > /dev/null

      # Unpacked outside the checkout and the agent's writable paths, so it can run auto's scripts but not change
      # them. auto's setup-deps installs its npm packages here, without install scripts, and marks them prepared,
      # which auto's evidence upload checks for
      - name: Set up auto plugin
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          set -euo pipefail
          node_major=$(node -p 'process.versions.node.split(".")[0]' 2>/dev/null || echo 0)
          [[ "$node_major" -ge 24 ]] || brew install node > /dev/null
          auto="$RUNNER_TEMP/auto"
          mkdir -p "$auto" "$RUNNER_TEMP/worktrees"
          unzip -q "$RUNNER_TEMP/auto-claude.zip" -d "$auto"
          node "$auto/skills/setup-auto/scripts/setup-deps.ts" --apply > /dev/null 2>&1 ||
            { echo "::error::auto's setup-deps failed"; exit 1; }
          echo "AUTO_DIR=$auto" >> "$GITHUB_ENV"
          echo "auto $(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$auto/.claude-plugin/plugin.json") ready"

      - name: Write prompt
        env:
          TASK_GID: ${{ inputs.task_gid }}
          SCRATCH: ${{ runner.temp }}/scratch
        run: |
          python3 -I worker/scripts/agent-worker/prompt.py "$GITHUB_WORKSPACE/target" "$RUNNER_TEMP/plan.md" \
            "$RUNNER_TEMP/worktrees" > "$RUNNER_TEMP/prompt.md"

      - name: Install Claude Code
        run: |
          set -euo pipefail
          curl -fsSL https://claude.ai/install.sh | bash -s stable > /dev/null
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Anthropic credentials (workload identity federation)
        id: anthropic
        env:
          RULE: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ORG: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          SERVICE_ACCOUNT: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          WORKSPACE: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
        run: |
          worker/scripts/agent-worker/anthropic_identity.sh "$RUNNER_TEMP/anthropic-identity"
          echo "identity-dir=$RUNNER_TEMP/anthropic-identity" >> "$GITHUB_OUTPUT"

      - name: GitHub token for the agent
        env:
          APP_CLIENT_ID: ${{ vars.AGENT_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          command -v gh > /dev/null || brew install gh > /dev/null
          worker/scripts/agent-worker/github_token.sh "$RUNNER_TEMP/gh"

      # For auto's upload-evidence, which writes the agent's evidence to auto's artifact storage as it publishes PRs
      - name: Azure identity for auto
        env:
          CLIENT_ID: ${{ vars.ARTIFACTS_CLIENT_ID }}
          TENANT_ID: ${{ vars.ARTIFACTS_TENANT_ID }}
        run: worker/scripts/agent-worker/azure_identity.sh "$RUNNER_TEMP/azure"

      # Besides file tools, the agent can run xc (build, test, lint) and read-only git, so it can check its
      # change and fix it as it goes. Building and testing runs code the agent wrote, which is why the worker
      # runs from the agent-worker branch
      - name: Run coding agent
        working-directory: target
        env:
          IDENTITY_DIR: ${{ steps.anthropic.outputs.identity-dir }}
          DEST: ${{ steps.sim.outputs.destination }}
          MAX_TURNS: ${{ vars.WORKER_MAX_TURNS || 250 }}
          MAX_BUDGET_USD: ${{ vars.WORKER_MAX_BUDGET_USD || 50 }}
        run: "$GITHUB_WORKSPACE/worker/scripts/agent-worker/run_agent.sh"

      - name: Export changes as a patch
        id: export
        if: env.rc == '0'
        working-directory: target
        run: |
          "$GITHUB_WORKSPACE/worker/scripts/agent-worker/export_patch.sh" "$RUNNER_TEMP/evidence"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # How the agent's last xc build and xc test ended, recorded by xc.sh, for the summary and the Asana comment. Tests
      # are optional, since not every change has one to run
      - name: Result
        id: result
        if: steps.export.outcome == 'success'
        run: |
          s="$RUNNER_TEMP/xc-logs/status"
          failure=""
          if ! grep -qx "build=passed" "$s" 2> /dev/null; then failure="its last build failed or it never built"
          elif grep -qx "tests=failed" "$s"; then failure="its last test run failed"
          fi
          build=$(sed -n 's/^build=//p' "$s" 2> /dev/null); tests=$(sed -n 's/^tests=//p' "$s" 2> /dev/null)
          ran=$(sed -n 's/^tests_run=//p' "$s" 2> /dev/null)
          printf '\n## Build and tests\n\nFrom the last xc build and xc test the agent ran. Build: %s. Tests: %s%s.\n' \
            "${build:-not run}" "${tests:-not run}" "${ran:+ (\`${ran// /\`, \`}\`)}" >> "$RUNNER_TEMP/evidence/summary.md"
          { echo "ok=$([[ -z $failure ]] && echo true || echo false)"; echo "failure=$failure"; } | tee -a "$GITHUB_OUTPUT"

      # Denied tool calls and failed GitHub, git and auto script calls, each with how to fix it, for the Asana comment
      - name: Tool report
        id: tools
        if: always() && steps.anthropic.outcome == 'success'
        env:
          CHECKOUT_DIR: ${{ github.workspace }}/target
        run: |
          python3 -I worker/scripts/agent-worker/tool_report.py \
            "$RUNNER_TEMP/evidence/result.json" "$HOME/.claude/projects" "$RUNNER_TEMP/evidence" || echo "issues=" >> "$GITHUB_OUTPUT"

      # Nobody reads the PR before it's public, so check what went out: links, attached images, .github/
      # changes and copied instructions. Findings go in the Asana comment
      - name: Check what the agent published
        id: audit
        if: always() && steps.anthropic.outcome == 'success'
        env:
          TASK_GID: ${{ inputs.task_gid }}
        run: |
          GH="$GH_TOKEN_DIR/bin/gh" \
          LEAK_CORPUS="$GITHUB_WORKSPACE/worker/scripts/agent-worker/prompts:$AUTO_DIR" \
            python3 -I worker/scripts/agent-worker/pr_audit.py "$RUNNER_TEMP/evidence" target/.github/PULL_REQUEST_TEMPLATE.md

      - name: Stop the GitHub token refresher
        if: always() && env.GH_TOKEN_DIR != ''
        run: |
          kill "$(cat "$GH_TOKEN_DIR/refresher.pid")" 2> /dev/null || true
          rm -rf "$GH_TOKEN_DIR"

      - name: Azure login again (GitHub OIDC)
        if: always() && steps.anthropic.outcome == 'success'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.ARTIFACTS_CLIENT_ID }}
          tenant-id: ${{ vars.ARTIFACTS_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Upload evidence to artifacts.go
        id: evidence
        if: always() && steps.anthropic.outcome == 'success'
        run: |
          set -euo pipefail
          # The run details go last in summary.md
          ev="$RUNNER_TEMP/evidence"
          if [[ -f "$ev/run-details.md" ]]; then cat "$ev/run-details.md" >> "$ev/summary.md" && rm "$ev/run-details.md"; fi
          url=$(worker/scripts/agent-worker/blobs.sh put "$ev" "$EVIDENCE_PREFIX")
          echo "Evidence (SSO): $url/"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "- Agent (SSO): [summary.md]($url/summary.md), [changes.patch]($url/changes.patch), [result.json]($url/result.json), [transcript.md]($url/transcript.md)" >> "$GITHUB_STEP_SUMMARY"
          # Whatever the agent didn't upload of auto's evidence (decision log, proofs, screenshots), with auto's
          # own upload, and the final decision log's link for the task
          log=$(worker/scripts/agent-worker/auto_evidence.sh "$HOME/.auto/evidence") || true
          if [[ -n $log ]]; then
            echo "decision_log_url=$log" >> "$GITHUB_OUTPUT"
            echo "- auto (SSO): [decision log]($log)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Stop the Azure token refresher
        if: always() && env.AZURE_TOKEN_DIR != ''
        run: |
          kill "$(cat "$AZURE_TOKEN_DIR/refresher.pid")" 2> /dev/null || true
          rm -rf "$AZURE_TOKEN_DIR"

      - name: Fail if the agent failed
        if: env.rc != '0'
        run: |
          echo "::error::claude exited with $rc"
          exit 1

  # Sets the task's Agent Status from how the run ended: PR open with the agent's PR links, or Needs attention. Acts as the Apple
  # Agent Asana App Actor, on a fresh runner so nothing the agent wrote runs next to it
  status:
    needs: agent
    if: always()
    runs-on: ubuntu-latest
    environment: agent-worker
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: worker
          sparse-checkout: scripts/agent-worker
          persist-credentials: false

      - name: Set Agent Status
        env:
          ASANA_APP_CLIENT_ID: ${{ secrets.ASANA_APP_CLIENT_ID }}
          ASANA_APP_CLIENT_SECRET: ${{ secrets.ASANA_APP_CLIENT_SECRET }}
          ASANA_APP_REFRESH_TOKEN: ${{ secrets.ASANA_APP_REFRESH_TOKEN }}
          TASK_GID: ${{ inputs.task_gid }}
          AGENT: ${{ needs.agent.outputs.changed == 'true' && 'success' || 'failure' }}
          BUILD_OK: ${{ needs.agent.outputs.ok }}
          CANCELLED: ${{ needs.agent.result == 'cancelled' }}
          FAILURE: ${{ needs.agent.outputs.failure }}
          EVIDENCE_URL: ${{ needs.agent.outputs.evidence_url }}
          DECISION_LOG_URL: ${{ needs.agent.outputs.decision_log_url }}
          PR_URLS: ${{ needs.agent.outputs.pr_urls }}
          AUDIT_FLAGS: ${{ needs.agent.outputs.audit_flags }}
          TOOL_ISSUES: ${{ needs.agent.outputs.tool_issues }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 -I worker/scripts/agent-worker/set_agent_status.py
