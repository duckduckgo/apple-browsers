allow_zero_lintable_files: true

disabled_rules:
  - no_space_in_method_call
  - multiple_closures_with_trailing_closure
  - block_based_kvo
  - compiler_protocol_init
  - unused_setter_value
  - line_length
  - type_name
  - implicit_getter
  - trailing_comma
  - nesting
  - opening_brace
  - function_parameter_count
  - function_body_length
  - file_length
  - type_body_length
  - static_over_final_class
  - non_optional_string_data_conversion
  - mark
  - redundant_sendable

opt_in_rules:
  - file_header
  - closure_spacing

custom_rules:
  explicit_non_final_class:
    name: "Implicitly non-final class"
    included: ".*\\.swift"
    excluded: "iOS/.*"
    regex: "^\\s*(class) (?!func|var)"
    capture_group: 0
    match_kinds:
      - keyword
    message: "Classes should be `final` by default, use explicit `internal` or `public` for non-final classes."
    severity: error

  wknserror_webkit_calls:
    name: "WebKit Web Extension call that throws WKNSError proxies"
    included: ".*\\.swift"
    excluded:
      - ".*/WKWebExtension\\+CopyingErrors\\.swift"
      - ".*/[A-Za-z]*Tests/.*"
      - ".*Tests\\.swift"
    regex: "WKWebExtension(\\.init)?\\((resourceBaseURL|appExtensionBundle):|\\.loadBackgroundContent\\b|[cC]ontroller\\??\\.(load|unload)\\b"
    excluded_match_kinds:
      - comment
      - doccomment
      - string
    message: "WebKit throws WKNSError proxies from this API, which crash on x86_64 when bridged to Swift Error. Use WebExtensionManager in app code, or the wrappers in WKWebExtension+CopyingErrors.swift in the WebExtensions package."
    severity: error

analyzer_rules: # Rules run by `swiftlint analyze`
  - explicit_self

# Rule Config
cyclomatic_complexity:
  ignores_case_statements: true
identifier_name:
  min_length: 1
  max_length: 1000
large_tuple:
  warning: 4
  error: 5
todo:
  severity: warning
file_header:
  required_pattern: |
                    \/\/
                    \/\/  SWIFTLINT_CURRENT_FILENAME
                    \/\/
                    \/\/  Copyright © \d{4} DuckDuckGo\. All rights reserved\.
