name: iOS - Duck Player CI diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the failed Maestro upload
        env:
          MAESTRO_API_KEY: ${{ secrets.ROBIN_API_KEY }}
          PROJECT_ID: ${{ vars.ROBIN_PROJECT_KEY }}
          GH_TOKEN: unused
          GH_ENTERPRISE_TOKEN: unused
        run: |
          mkdir diagnostics
          gh api --hostname api.copilot.mobile.dev --method GET \
            --header "Authorization: Bearer $MAESTRO_API_KEY" \
            --header "Accept: application/json" \
            "https://api.copilot.mobile.dev/v2/project/$PROJECT_ID/upload/mupload_01m7nmc5hdetbbhh0t5dxr0tzj" \
            > diagnostics/upload.json
          jq -r '.flows[] | select(.status != "SUCCESS") | .runId // empty' \
            diagnostics/upload.json > diagnostics/failed-runs.txt
          test -s diagnostics/failed-runs.txt
          while read -r run_id; do
            gh api --hostname api.copilot.mobile.dev --method GET \
              --header "Authorization: Bearer $MAESTRO_API_KEY" \
              --header "Accept: application/json" \
              "https://api.copilot.mobile.dev/v2/runs/$run_id?includeArchive=true" \
              > run.json
            archive_url=$(jq -er '.artifacts[] | select(.type == "artifactsArchive") | .url' run.json)
            curl --fail --silent --show-error "$archive_url" \
              --output "diagnostics/$run_id.zip"
            jq 'del(.artifacts[].url)' run.json > "diagnostics/$run_id.json"
          done < diagnostics/failed-runs.txt

      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: duckplayer-ci-diagnostics
          path: diagnostics/
          retention-days: 3
