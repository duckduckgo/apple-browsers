appId: com.duckduckgo.mobile.ios
tags:
    - iphone
    - securityTest
---

# Set up 
- runFlow: 
    file: ../shared/setup.yaml

# Load Site
- assertVisible:
    id: "searchEntry"
- tapOn: 
    id: "searchEntry"
- inputText: "https://privacy-test-pages.site/security/address-bar-spoofing/spoof-js-page-rewrite.html"
- pressKey: Enter

# Test
- tapOn: "Start"
# Now check the address bar hasn't been updated too early resulting in spoofed content
# Wait for the address bar to settle before reading it; copying too early reads a transient value and flakes (mirrors flows 2 & 6).
- extendedWaitUntil:
    visible:
        id: "searchEntry"
        text: "privacy-test-pages.site"
    timeout: 10000
- copyTextFrom:
    id: "searchEntry"
- assertTrue: ${maestro.copiedText == "privacy-test-pages.site"}
