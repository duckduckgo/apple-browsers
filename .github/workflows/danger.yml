name: Shared - Danger JS
on:
  pull_request:
    types: [labeled, unlabeled, opened, reopened, edited, synchronize, ready_for_review]

jobs:
  danger:
    name: Danger JS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24.14.1
      - name: Danger
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx --yes -p danger@13.0.4 -p typescript@6 -- \
            danger ci --dangerfile duckduckgo/danger-settings/org/allPRs.ts@fcappelli/ddgerror-conformance-warning
