name: Agent worker

# Agent worker: applies a plan from the apple-agent-orchestrator and opens a PR ready for review after a person approves

on:
  workflow_dispatch:
    inputs:
      task_gid:
        description: "Asana task gid"
        required: true
        type: string
      handoff:
        description: "Handoff ID (a UUID, the handoff's prefix in the auto artifacts container)"
        required: true
        type: string
      sha256:
        description: "SHA-256 of the plan"
        required: true
        type: string

permissions: {}

# One run per task at a time, so tasks under the WIP limit run side by side
concurrency:
  group: agent-worker-${{ inputs.task_gid }}
  cancel-in-progress: false

env:
  ARTIFACTS_ACCOUNT: ddgartifactsuse
  ARTIFACTS_CONTAINER: auto
  # Inputs are checked in the agent job's first step before any of these paths are used. Storage is
  # create-only, so each run gets its own prefix
  PLAN_BLOB: ${{ inputs.handoff }}/plan.md
  HANDOFF_PREFIX: ${{ inputs.handoff }}
  EVIDENCE_PREFIX: ${{ inputs.handoff }}/${{ github.repository }}/${{ github.run_id }}-${{ github.run_attempt }}
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  # Agent Status field and its option gids in the agent project
  STATUS_FIELD: "1220497931497848"
  STATUS_OPTIONS: '{"ready": "1220497931497849", "waiting_for_approval": "1220497931497851", "pr_open": "1220497931497852", "needs_attention": "1220497931497853"}'

jobs:
  agent:
    runs-on: ${{ fromJSON(vars.WORKER_RUNNER || '["image:osx-27-edge", "general-purpose"]') }}
    environment: agent-worker
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
    outputs:
      evidence_url: ${{ steps.evidence.outputs.url }}
      changed: ${{ steps.export.outputs.changed }}
    steps:
      - name: Kill switch
        if: vars.AGENTS_ENABLED != 'true'
        run: |
          echo "::error::AGENTS_ENABLED is not 'true'"
          exit 1

      - name: Check inputs and branch
        env:
          TASK_GID: ${{ inputs.task_gid }}
          HANDOFF: ${{ inputs.handoff }}
          SHA256: ${{ inputs.sha256 }}
        run: |
          set -euo pipefail
          [[ "$TASK_GID" =~ ^[0-9]{1,20}$ ]] || { echo "::error::bad task_gid"; exit 1; }
          [[ "$HANDOFF" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]] || { echo "::error::bad handoff"; exit 1; }
          [[ "$SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::bad sha256"; exit 1; }
          [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]] ||
            { echo "::error::dispatch on the agent-worker branch, not $DEFAULT_BRANCH"; exit 1; }

      # The agent works on the default branch's code, whatever branch the workflow runs from
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEFAULT_BRANCH }}
          path: target
          submodules: recursive
          persist-credentials: false

      # The worker's own scripts, from this branch and outside the agent's writable checkout
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: worker
          sparse-checkout: scripts/agent-worker
          persist-credentials: false

      - name: Azure login (GitHub OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.ARTIFACTS_CLIENT_ID }}
          tenant-id: ${{ vars.ARTIFACTS_TENANT_ID }}
          allow-no-subscriptions: true

      # The plan goes to a file and is never printed. The Azure login is removed before the agent
      # runs, so the agent never has a storage token
      - name: Download plan from artifacts.go
        env:
          SHA256: ${{ inputs.sha256 }}
        run: worker/scripts/agent-worker/blobs.sh plan "$RUNNER_TEMP/plan.md" "$SHA256"

      - name: Azure logout
        if: always()
        run: az logout > /dev/null 2>&1 || true; rm -rf "$HOME/.azure"

      # The agent builds and tests as it goes, so packages are resolved from main's manifests first, for
      # both apps, and the deploy key is removed before the agent runs
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY_DUCKSANS_FONT }}

      - name: Resolve packages
        working-directory: target
        run: |
          set -o pipefail
          for scheme in 'iOS Browser' 'macOS Browser'; do
            xcodebuild -resolvePackageDependencies -scheme "$scheme" -clonedSourcePackagesDirPath "$RUNNER_TEMP/packages" \
              -skipPackagePluginValidation -skipMacroValidation >> "$RUNNER_TEMP/resolve.log" 2>&1 && echo "resolved $scheme" || echo "resolve failed for $scheme"
          done

      - name: Remove the deploy key
        run: |
          ssh-add -D || true
          ssh-agent -k || true
          echo "SSH_AUTH_SOCK=" >> "$GITHUB_ENV"

      - name: Select iOS Simulator
        id: sim
        uses: ./target/.github/actions/select-ios-simulator
        with:
          preferred-versions: "27.0,26.2,26.1,26.0"

      - name: Install SwiftLint
        continue-on-error: true
        run: command -v swiftlint > /dev/null || brew install swiftlint > /dev/null

      - name: Write prompt
        run: |
          python3 -I worker/scripts/agent-worker/prompt.py "$GITHUB_WORKSPACE/target" "$RUNNER_TEMP/plan.md" > "$RUNNER_TEMP/prompt.md"

      - name: Install Claude Code
        run: |
          set -euo pipefail
          curl -fsSL https://claude.ai/install.sh | bash -s stable > /dev/null
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Anthropic credentials (workload identity federation)
        id: anthropic
        env:
          RULE: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ORG: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          SERVICE_ACCOUNT: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          WORKSPACE: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
        run: |
          worker/scripts/agent-worker/anthropic_identity.sh "$RUNNER_TEMP/anthropic-identity"
          echo "identity-dir=$RUNNER_TEMP/anthropic-identity" >> "$GITHUB_OUTPUT"

      # Besides file tools, the agent can run xc (build, test, lint) and read-only git, so it can check its
      # change and fix it as it goes. Building and testing runs code the agent wrote, which is why the worker
      # runs from the agent-worker branch (Security Triage MM1) and holds no Azure login while the agent runs
      - name: Run coding agent
        working-directory: target
        env:
          IDENTITY_DIR: ${{ steps.anthropic.outputs.identity-dir }}
          DEST: ${{ steps.sim.outputs.destination }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence" "$RUNNER_TEMP/bin"
          ln -sf "$GITHUB_WORKSPACE/worker/scripts/agent-worker/xc.sh" "$RUNNER_TEMP/bin/xc"
          git_ro="Bash(git log:*),Bash(git show:*),Bash(git blame:*),Bash(git diff:*),Bash(git status:*),Bash(git grep:*)"
          rc=0
          env -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u SSH_AUTH_SOCK \
            PATH="$RUNNER_TEMP/bin:$PATH" PACKAGES="$RUNNER_TEMP/packages" \
            XC_DERIVED="$RUNNER_TEMP/derived" XC_LOGS="$RUNNER_TEMP/xc-logs" \
            BASH_DEFAULT_TIMEOUT_MS=2700000 BASH_MAX_TIMEOUT_MS=2700000 \
            claude -p "$(cat "$RUNNER_TEMP/prompt.md")" \
              --permission-mode dontAsk \
              --allowedTools "Read,Glob,Grep,Edit(./**),Write(./**),Bash(xc:*),$git_ro" \
              --disallowedTools "WebFetch,WebSearch,Read(/$IDENTITY_DIR/**),Read(~/.azure/**),Read(//proc/**)" \
              --model opus --max-turns 150 --max-budget-usd 30 --output-format json \
              > "$RUNNER_TEMP/evidence/result.json" 2> "$RUNNER_TEMP/evidence/claude.err" || rc=$?
          python3 -I "$GITHUB_WORKSPACE/worker/scripts/agent-worker/summary_md.py" \
            "$RUNNER_TEMP/evidence/result.json" "$RUNNER_TEMP/evidence" "$rc" || true
          echo "rc=$rc" >> "$GITHUB_ENV"

      - name: Export changes as a patch
        id: export
        if: env.rc == '0'
        working-directory: target
        run: |
          "$GITHUB_WORKSPACE/worker/scripts/agent-worker/export_patch.sh" "$RUNNER_TEMP/evidence"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Azure login again (GitHub OIDC)
        if: always() && steps.anthropic.outcome == 'success'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.ARTIFACTS_CLIENT_ID }}
          tenant-id: ${{ vars.ARTIFACTS_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Upload evidence to artifacts.go
        id: evidence
        if: always() && steps.anthropic.outcome == 'success'
        run: |
          set -euo pipefail
          # The run details go last in summary.md
          ev="$RUNNER_TEMP/evidence"
          if [[ -f "$ev/run-details.md" ]]; then cat "$ev/run-details.md" >> "$ev/summary.md" && rm "$ev/run-details.md"; fi
          url=$(worker/scripts/agent-worker/blobs.sh put "$ev" "$EVIDENCE_PREFIX")
          echo "Evidence (SSO): $url/"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "- Agent (SSO): [summary.md]($url/summary.md), [changes.patch]($url/changes.patch), [result.json]($url/result.json)" >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if the agent failed
        if: env.rc != '0'
        run: |
          echo "::error::claude exited with $rc"
          exit 1

  # Builds the patch again on a fresh runner the agent's code never ran on, runs the agent's tests and records
  # its Maestro flow, so approval rests on results the agent couldn't change. Results go to
  # evidence for the approver. A failed build or failed tests set ok=false, which sends the task to
  # Needs attention instead of approval. The Maestro flow is evidence only and never blocks. The Azure login is only held before and after the build, never while the agent's code runs
  verify:
    needs: agent
    if: needs.agent.result == 'success'
    runs-on: ${{ fromJSON(vars.WORKER_RUNNER || '["image:osx-27-edge", "general-purpose"]') }}
    environment: agent-worker
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    outputs:
      url: ${{ steps.upload.outputs.url }}
      ok: ${{ steps.result.outputs.ok }}
      failure: ${{ steps.result.outputs.failure }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEFAULT_BRANCH }}
          path: target
          submodules: recursive
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: worker
          sparse-checkout: scripts/agent-worker
          persist-credentials: false

      - name: Azure login (GitHub OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.ARTIFACTS_CLIENT_ID }}
          tenant-id: ${{ vars.ARTIFACTS_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Download patch and evidence plan
        run: |
          set -euo pipefail
          echo "VERIFY_URL=https://artifacts.go.duckduckgo.com/view/$ARTIFACTS_CONTAINER/$EVIDENCE_PREFIX/verify" >> "$GITHUB_ENV"
          worker/scripts/agent-worker/blobs.sh get "$RUNNER_TEMP/plan" "$EVIDENCE_PREFIX" \
            changes.patch tests.txt flow.yaml excluded.txt result.json pr.md plan-notes.txt
          worker/scripts/agent-worker/blobs.sh get "$RUNNER_TEMP/plan" "$HANDOFF_PREFIX" plan-stats.json
          [[ -s "$RUNNER_TEMP/plan/changes.patch" ]] || { echo "::error::no patch"; exit 1; }

      - name: Azure logout
        if: always()
        run: az logout > /dev/null 2>&1 || true; rm -rf "$HOME/.azure"

      # From main's manifests, before the patch is applied, and the key is removed before any agent code runs
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY_DUCKSANS_FONT }}

      - name: Resolve packages
        working-directory: target
        run: |
          set -o pipefail
          for scheme in 'iOS Browser' 'macOS Browser'; do
            xcodebuild -resolvePackageDependencies -scheme "$scheme" -clonedSourcePackagesDirPath "$RUNNER_TEMP/packages" \
              -skipPackagePluginValidation -skipMacroValidation >> "$RUNNER_TEMP/resolve.log" 2>&1 && echo "resolved $scheme" || echo "resolve failed for $scheme"
          done

      - name: Remove the deploy key
        run: |
          ssh-add -D || true
          ssh-agent -k || true
          echo "SSH_AUTH_SOCK=" >> "$GITHUB_ENV"

      - name: Select iOS Simulator
        id: sim
        uses: ./target/.github/actions/select-ios-simulator
        with:
          preferred-versions: "27.0,26.2,26.1,26.0"

      - name: Install Maestro and ffmpeg
        continue-on-error: true
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash > /dev/null
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          command -v ffmpeg > /dev/null || brew install ffmpeg > /dev/null

      - name: Apply patch
        working-directory: target
        run: git apply --index "$RUNNER_TEMP/plan/changes.patch"

      # The agent's code runs from here, without the OIDC request variables
      - name: Build, test and record
        continue-on-error: true
        env:
          DEST: ${{ steps.sim.outputs.destination }}
          IOS_VERSION: ${{ steps.sim.outputs.ios-version }}
        run: |
          env -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_ID_TOKEN_REQUEST_TOKEN PACKAGES="$RUNNER_TEMP/packages" \
            bash "$GITHUB_WORKSPACE/worker/scripts/agent-worker/verify.sh" "$GITHUB_WORKSPACE/target" "$RUNNER_TEMP/plan" "$RUNNER_TEMP/verify"

      - name: Write verify.md
        if: always()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TASK_GID: ${{ inputs.task_gid }}
        run: |
          mkdir -p "$RUNNER_TEMP/verify"
          EVIDENCE_URL="https://artifacts.go.duckduckgo.com/view/$ARTIFACTS_CONTAINER/$EVIDENCE_PREFIX" \
            python3 -I "$GITHUB_WORKSPACE/worker/scripts/agent-worker/verify_md.py" "$RUNNER_TEMP/plan" "$RUNNER_TEMP/verify"

      # ok=false sends the task to Needs attention, and failure says why in the Asana comment. A failed
      # Maestro flow shows on the verify page for the approver but doesn't set ok=false
      - name: Result
        id: result
        if: always()
        run: |
          s="$RUNNER_TEMP/verify/status"
          failure=""
          if ! grep -qxE "build=yes" "$s" 2> /dev/null; then failure="the build failed"
          elif grep -qx "tests=failed" "$s"; then failure="the tests failed"
          fi
          { echo "ok=$([[ -z $failure ]] && echo true || echo false)"; echo "failure=$failure"; } | tee -a "$GITHUB_OUTPUT"

      - name: Azure login again (GitHub OIDC)
        if: always()
        uses: azure/login@v3
        with:
          client-id: ${{ vars.ARTIFACTS_CLIENT_ID }}
          tenant-id: ${{ vars.ARTIFACTS_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Upload results to artifacts.go
        id: upload
        if: always()
        run: |
          set -euo pipefail
          [[ -d "$RUNNER_TEMP/verify" ]] || { echo "nothing to upload"; exit 0; }
          worker/scripts/agent-worker/blobs.sh put "$RUNNER_TEMP/verify" "$EVIDENCE_PREFIX/verify" > /dev/null
          echo "url=$VERIFY_URL" >> "$GITHUB_OUTPUT"
          echo "- Results (SSO): [verify.md]($VERIFY_URL/verify.md)" >> "$GITHUB_STEP_SUMMARY"

      - name: Azure logout
        if: always()
        run: az logout > /dev/null 2>&1 || true; rm -rf "$HOME/.azure"

  # Moves the Asana task to Waiting for approval, with the evidence links and what to click to approve
  approval-request:
    needs: [agent, verify]
    if: needs.verify.outputs.ok == 'true'
    runs-on: ubuntu-latest
    environment: agent-worker
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: worker
          sparse-checkout: scripts/agent-worker
          persist-credentials: false

      - name: Set Agent Status to Waiting for approval
        env:
          ASANA_APP_CLIENT_ID: ${{ secrets.ASANA_APP_CLIENT_ID }}
          ASANA_APP_CLIENT_SECRET: ${{ secrets.ASANA_APP_CLIENT_SECRET }}
          ASANA_APP_REFRESH_TOKEN: ${{ secrets.ASANA_APP_REFRESH_TOKEN }}
          TASK_GID: ${{ inputs.task_gid }}
          STAGE: approval
          EVIDENCE_URL: ${{ needs.agent.outputs.evidence_url }}
          VERIFY_URL: ${{ needs.verify.outputs.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 -I worker/scripts/agent-worker/set_agent_status.py

  # A person reviews the evidence and approves the agent-publish environment before anything in
  # this public repo is created. The patch comes from artifacts.go, never a public artifact
  publish:
    needs: [agent, verify]
    if: needs.verify.outputs.ok == 'true'
    runs-on: ubuntu-latest
    environment: agent-publish
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    env:
      BRANCH: agent/worker-${{ github.run_id }}
    outputs:
      pr_url: ${{ steps.pr.outputs.url }}
    steps:
      # Pushes and PRs made with GITHUB_TOKEN don't start CI, so publish with the GitHub App when the
      # agent-publish environment has it, scoped to this repo
      - name: GitHub App token
        id: app-token
        if: vars.AGENT_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AGENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEFAULT_BRANCH }}
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Azure login (GitHub OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.ARTIFACTS_CLIENT_ID }}
          tenant-id: ${{ vars.ARTIFACTS_TENANT_ID }}
          allow-no-subscriptions: true

      # The worker's scripts, and the agent's title and description as the approver saw them, or a fallback
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: worker
          sparse-checkout: scripts/agent-worker
          persist-credentials: false

      - name: Download patch from artifacts.go
        run: |
          set -euo pipefail
          worker/scripts/agent-worker/blobs.sh get "$RUNNER_TEMP" "$EVIDENCE_PREFIX" changes.patch pr.md
          [[ -s "$RUNNER_TEMP/changes.patch" ]] || { echo "::error::no patch"; exit 1; }

      - name: PR text
        env:
          TASK_GID: ${{ inputs.task_gid }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 -I worker/scripts/agent-worker/pr_text.py render "$RUNNER_TEMP/pr.md" "$RUNNER_TEMP"

      - name: Apply, commit, push
        run: |
          set -euo pipefail
          git switch -c "$BRANCH"
          git apply --index "$RUNNER_TEMP/changes.patch"
          if git diff --cached --name-only | grep -qE '^(\.github|scripts/agent-worker)/'; then
            echo "::error::patch touches .github/ or scripts/agent-worker/; refusing"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -F "$RUNNER_TEMP/title.txt"
          git push -q -u origin "$BRANCH"

      # In the repo's PR template shape: the Asana link, the agent's description and the run link
      - name: Open PR
        id: pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          set -euo pipefail
          gh pr create --base "$DEFAULT_BRANCH" --head "$BRANCH" \
            --title "$(cat "$RUNNER_TEMP/title.txt")" --body-file "$RUNNER_TEMP/body.md" \
            > "$RUNNER_TEMP/pr-url"
          echo "url=$(tail -n 1 "$RUNNER_TEMP/pr-url")" >> "$GITHUB_OUTPUT"

  # Sets the task's Agent Status from how the run ended: PR open with the PR link, or Needs attention. Acts as the Apple
  # Agent Asana App Actor, on a fresh runner so nothing the agent wrote runs next to it
  status:
    needs: [agent, verify, publish]
    if: always()
    runs-on: ubuntu-latest
    environment: agent-worker
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: worker
          sparse-checkout: scripts/agent-worker
          persist-credentials: false

      - name: Set Agent Status
        env:
          ASANA_APP_CLIENT_ID: ${{ secrets.ASANA_APP_CLIENT_ID }}
          ASANA_APP_CLIENT_SECRET: ${{ secrets.ASANA_APP_CLIENT_SECRET }}
          ASANA_APP_REFRESH_TOKEN: ${{ secrets.ASANA_APP_REFRESH_TOKEN }}
          TASK_GID: ${{ inputs.task_gid }}
          AGENT: ${{ needs.agent.outputs.changed == 'true' && 'success' || 'failure' }}
          VERIFY_OK: ${{ needs.verify.outputs.ok }}
          CANCELLED: ${{ needs.agent.result == 'cancelled' || needs.verify.result == 'cancelled' }}
          FAILURE: ${{ needs.verify.outputs.failure }}
          EVIDENCE_URL: ${{ needs.agent.outputs.evidence_url }}
          PUBLISH: ${{ needs.publish.result }}
          PR_URL: ${{ needs.publish.outputs.pr_url }}
          VERIFY_URL: ${{ needs.verify.outputs.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 -I worker/scripts/agent-worker/set_agent_status.py
