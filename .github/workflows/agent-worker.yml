name: Agent worker

# Agent worker: applies a plan from the apple-agent-orchestrator and opens a draft PR after a person approves

on:
  workflow_dispatch:
    inputs:
      task_gid:
        description: "Asana task gid"
        required: true
        type: string
      handoff:
        description: "Handoff ID (a UUID, the handoff's prefix in the auto artifacts container)"
        required: true
        type: string
      sha256:
        description: "SHA-256 of the plan"
        required: true
        type: string

permissions: {}

concurrency:
  group: agent-worker
  cancel-in-progress: false

env:
  ARTIFACTS_ACCOUNT: ddgartifactsuse
  ARTIFACTS_CONTAINER: auto
  # Inputs are checked in the first step before any of these paths are used
  PLAN_BLOB: ${{ inputs.handoff }}/plan.md
  # Create-only storage, so each attempt gets its own prefix
  EVIDENCE_PREFIX: ${{ inputs.handoff }}/${{ github.repository }}/${{ github.run_id }}-${{ github.run_attempt }}
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  # Agent Status field and its option gids in the agent project
  STATUS_FIELD: "1220497931497848"
  STATUS_OPTIONS: '{"waiting_for_approval": "1220497931497851", "pr_open": "1220497931497852", "needs_attention": "1220497931497853"}'

jobs:
  agent:
    runs-on: ${{ fromJSON(vars.WORKER_RUNNER || '["image:osx-27-edge", "general-purpose"]') }}
    environment: agent-worker
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    outputs:
      evidence_url: ${{ steps.evidence.outputs.url }}
    steps:
      - name: Kill switch
        if: vars.AGENTS_ENABLED != 'true'
        run: |
          echo "::error::AGENTS_ENABLED is not 'true'"
          exit 1

      - name: Check inputs and branch
        env:
          TASK_GID: ${{ inputs.task_gid }}
          HANDOFF: ${{ inputs.handoff }}
          SHA256: ${{ inputs.sha256 }}
        run: |
          set -euo pipefail
          [[ "$TASK_GID" =~ ^[0-9]{1,20}$ ]] || { echo "::error::bad task_gid"; exit 1; }
          [[ "$HANDOFF" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]] || { echo "::error::bad handoff"; exit 1; }
          [[ "$SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::bad sha256"; exit 1; }
          [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]] ||
            { echo "::error::dispatch on the agent-worker branch, not $DEFAULT_BRANCH"; exit 1; }

      # The agent works on the default branch's code, whatever branch the workflow runs from
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEFAULT_BRANCH }}
          path: target
          persist-credentials: false

      # The worker's own scripts, from this branch and outside the agent's writable checkout
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: worker
          sparse-checkout: scripts/agent-worker
          persist-credentials: false

      - name: Azure login (GitHub OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.ARTIFACTS_CLIENT_ID }}
          tenant-id: ${{ vars.ARTIFACTS_TENANT_ID }}
          allow-no-subscriptions: true

      # The plan goes to a file and is never printed. The Azure login is removed before the agent
      # runs, so the agent never has a storage token
      - name: Download plan from artifacts.go
        env:
          SHA256: ${{ inputs.sha256 }}
        run: |
          set -euo pipefail
          size=$(az storage blob show --auth-mode login --only-show-errors \
            --account-name "$ARTIFACTS_ACCOUNT" --container-name "$ARTIFACTS_CONTAINER" \
            --name "$PLAN_BLOB" --query properties.contentLength -o tsv)
          [[ "$size" =~ ^[0-9]+$ && "$size" -gt 0 && "$size" -le 200000 ]] ||
            { echo "::error::plan is missing, empty or too large"; exit 1; }
          az storage blob download --auth-mode login --only-show-errors \
            --account-name "$ARTIFACTS_ACCOUNT" --container-name "$ARTIFACTS_CONTAINER" \
            --name "$PLAN_BLOB" --file "$RUNNER_TEMP/plan.md" > /dev/null
          echo "$SHA256  $RUNNER_TEMP/plan.md" | shasum -a 256 -c --status ||
            { echo "::error::plan hash does not match; refusing to run"; exit 1; }
          echo "plan downloaded and verified ($(wc -c < "$RUNNER_TEMP/plan.md") bytes)"

      - name: Azure logout
        if: always()
        run: az logout > /dev/null 2>&1 || true; rm -rf "$HOME/.azure"

      - name: Write prompt
        run: |
          set -euo pipefail
          {
            echo "The repository to change is checked out at $GITHUB_WORKSPACE/target. Make all changes there."
            echo "Follow the plan below. Do not copy the plan, task details or links into code, comments or files."
            echo "You run unattended and nobody can answer questions. If the plan is ambiguous, make the smallest"
            echo "change consistent with it and finish. You only have file tools: building, testing, committing and"
            echo "opening the PR happen after you, so don't plan for them."
            echo
            echo "When you're done, write .agent-pr.md at the repository root for the pull request, which is public:"
            echo "the first line is the title, starting with 'iOS: ' or 'macOS: ' and saying what the change does,"
            echo "then a blank line and 2 to 4 bullets on what changed and why. Describe only the code. No links,"
            echo "crash counts, versions, user data, or anything from Asana or Sentry."
            echo
            cat "$RUNNER_TEMP/plan.md"
          } > "$RUNNER_TEMP/prompt.md"

      - name: Install Claude Code
        run: |
          set -euo pipefail
          curl -fsSL https://claude.ai/install.sh | bash -s stable > /dev/null
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Anthropic credentials (workload identity federation)
        id: anthropic
        env:
          RULE: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ORG: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          SERVICE_ACCOUNT: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          WORKSPACE: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/anthropic-identity"
          mkdir -p "$dir" && chmod 0700 "$dir"
          fetch() {
            curl -fsS --retry 3 --retry-all-errors -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" |
              python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' > "$dir/token.tmp" &&
              mv "$dir/token.tmp" "$dir/token"
          }
          fetch
          (while sleep 60; do fetch || true; done) > /dev/null 2>&1 &
          {
            echo "ANTHROPIC_FEDERATION_RULE_ID=$RULE"
            echo "ANTHROPIC_ORGANIZATION_ID=$ORG"
            echo "ANTHROPIC_SERVICE_ACCOUNT_ID=$SERVICE_ACCOUNT"
            if [ -n "$WORKSPACE" ]; then echo "ANTHROPIC_WORKSPACE_ID=$WORKSPACE"; fi
            echo "ANTHROPIC_IDENTITY_TOKEN_FILE=$dir/token"
          } >> "$GITHUB_ENV"
          echo "identity-dir=$dir" >> "$GITHUB_OUTPUT"

      # Write and Edit are limited to the checkout, so the agent can't change actions or tools that
      # later steps run. It can't read the identity token, Azure CLI state or other processes'
      # environments either. Output goes to files only. The log gets the exit code, turn count and cost
      - name: Run coding agent
        working-directory: target
        env:
          IDENTITY_DIR: ${{ steps.anthropic.outputs.identity-dir }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          rc=0
          env -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            claude -p "$(cat "$RUNNER_TEMP/prompt.md")" \
              --permission-mode dontAsk \
              --allowedTools "Read,Glob,Grep,Edit(./**),Write(./**)" \
              --disallowedTools "Bash,WebFetch,WebSearch,Read(/$IDENTITY_DIR/**),Read(~/.azure/**),Read(//proc/**)" \
              --max-turns 50 --output-format json \
              > "$RUNNER_TEMP/evidence/result.json" 2> "$RUNNER_TEMP/evidence/claude.err" || rc=$?
          python3 -I "$GITHUB_WORKSPACE/worker/scripts/agent-worker/summary_md.py" \
            "$RUNNER_TEMP/evidence/result.json" "$RUNNER_TEMP/evidence" "$rc" || true
          echo "rc=$rc" >> "$GITHUB_ENV"

      - name: Export changes as a patch
        if: env.rc == '0'
        working-directory: target
        run: |
          set -euo pipefail
          # The PR text goes to evidence for the approver, never into the patch
          python3 -I "$GITHUB_WORKSPACE/worker/scripts/agent-worker/pr_text.py" extract . "$RUNNER_TEMP/evidence"
          git add -A
          git diff --cached --binary > "$RUNNER_TEMP/evidence/changes.patch"
          if [[ ! -s "$RUNNER_TEMP/evidence/changes.patch" ]]; then
            printf '\n## Changes\n\nNone, so nothing will be published.\n' >> "$RUNNER_TEMP/evidence/summary.md"
            echo "::error::agent made no changes"
            exit 1
          fi
          { printf '\n## Changes\n\n```\n'; git diff --cached --stat; printf '```\n'; } >> "$RUNNER_TEMP/evidence/summary.md"
          if git diff --cached --name-only | grep -qE '^(\.github|scripts/agent-worker)/'; then
            echo "::error::patch touches .github/ or scripts/agent-worker/; refusing"
            exit 1
          fi
          git diff --cached --stat

      # Evidence is uploaded even when the agent fails, so the run can be debugged behind SSO
      - name: Azure login again (GitHub OIDC)
        if: always() && steps.anthropic.outcome == 'success'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.ARTIFACTS_CLIENT_ID }}
          tenant-id: ${{ vars.ARTIFACTS_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Upload evidence to artifacts.go
        id: evidence
        if: always() && steps.anthropic.outcome == 'success'
        run: |
          set -euo pipefail
          # The run details go last in summary.md
          if [[ -f "$RUNNER_TEMP/evidence/run-details.md" ]]; then
            cat "$RUNNER_TEMP/evidence/run-details.md" >> "$RUNNER_TEMP/evidence/summary.md"
            rm "$RUNNER_TEMP/evidence/run-details.md"
          fi
          az storage blob upload-batch --auth-mode login --only-show-errors \
            --account-name "$ARTIFACTS_ACCOUNT" --destination "$ARTIFACTS_CONTAINER" \
            --destination-path "$EVIDENCE_PREFIX" --source "$RUNNER_TEMP/evidence" > /dev/null
          url="https://artifacts.go.duckduckgo.com/view/$ARTIFACTS_CONTAINER/$EVIDENCE_PREFIX"
          echo "Evidence (SSO): $url/"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            if [[ -s "$RUNNER_TEMP/evidence/changes.patch" ]]; then
              echo "**Approving agent-publish opens a draft PR with this patch. Review it first (SSO):**"
              echo "- [changes.patch]($url/changes.patch)"
            else
              echo "**No patch, so nothing will be published (SSO):**"
            fi
            echo "- [summary.md]($url/summary.md) (the agent's summary and run details)"
            echo "- [result.json]($url/result.json) (raw agent output)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if the agent failed
        if: env.rc != '0'
        run: |
          echo "::error::claude exited with $rc"
          exit 1

  # Moves the Asana task to Waiting for approval, with the evidence links and what to click to approve
  approval-request:
    needs: agent
    if: needs.agent.result == 'success'
    runs-on: ubuntu-latest
    environment: agent-worker
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: worker
          sparse-checkout: scripts/agent-worker
          persist-credentials: false

      - name: Set Agent Status to Waiting for approval
        env:
          ASANA_APP_CLIENT_ID: ${{ secrets.ASANA_APP_CLIENT_ID }}
          ASANA_APP_CLIENT_SECRET: ${{ secrets.ASANA_APP_CLIENT_SECRET }}
          ASANA_APP_REFRESH_TOKEN: ${{ secrets.ASANA_APP_REFRESH_TOKEN }}
          TASK_GID: ${{ inputs.task_gid }}
          STAGE: approval
          EVIDENCE_URL: ${{ needs.agent.outputs.evidence_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 -I worker/scripts/agent-worker/set_agent_status.py

  # A person reviews the evidence and approves the agent-publish environment before anything in
  # this public repo is created. The patch comes from artifacts.go, never a public artifact
  publish:
    needs: agent
    runs-on: ubuntu-latest
    environment: agent-publish
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    env:
      BRANCH: agent/worker-${{ github.run_id }}
    outputs:
      pr_url: ${{ steps.pr.outputs.url }}
    steps:
      # Pushes and PRs made with GITHUB_TOKEN don't start CI, so publish with the GitHub App when the
      # agent-publish environment has it, scoped to this repo
      - name: GitHub App token
        id: app-token
        if: vars.AGENT_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AGENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEFAULT_BRANCH }}
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Azure login (GitHub OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.ARTIFACTS_CLIENT_ID }}
          tenant-id: ${{ vars.ARTIFACTS_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Download patch from artifacts.go
        run: |
          set -euo pipefail
          az storage blob download --auth-mode login --only-show-errors \
            --account-name "$ARTIFACTS_ACCOUNT" --container-name "$ARTIFACTS_CONTAINER" \
            --name "$EVIDENCE_PREFIX/changes.patch" --file "$RUNNER_TEMP/changes.patch" > /dev/null
          az storage blob download --auth-mode login --only-show-errors \
            --account-name "$ARTIFACTS_ACCOUNT" --container-name "$ARTIFACTS_CONTAINER" \
            --name "$EVIDENCE_PREFIX/pr.md" --file "$RUNNER_TEMP/pr.md" > /dev/null 2>&1 || echo "no PR text from the agent"

      # The agent's title and description, as the approver saw them in summary.md, or a fallback
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: worker
          sparse-checkout: scripts/agent-worker
          persist-credentials: false

      - name: PR text
        env:
          TASK_GID: ${{ inputs.task_gid }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 -I worker/scripts/agent-worker/pr_text.py render "$RUNNER_TEMP/pr.md" "$RUNNER_TEMP"

      - name: Apply, commit, push
        run: |
          set -euo pipefail
          git switch -c "$BRANCH"
          git apply --index "$RUNNER_TEMP/changes.patch"
          if git diff --cached --name-only | grep -qE '^(\.github|scripts/agent-worker)/'; then
            echo "::error::patch touches .github/ or scripts/agent-worker/; refusing"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -F "$RUNNER_TEMP/title.txt"
          git push -q -u origin "$BRANCH"

      # In the repo's PR template shape: the Asana link, the agent's description and the run link
      - name: Open draft PR
        id: pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          set -euo pipefail
          gh pr create --draft --base "$DEFAULT_BRANCH" --head "$BRANCH" \
            --title "$(cat "$RUNNER_TEMP/title.txt")" --body-file "$RUNNER_TEMP/body.md" \
            > "$RUNNER_TEMP/pr-url"
          echo "url=$(tail -n 1 "$RUNNER_TEMP/pr-url")" >> "$GITHUB_OUTPUT"

  # Sets the task's Agent Status from how the run ended: PR open with the PR link, or Needs attention.
  # Acts as the Apple Agent Asana App Actor, on a fresh runner so nothing the agent wrote runs next to it
  status:
    needs: [agent, publish]
    if: always()
    runs-on: ubuntu-latest
    environment: agent-worker
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: worker
          sparse-checkout: scripts/agent-worker
          persist-credentials: false

      - name: Set Agent Status
        env:
          ASANA_APP_CLIENT_ID: ${{ secrets.ASANA_APP_CLIENT_ID }}
          ASANA_APP_CLIENT_SECRET: ${{ secrets.ASANA_APP_CLIENT_SECRET }}
          ASANA_APP_REFRESH_TOKEN: ${{ secrets.ASANA_APP_REFRESH_TOKEN }}
          TASK_GID: ${{ inputs.task_gid }}
          AGENT: ${{ needs.agent.result }}
          EVIDENCE_URL: ${{ needs.agent.outputs.evidence_url }}
          PUBLISH: ${{ needs.publish.result }}
          PR_URL: ${{ needs.publish.outputs.pr_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 -I worker/scripts/agent-worker/set_agent_status.py
