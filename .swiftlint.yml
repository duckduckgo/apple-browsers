                    \/\/  limitations under the License\.
                    \/\/

# General Config - Single config for all platforms
excluded:
  # Build artifacts
  - "**/DerivedData"
  - "**/.build"
  - "**/vendor"
  - "**/.ruby-lsp"
  - "**/release"
  
  # Generated/tooling files
  - "**/Package.swift"
  - "**/fastlane/**"
  - "**/scripts/**"
  
  # Third-party/vendored code
  - "**/Carthage/**"
  - iOS/PacketTunnelProvider/ProxyServer
  - SharedPackages/ReaderMode/Sources/Trafilatura
  
  # Copy files
  - "**/UserText.swift"

  # Specific files to exclude
  - SharedPackages/BrowserServicesKit/Sources/RemoteMessaging/Model/AnyDecodable.swift
  - SharedPackages/Infrastructure/SystemFrameworksExtensions/Sources/ConcurrencyExtensions/AsyncStream.swift
