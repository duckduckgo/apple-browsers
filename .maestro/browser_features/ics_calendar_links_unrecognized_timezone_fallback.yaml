# ics_calendar_links_unrecognized_timezone_fallback.yaml
# .ics file with an unresolvable TZID should show the unsupported-timezone toast and fall
# back to QuickLook.
appId: com.duckduckgo.mobile.ios
tags:
    - iphone
    - release

---

- runFlow:
    file: ../shared/setup.yaml

- assertVisible:
    id: "searchEntry"
- tapOn:
    id: "searchEntry"
- inputText: "https://privacy-test-pages.site/features/download/calendar-unrecognized-timezone.ics"
- pressKey: Enter

- extendedWaitUntil:
    visible: "Unsupported time zone. Try opening the downloaded file instead."
    timeout: 10000
