appId: com.duckduckgo.mobile.ios

---

# Seeds a synthetic usage-limit snapshot via Debug ▸ AI Chat ▸ Duck.ai Usage Warnings, which writes
# the reserved `usageLimits` entry the web app writes, so the real read path drives the footer.
# Free-tier users get an empty snapshot until a window is already blocked, so there is no way to
# reach the approaching cards without this. Caller must pass PRESET — one of the labels in
# AIChatUsageWarningsSection.presets. Starts and ends on the browser, with the omnibar unfocused.
#
# The debug row is scrolled to here rather than through shared/open_debug_menu.yaml: it is the last
# row in Settings, so that flow's `centerElement: true` can never be satisfied and the scroll runs
# out having walked straight past it.
- tapOn: "Browsing Menu"
- tapOn: "Settings"
- scrollUntilVisible:
    element:
        text: "All debug options"
    direction: DOWN
    centerElement: false
- tapOn: "All debug options"

# Filter rather than scroll. "AI Chat" is the first row of the Screens section but still sits below
# the fold, and `scrollUntilVisible` only scrolls down: a fling that carries past the row cannot
# recover, so it walks the remaining ~50 rows and fails with `No visible element found: "AI Chat"`.
# That flaked on whichever warning flow drew it, and neither an animation wait nor a row assertion
# helped, because the transition was never the problem. Filtering needs no scrolling at all.
#
# `tapOn` waits for its element, and "Filter" exists only on the debug screen, so this also covers
# the screen transition that the previous animation wait was there for.
#
# "ai ch" rather than the full title: it matches exactly one of the 51 screen titles, it matches no
# feature-flag rawValue (those are camelCase, so the space rules them out), and it keeps the text
# we type from colliding with the row we tap next.
- tapOn: "Filter"
- inputText: "ai ch"
- tapOn: "AI Chat"

- scrollUntilVisible:
    element:
        text: "${PRESET}"
    direction: DOWN
    centerElement: false
- tapOn: "${PRESET}"

- tapOn: "Debug"
- tapOn: "Settings"
- tapOn: "Done"
