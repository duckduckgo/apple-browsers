# ics_calendar_links_happy_path.yaml
# Single-VEVENT .ics file should present EKEventEditViewController without a fallback toast.
# Requires iOS 17+. URL points at the local fixture server during development; swap to
# https://privacy-test-pages.site/features/download/calendar-single.ics once the
# eduardo/ics-download-fixtures branch lands on privacy-test-pages.
appId: com.duckduckgo.mobile.ios
tags:
    - iphone
    - release

---

- runFlow:
    file: ../shared/setup.yaml

- assertVisible:
    id: "searchEntry"
- tapOn:
    id: "searchEntry"
- inputText: "http://localhost:8000/single-event.ics"
- pressKey: Enter

# EKEventEditViewController's nav bar shows "Cancel" and "Add" buttons. Asserting on those
# avoids matching anything in our app chrome.
- extendedWaitUntil:
    visible: "Add"
    timeout: 10000
- assertVisible: "Cancel"

# No fallback toast for a happy-path single event.
- assertNotVisible: "Multiple events aren't supported. Try opening the downloaded file instead."
- assertNotVisible: "This file can't be processed. Try opening the downloaded file instead."

- tapOn: "Cancel"
