appId: com.duckduckgo.mobile.ios
# Creates a Sync account on this device using the simplified Sync setup UI.
---

- tapOn: Sync & Backup
- assertVisible: Sync & Backup
- tapOn:
    id: "SyncToggle"
- inputText: "0000"
- pressKey: Enter
- extendedWaitUntilVisible:
    element:
      text: Sync your data with another device?
    timeout: 30000
- tapOn: Not Now
- assertVisible: Synced Devices
