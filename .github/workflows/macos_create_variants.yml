name: macOS - Create DMG Variants

defaults:
  run:
    working-directory: macOS

on:
  workflow_dispatch:
    inputs:
      dmg-url:
        description: "DMG URL to download (overrides RELEASE_DMG_URL variable when set)"
        required: false
        type: string
      variants-per-job:
        description: "Number of variants that a single job creates."
        required: false
        type: string
        default: "10"

  workflow_call:
    inputs:
      dmg-url:
        description: "DMG URL to download (overrides RELEASE_DMG_URL variable when set)"
        required: false
        type: string
      variants-per-job:
        description: "Number of variants that a single job creates."
        required: false
        type: string
        default: "10"
    secrets:
      ASANA_ACCESS_TOKEN:
        required: true
      AWS_ACCESS_KEY_ID_RELEASE_S3:
        required: true
      AWS_SECRET_ACCESS_KEY_RELEASE_S3:
        required: true
      MM_WEBHOOK_URL:
        required: true

jobs:

  set-up-variants:

    name: Set Up Variants

    runs-on: macos-26
    timeout-minutes: 15

    outputs:
      build-variants: ${{ steps.get-build-variants.outputs.build-variants }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Print macOS version
        run: sw_vers

      - name: Fetch Build Variants
        id: get-build-variants
        uses: ./.github/actions/asana-get-build-variants-list
        with:
          access-token: ${{ secrets.ASANA_ACCESS_TOKEN }}
          atb-asana-task-id: ${{ vars.DMG_VARIANTS_LIST_TASK_ID }}
          origin-asana-section-id: ${{ vars.DMG_VARIANTS_ORIGIN_SECTION_ID }}
          variants-per-job: ${{ inputs.variants-per-job || '10' }}

  download-dmg-and-upload-artifact:

    name: Download Release App and upload artifact

    runs-on: macos-26
    timeout-minutes: 15

    steps:

      - name: Check out the code
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github
            macOS/Gemfile
            macOS/Gemfile.lock
            macOS/fastlane
            macOS/scripts

      - name: Print macOS version
        run: sw_vers

      - name: Download release app
        env:
          DMG_URL: ${{ inputs.dmg-url != '' && inputs.dmg-url || vars.RELEASE_DMG_URL }}
        run: |
          curl -fLSs "${DMG_URL}" --output duckduckgo.dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v6
        with:
          name: duckduckgo-dmg
          path: ${{ github.workspace }}/macOS/duckduckgo.dmg
          retention-days: 1

  create-variants:

    # Each matrix entry is a batch of variants that a single job creates one by one.
    # The number of variants per batch is controlled by the variants-per-job input.
    name: Create Variants (batch ${{ matrix.batch }}, ${{ matrix.count }} variants)
    needs: [set-up-variants, download-dmg-and-upload-artifact]

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.set-up-variants.outputs.build-variants) }}
    uses: ./.github/workflows/macos_create_variant.yml
    with:
      variants: ${{ matrix.variants }}
    secrets: inherit

  mattermost:

    name: Send Mattermost message
    needs: [create-variants]
    if: ${{ always() }}
    runs-on: macos-26

    env:
      success: ${{ needs.create-variants.result == 'success' }}
      failure: ${{ needs.create-variants.result == 'failure' }}

    steps:
      - name: Check out the code
        if: ${{ env.success || env.failure }} # Don't execute when cancelled
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github
            macOS/Gemfile
            macOS/Gemfile.lock
            macOS/fastlane
            macOS/scripts

      - name: Print macOS version
        if: ${{ env.success || env.failure }} # Don't execute when cancelled
        run: sw_vers

      - name: Setup Ruby and dependencies
        if: ${{ env.success || env.failure }} # Don't execute when cancelled
        uses: ./.github/actions/setup-ruby
        with:
          working-directory: macOS
          cache-key-prefix: macos-ruby

      - name: Send Mattermost message
        if: ${{ env.success || env.failure }} # Don't execute when cancelled
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          bundle exec fastlane run mattermost_send_message \
            mattermost_webhook_url:${{ secrets.MM_WEBHOOK_URL }} \
            github_handle:${{ github.actor }} \
            template_name:$([[ "${{ env.success }}" == "true" ]] && echo "variants-release-published" || echo "variants-release-failed")
