name: macOS - Code Freeze

defaults:
  run:
    working-directory: macOS

on:
  workflow_dispatch:
    inputs:
      release_branch:
        description: "Existing release branch to run the tests against"
        required: false
        type: string
        default: release/macos/1.212.0

concurrency:
  group: 'macos-code-freeze-e2e-test'
  cancel-in-progress: false

jobs:

  create_release_branch:
    name: Create Release Branch

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    outputs:
      release_branch_name: ${{ steps.make_release_branch.outputs.release_branch_name }}

    steps:
      - name: Use existing release branch
        id: make_release_branch
        run: echo "release_branch_name=${{ inputs.release_branch }}" >> "$GITHUB_OUTPUT"

  ui_tests:

    name: UI Tests

    needs: create_release_branch
    uses: ./.github/workflows/macos_ui_tests.yml
    with:
      branch: ${{ needs.create_release_branch.outputs.release_branch_name }}
    secrets: inherit

  sync_end_to_end_tests:

    name: Sync End-to-End Tests

    needs: create_release_branch
    uses: ./.github/workflows/macos_sync_end_to_end.yml
    with:
      branch: ${{ needs.create_release_branch.outputs.release_branch_name }}
    secrets: inherit
